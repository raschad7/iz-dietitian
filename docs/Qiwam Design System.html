  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

tyle>\n<style>\n:root{\n  /* ── Olive (primary) ── */\n  --olive-50:#F5F8EF; --olive-100:#E8F0DA; --olive-200:#D2E2B9; --olive-300:#B2CE8D;\n  --olive-400:#8CB35C; --olive-500:#6B9639; --olive-600:#4D7428; --olive-700:#3D5C21;\n  --olive-800:#2E461A; --olive-900:#223414; --olive-950:#16220D;\n  /* ── Lime (accent) ── */\n  --lime-100:#F2FBC9; --lime-200:#E6F79A; --lime-300:#D9F25C; --lime-400:#CBEA24;\n  --lime-500:#B0CE12; --lime-600:#8CA60C; --lime-700:#6B7F0A;\n  /* ── Warm neutrals ── */\n  --n-0:#FFFFFF; --n-25:#FCFBF7; --n-50:#F7F5EF; --n-100:#EFEDE4; --n-200:#E2DFD3;\n  --n-300:#CDC9B9; --n-400:#A8A493; --n-500:#837F6E; --n-600:#605D50; --n-700:#46443B;\n  --n-800:#2F2E28; --n-900:#1C1B17;\n  /* ── Support ── */\n  --amber-100:#FBF0D8; --amber-300:#E8C46A; --amber-600:#9B6A0C; --amber-700:#7A5209;\n  --clay-100:#FAE9E4; --clay-300:#E8A08F; --clay-600:#A33422; --clay-700:#82291B;\n\n  --radius-sm:8px; --radius-md:12px; --radius-lg:16px; --radius-xl:24px; --radius-pill:999px;\n  --shadow-1:0 1px 2px rgba(34,52,20,.06), 0 1px 3px rgba(34,52,20,.05);\n  --shadow-2:0 2px 6px rgba(34,52,20,.07), 0 8px 20px rgba(34,52,20,.06);\n  --shadow-3:0 12px 32px rgba(34,52,20,.12);\n\n  --sans:\"IBM Plex Sans Arabic\",\"IBM Plex Sans\",\"Segoe UI\",Tahoma,Arial,sans-serif;\n  --display:\"Readex Pro\",\"IBM Plex Sans Arabic\",\"Segoe UI\",Tahoma,Arial,sans-serif;\n  --mono:\"IBM Plex Mono\",ui-monospace,Menlo,monospace;\n}\n*{box-sizing:border-box}\nbody{margin:0;background:var(--n-25);color:var(--n-900);font-family:var(--sans);font-size:16px;line-height:1.65;-webkit-font-smoothing:antialiased}\n.wrap{max-width:1080px;margin:0 auto;padding:0 24px 96px}\nh1,h2,h3,h4{font-family:var(--display);font-weight:600;line-height:1.25;margin:0}\na{color:var(--olive-700)}\np{margin:0 0 14px}\ncode{font-family:var(--mono);font-size:.86em;background:var(--n-100);padding:2px 6px;border-radius:5px;color:var(--n-800)}\nhr{border:0;border-top:1px solid var(--n-200);margin:56px 0}\n\n/* Cover */\n.cover{background:var(--olive-800);color:var(--n-25);padding:72px 0 64px;position:relative;overflow:hidden}\n.cover .wrap{position:relative;z-index:2}\n.cover .eyebrow{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--lime-400);font-weight:500;margin-bottom:20px}\n.cover h1{font-size:clamp(38px,6vw,60px);font-weight:500;letter-spacing:-.02em}\n.cover .ar{font-size:clamp(30px,5vw,46px);color:var(--lime-400);font-weight:400;margin-top:4px;direction:rtl}\n.cover p{max-width:620px;color:var(--olive-200);margin-top:20px;font-size:17px}\n.cover-leaf{position:absolute;inset-inline-end:-90px;top:-40px;width:420px;height:420px;opacity:.06;z-index:1}\n.meta-row{display:flex;flex-wrap:wrap;gap:28px;margin-top:36px;padding-top:24px;border-top:1px solid rgba(210,226,185,.25)}\n.meta-row div{font-size:13px;color:var(--olive-200)}\n.meta-row strong{display:block;color:var(--n-25);font-weight:500;font-size:15px;margin-top:2px}\n\n/* Section scaffolding */\nsection{padding-top:64px}\n.sec-num{font-family:var(--mono);font-size:12px;color:var(--olive-600);letter-spacing:.1em;margin-bottom:8px}\nsection > h2{font-size:30px;letter-spacing:-.01em;margin-bottom:6px}\n.lede{color:var(--n-600);max-width:720px;margin-bottom:28px}\nh3{font-size:19px;margin:32px 0 12px}\nh4{font-size:15px;font-weight:600;margin:22px 0 8px;color:var(--n-800)}\n\n/* Tables */\ntable{width:100%;border-collapse:collapse;font-size:14px;margin:14px 0 24px;background:var(--n-0);border:1px solid var(--n-200);border-radius:var(--radius-md);overflow:hidden}\nth{text-align:left;background:var(--olive-50);color:var(--olive-800);font-weight:600;font-size:12.5px;letter-spacing:.03em;text-transform:uppercase;padding:11px 14px;border-bottom:1px solid var(--n-200)}\ntd{padding:11px 14px;border-bottom:1px solid var(--n-100);vertical-align:top;color:var(--n-700)}\ntr:last-child td{border-bottom:0}\ntd code{white-space:nowrap}\n.tok{font-family:var(--mono);font-size:12.5px;color:var(--olive-700);white-space:nowrap}\n\n/* Callouts */\n.note{border-inline-start:3px solid var(--olive-600);background:var(--olive-50);padding:14px 18px;border-radius:0 var(--radius-sm) var(--radius-sm) 0;margin:20px 0;font-size:14.5px;color:var(--n-700)}\n.note strong{color:var(--olive-800)}\n.warn{border-inline-start:3px solid var(--amber-600);background:var(--amber-100)}\n.warn strong{color:var(--amber-700)}\n\n/* Swatches */\n.scale{display:grid;grid-template-columns:repeat(auto-fit,minmax(88px,1fr));gap:6px;margin:12px 0 22px}\n.sw{border-radius:var(--radius-sm);padding:10px 8px 8px;height:86px;display:flex;flex-direction:column;justify-content:flex-end;font-size:11px;font-family:var(--mono);line-height:1.35;border:1px solid rgba(28,27,23,.08)}\n.sw b{font-weight:500;display:block}\n.sw span{opacity:.75;font-size:10px}\n\n/* Direction cards */\n.dirs{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px;margin:20px 0}\n.dir{border:1px solid var(--n-200);border-radius:var(--radius-lg);overflow:hidden;background:var(--n-0)}\n.dir .top{height:120px;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:28px;direction:rtl}\n.dir .body{padding:16px 18px 20px}\n.dir h4{margin:0 0 6px;font-family:var(--display);font-size:17px}\n.dir .tagline{font-size:12px;color:var(--n-500);margin-bottom:10px;font-family:var(--mono)}\n.dir p{font-size:14px;color:var(--n-600);margin:0 0 10px}\n.dir .verdict{font-size:13px;padding-top:10px;border-top:1px solid var(--n-100);color:var(--n-700)}\n.pick{border:2px solid var(--olive-600);box-shadow:var(--shadow-2)}\n.pick-flag{background:var(--olive-600);color:#fff;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding:5px 12px;text-align:center}\n\n/* Type specimens */\n.spec{background:var(--n-0);border:1px solid var(--n-200);border-radius:var(--radius-lg);padding:22px 24px;margin:14px 0}\n.spec .lbl{font-family:var(--mono);font-size:11px;color:var(--n-500);margin-bottom:10px;letter-spacing:.05em}\n.ar-sample{direction:rtl;font-family:var(--display)}\n\n/* Mock devices */\n.mock-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:24px;align-items:start}\n.phone{width:330px;max-width:100%;margin:0 auto;background:var(--n-25);border:9px solid var(--olive-950);border-radius:34px;overflow:hidden;box-shadow:var(--shadow-3);direction:rtl;font-size:14px}\n.ph-status{background:var(--olive-800);color:var(--olive-200);font-size:10px;padding:6px 16px;display:flex;justify-content:space-between;font-family:var(--mono)}\n.ph-head{background:var(--olive-800);color:#fff;padding:6px 18px 18px}\n.ph-head .greet{font-size:12px;color:var(--olive-200)}\n.ph-head .name{font-family:var(--display);font-size:20px;font-weight:500}\n.ph-body{padding:16px 14px 8px;background:var(--n-25)}\n.card{background:var(--n-0);border:1px solid var(--n-200);border-radius:var(--radius-lg);padding:14px;margin-bottom:12px;box-shadow:var(--shadow-1)}\n.card-title{font-family:var(--display);font-size:15px;font-weight:500;margin-bottom:4px;color:var(--n-900)}\n.card-sub{font-size:12px;color:var(--n-600)}\n.tabbar{display:flex;background:var(--n-0);border-top:1px solid var(--n-200);padding:8px 4px 12px}\n.tabbar div{flex:1;text-align:center;font-size:10.5px;color:var(--n-500)}\n.tabbar div.on{color:var(--olive-700);font-weight:600}\n.tabbar .ic{display:block;width:22px;height:22px;margin:0 auto 3px;border-radius:7px;background:var(--n-200)}\n.tabbar div.on .ic{background:var(--olive-600)}\n\n/* Balance band — signature element */\n.band{position:relative;height:34px;background:var(--n-100);border-radius:var(--radius-pill);overflow:hidden;margin:12px 0 6px}\n.band .comfort{position:absolute;top:0;bottom:0;background:var(--lime-300);border-inline-start:2px solid var(--lime-600);border-inline-end:2px solid var(--lime-600)}\n.band .marker{position:absolute;top:3px;bottom:3px;width:6px;border-radius:3px;background:var(--olive-900)}\n.band-legend{display:flex;justify-content:space-between;font-size:11px;color:var(--n-600);font-family:var(--mono)}\n\n/* Status chips */\n.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}\n.chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;padding:5px 12px;border-radius:var(--radius-pill);border:1px solid transparent;font-weight:500;line-height:1.4}\n.chip .g{width:14px;height:14px;display:inline-flex;align-items:center;justify-content:center;font-size:10px;border-radius:50%;flex:0 0 auto}\n.c-ok{background:var(--olive-100);color:var(--olive-800);border-color:var(--olive-300)}\n.c-ok .g{background:var(--olive-700);color:#fff}\n.c-att{background:var(--amber-100);color:var(--amber-700);border-color:var(--amber-300)}\n.c-att .g{background:var(--amber-700);color:#fff}\n.c-none{background:var(--n-100);color:var(--n-700);border:1px dashed var(--n-500)}\n.c-none .g{border:1.5px dashed var(--n-600)}\n.c-med{background:var(--clay-100);color:var(--clay-700);border-color:var(--clay-300)}\n.c-med .g{background:var(--clay-700);color:#fff}\n.c-rest{background:var(--olive-50);color:var(--olive-700);border-color:var(--olive-200)}\n.c-rest .g{background:var(--olive-400);color:#fff}\n\n/* Streak week */\n.week{display:flex;gap:6px;direction:rtl}\n.day{flex:1;text-align:center}\n.day .dot{height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;border:1px solid var(--n-200);background:var(--n-50);color:var(--n-500)}\n.day.done .dot{background:var(--olive-600);color:#fff;border-color:var(--olive-600)}\n.day.rest .dot{background:var(--olive-50);color:var(--olive-700);border:1px solid var(--olive-300)}\n.day.miss .dot{background:var(--n-50);border:1px dashed var(--n-500);color:var(--n-600)}\n.day .lb{font-size:10px;color:var(--n-500);margin-top:5px}\n\n/* Buttons */\n.btns{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:12px 0}\n.btn{font-family:var(--sans);font-size:14px;font-weight:600;padding:11px 20px;border-radius:var(--radius-sm);border:1px solid transparent;cursor:pointer;min-height:44px;display:inline-flex;align-items:center;gap:8px}\n.btn-primary{background:var(--olive-600);color:#fff}\n.btn-accent{background:var(--lime-400);color:var(--olive-950)}\n.btn-secondary{background:transparent;color:var(--olive-700);border-color:var(--olive-600)}\n.btn-quiet{background:transparent;color:var(--n-700)}\n.btn-danger{background:transparent;color:var(--clay-700);border-color:var(--clay-600)}\n.btn:focus-visible{outline:2px solid var(--lime-400);outline-offset:0;box-shadow:0 0 0 4px var(--olive-900)}\n\n/* Dashboard mock */\n.dash{border:1px solid var(--n-200);border-radius:var(--radius-lg);overflow:hidden;box-shadow:var(--shadow-2);direction:rtl;background:var(--n-25);font-size:13px}\n.dash-top{background:var(--n-0);border-bottom:1px solid var(--n-200);padding:12px 18px;display:flex;align-items:center;gap:14px}\n.dash-grid{display:grid;grid-template-columns:190px 1fr}\n.dash-side{background:var(--olive-800);color:var(--olive-200);padding:16px 12px;min-height:430px}\n.dash-side .nav{padding:9px 12px;border-radius:var(--radius-sm);margin-bottom:4px;font-size:13px}\n.dash-side .nav.on{background:var(--olive-600);color:#fff;font-weight:600}\n.dash-main{padding:18px}\n.dtable{width:100%;border-collapse:collapse;font-size:12.5px;background:var(--n-0);border:1px solid var(--n-200);border-radius:var(--radius-md);overflow:hidden}\n.dtable th{background:var(--n-50);color:var(--n-700);text-align:right;font-size:11px;padding:9px 12px;text-transform:none;letter-spacing:0}\n.dtable td{padding:10px 12px;text-align:right;border-bottom:1px solid var(--n-100)}\n.stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:16px}\n.stat{background:var(--n-0);border:1px solid var(--n-200);border-radius:var(--radius-md);padding:12px}\n.stat .k{font-size:11px;color:var(--n-600)}\n.stat .v{font-family:var(--display);font-size:22px;font-weight:600;color:var(--olive-800)}\n\n/* Do / Don't */\n.dd{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:18px 0}\n.dd > div{border-radius:var(--radius-lg);padding:16px 18px;font-size:14px}\n.do{background:var(--olive-50);border:1px solid var(--olive-200)}\n.dont{background:var(--clay-100);border:1px solid var(--clay-300)}\n.dd h4{margin-top:0}\n.dd ul{margin:0;padding-inline-start:18px;color:var(--n-700)}\n.dd li{margin-bottom:7px}\n\n.rtl{direction:rtl;text-align:right}\n.small{font-size:13px;color:var(--n-600)}\nul.tight{margin:0 0 16px;padding-inline-start:20px}\nul.tight li{margin-bottom:6px;color:var(--n-700)}\n@media(max-width:720px){.dd,.dash-grid{grid-template-columns:1fr}.dash-side{min-height:0}}\n<\u002Fstyle>\n\n<\u002Fhead>\n<body>\n\n<header class=\"cover\">\n  <svg class=\"cover-leaf\" viewBox=\"0 0 100 100\" aria-hidden=\"true\"><path d=\"M78 12C40 18 22 40 22 66c0 8 2 16 6 22 2-30 18-52 44-66-20 16-32 34-34 56 30-2 46-24 46-52 0-6 0-10-6-14z\" fill=\"#CBEA24\"><\u002Fpath><\u002Fsvg>\n  <div class=\"wrap\">\n    <div class=\"eyebrow\">Brand &amp; Design System · v1.0<\u002Fdiv>\n    <h1>Qiwam<\u002Fh1>\n    <div class=\"ar\">قوام<\u002Fdiv>\n    <p>A nutrition platform for Arabic-speaking nutritionists and their clients. One resolved system: brand personality, palette, typography, tokens, components, and the interaction patterns that keep progress honest without making anyone feel judged.<\u002Fp>\n    <div class=\"meta-row\">\n      <div>Products<strong>Nutritionist dashboard · Client mobile app<\u002Fstrong><\u002Fdiv>\n      <div>Locales<strong>العربية (RTL) · English (LTR)<\u002Fstrong><\u002Fdiv>\n      <div>Contrast target<strong>WCAG 2.2 AA — verified<\u002Fstrong><\u002Fdiv>\n      <div>Primary / Accent<strong>#4D7428 · #CBEA24<\u002Fstrong><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fheader>\n\n<div class=\"wrap\">\n\n<!-- 1 -->\n<section id=\"personality\">\n  <div class=\"sec-num\">01<\u002Fdiv>\n  <h2>Brand personality<\u002Fh2>\n  <p class=\"lede\">The name does the strategic work. <strong>قوام<\u002Fstrong> means balance, moderation, and sound proportion — not restriction, not transformation. Every decision below is downstream of that word.<\u002Fp>\n\n  <table>\n    <tbody><tr><th style=\"width:20%\">Trait<\u002Fth><th style=\"width:38%\">What it means in product<\u002Fth><th>What it rules out<\u002Fth><\u002Ftr>\n    <tr><td><strong>Balanced<\u002Fstrong><br><span class=\"tok\">متوازن<\u002Fspan><\u002Ftd><td>Progress is shown as a comfortable <em>range<\u002Fem>, not a target you hit or miss. Nothing in the UI can be \"perfect.\"<\u002Ftd><td>Bullseye gauges, 100% rings, \"goal achieved\" confetti<\u002Ftd><\u002Ftr>\n    <tr><td><strong>Calm<\u002Fstrong><br><span class=\"tok\">هادئ<\u002Fspan><\u002Ftd><td>Low-saturation surfaces, slow motion, no urgency mechanics, no red unless it is medical.<\u002Ftd><td>Countdown timers, streak-loss alarms, push spam<\u002Ftd><\u002Ftr>\n    <tr><td><strong>Warm<\u002Fstrong><br><span class=\"tok\">دافئ<\u002Fspan><\u002Ftd><td>Warm off-white canvas, warm-grey neutrals, olive-tinted shadows. Human-sounding copy in second person.<\u002Ftd><td>Pure #FFF backgrounds, cold greys, blue anything<\u002Ftd><\u002Ftr>\n    <tr><td><strong>Credible<\u002Fstrong><br><span class=\"tok\">موثوق<\u002Fspan><\u002Ftd><td>Data is legible, sourced, and dated. The nutritionist's voice is visibly distinct from the app's voice.<\u002Ftd><td>Anonymous AI-tone advice, decorative charts, fake precision<\u002Ftd><\u002Ftr>\n    <tr><td><strong>Natural<\u002Fstrong><br><span class=\"tok\">طبيعي<\u002Fspan><\u002Ftd><td>Green comes from the palette and photography, not from leaf icons scattered through the UI.<\u002Ftd><td>Leaf bullets, leaf spinners, kraft-paper texture<\u002Ftd><\u002Ftr>\n    <tr><td><strong>Premium<\u002Fstrong><br><span class=\"tok\">راقٍ<\u002Fspan><\u002Ftd><td>Earned by spacing, typographic care, and restraint — one accent colour used sparingly.<\u002Ftd><td>Gradients, gold, glassmorphism, badge clutter<\u002Ftd><\u002Ftr>\n  <\u002Ftbody><\u002Ftable>\n\n  <h3>Voice<\u002Fh3>\n  <p>Second person, present tense, active voice. The app describes and observes; it never grades. Arabic copy uses Modern Standard Arabic with a conversational register — understandable across the Levant and Gulf, never stiff.<\u002Fp>\n  <table>\n    <tbody><tr><th style=\"width:33%\">Instead of<\u002Fth><th style=\"width:33%\">Write<\u002Fth><th>Why<\u002Fth><\u002Ftr>\n    <tr><td class=\"rtl\">فشلت في تحقيق هدفك اليوم<\u002Ftd><td class=\"rtl\">لم تُسجَّل وجبات اليوم — يمكنك إضافتها الآن<\u002Ftd><td>Names the state and the next action; assigns no blame<\u002Ftd><\u002Ftr>\n    <tr><td class=\"rtl\">أطعمة ممنوعة<\u002Ftd><td class=\"rtl\">خيارات بين الحين والآخر<\u002Ftd><td>No food is forbidden or \"bad\"<\u002Ftd><\u002Ftr>\n    <tr><td class=\"rtl\">وجبة غش<\u002Ftd><td class=\"rtl\">وجبة مرنة<\u002Ftd><td>Removes the moral frame from eating<\u002Ftd><\u002Ftr>\n    <tr><td class=\"rtl\">خسرت سلسلتك!<\u002Ftd><td class=\"rtl\">بدأنا أسبوعًا جديدًا — ٤ من ٧ الأسبوع الماضي<\u002Ftd><td>Loss framing drives churn in habit products<\u002Ftd><\u002Ftr>\n    <tr><td class=\"rtl\">وزن مثالي<\u002Ftd><td class=\"rtl\">النطاق المريح لك<\u002Ftd><td>\"Ideal\" is a diet-culture word, not a clinical one<\u002Ftd><\u002Ftr>\n  <\u002Ftbody><\u002Ftable>\n<\u002Fsection>\n\n<hr>\n\n<!-- 2 -->\n<section id=\"directions\">\n  <div class=\"sec-num\">02<\u002Fdiv>\n  <h2>Three visual directions<\u002Fh2>\n  <p class=\"lede\">All three are built from the same reference palette. They differ in where the weight sits: in surface, in type, or in energy.<\u002Fp>\n\n  <div class=\"dirs\">\n    <div class=\"dir\">\n      <div class=\"top\" style=\"background:var(--olive-800);color:var(--lime-400)\">بستان<\u002Fdiv>\n      <div class=\"body\">\n        <h4>A · Bustan — the walled garden<\u002Fh4>\n        <div class=\"tagline\">surface-led<\u002Fdiv>\n        <p>Deep olive is the default canvas everywhere. Content sits on layered olive tints; lime is used as a botanical highlight. Large organic curves, soft depth.<\u002Fp>\n        <div class=\"verdict\"><strong>Rejected:<\u002Fstrong> gorgeous in a hero, exhausting in a data table. Dark-first fails older clients reading outdoors, and long Arabic text on dark green loses legibility at 14px.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"dir pick\">\n      <div class=\"pick-flag\">Recommended<\u002Fdiv>\n      <div class=\"top\" style=\"background:var(--n-25);color:var(--olive-800);border-bottom:1px solid var(--n-200)\">ميزان<\u002Fdiv>\n      <div class=\"body\">\n        <h4>B · Mizan — the quiet instrument<\u002Fh4>\n        <div class=\"tagline\">typography-led<\u002Fdiv>\n        <p>Warm off-white canvas. Olive behaves as ink, not decoration. Lime appears once per screen, on the thing that matters most. Arabic typography carries the personality; charts read as calm bands.<\u002Fp>\n        <div class=\"verdict\"><strong>Chosen:<\u002Fstrong> scales from a five-row dashboard table to a phone screen at 200% text size without breaking. Reads premium and clinical-adjacent without looking like a clinic.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"dir\">\n      <div class=\"top\" style=\"background:var(--lime-400);color:var(--olive-950)\">نبض<\u002Fdiv>\n      <div class=\"body\">\n        <h4>C · Nabd — the coach<\u002Fh4>\n        <div class=\"tagline\">energy-led<\u002Fdiv>\n        <p>Lime-forward blocks, bold display type, heavy gamification: streak fire, levels, badges, progress explosions.<\u002Fp>\n        <div class=\"verdict\"><strong>Rejected:<\u002Fstrong> lands squarely in slimming-centre territory and rewards streak anxiety. Also fails contrast repeatedly — lime carries text at only 1.37:1 on white.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<hr>\n\n<!-- 3 -->\n<section id=\"recommended\">\n  <div class=\"sec-num\">03<\u002Fdiv>\n  <h2>Recommended direction — \"Mizan\"<\u002Fh2>\n  <p class=\"lede\">Direction B is the system. A and C are not discarded wholesale; each contributes one bounded role, and those boundaries are rules, not suggestions.<\u002Fp>\n\n  <table>\n    <tbody><tr><th style=\"width:24%\">Element<\u002Fth><th>Rule<\u002Fth><\u002Ftr>\n    <tr><td>Default canvas<\u002Ftd><td>Warm off-white <code>#FCFBF7<\u002Fcode>. Cards are pure white to lift off it. Never pure white as the page background.<\u002Ftd><\u002Ftr>\n    <tr><td>Deep olive (from A)<\u002Ftd><td>Reserved for <strong>identity moments only<\u002Fstrong>: app header block, sign-in, empty states, weekly report cover, marketing. Never behind a data table or a form.<\u002Ftd><\u002Ftr>\n    <tr><td>Lime (energy from C)<\u002Ftd><td><strong>One lime element per screen.<\u002Fstrong> It marks the single most important thing — usually the comfortable range on the balance band, or the primary action in a completion flow.<\u002Ftd><\u002Ftr>\n    <tr><td>Motion<\u002Ftd><td>200–260ms, ease-out. The band marker slides; nothing bounces, pulses, or celebrates loudly. <code>prefers-reduced-motion<\u002Fcode> removes all transform animation and keeps opacity fades only.<\u002Ftd><\u002Ftr>\n  <\u002Ftbody><\u002Ftable>\n\n  <h3>The signature: the balance band, not the bullseye<\u002Fh3>\n  <p>Every other nutrition product draws a ring you fill to 100%. Qiwam draws a <strong>band<\u002Fstrong> — a comfortable range, with a marker showing where you are inside it. Being inside the range is the success state. Being outside it is information, not failure. This is the one element the product is remembered by, and it is the visual translation of the word قوام.<\u002Fp>\n\n  <div class=\"spec\">\n    <div class=\"lbl\">SIGNATURE COMPONENT — البطاقة الرئيسية<\u002Fdiv>\n    <div class=\"rtl\" style=\"max-width:420px\">\n      <div style=\"font-family:var(--display);font-size:17px;font-weight:500\">طاقتك اليوم<\u002Fdiv>\n      <div class=\"band\" role=\"img\" aria-label=\"ضمن النطاق المريح\">\n        <div class=\"comfort\" style=\"inset-inline-start:34%;width:36%\"><\u002Fdiv>\n        <div class=\"marker\" style=\"inset-inline-start:52%\"><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"band-legend\"><span>أقل<\u002Fspan><span style=\"color:var(--olive-700);font-weight:600\">النطاق المريح<\u002Fspan><span>أكثر<\u002Fspan><\u002Fdiv>\n      <div class=\"chips\" style=\"margin-top:10px\"><span class=\"chip c-ok\"><span class=\"g\">✓<\u002Fspan> ضمن النطاق<\u002Fspan><\u002Fdiv>\n      <div class=\"small\" style=\"margin-top:6px\">لا يوجد رقم مثالي — النطاق يتغيّر حسب نشاطك ونومك.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <p class=\"small\">Note that the band is labelled with a text chip and an icon as well as colour, and that no number is displayed at all in the default state. The number is available on tap, for clients whose plan includes it.<\u002Fp>\n<\u002Fsection>\n\n<hr>\n\n<!-- 4 -->\n<section id=\"type\">\n  <div class=\"sec-num\">04<\u002Fdiv>\n  <h2>Typography<\u002Fh2>\n  <p class=\"lede\">Two families, both drawn with Arabic as a first-class script rather than a bolted-on extension. This is the single most common failure point in Arabic products, so the choice is deliberate.<\u002Fp>\n\n  <table>\n    <tbody><tr><th style=\"width:22%\">Role<\u002Fth><th style=\"width:26%\">Family<\u002Fth><th>Why this one<\u002Fth><\u002Ftr>\n    <tr><td>Display / headings<\u002Ftd><td><strong>Readex Pro<\u002Fstrong><br><span class=\"tok\">300–700, variable<\u002Fspan><\u002Ftd><td>Designed for high legibility with low-literacy readers, with harmonised Arabic and Latin from the same design brief. Open counters, generous apertures, warm humanist skeleton. Not Cairo (overexposed), not Tajawal (too neutral to carry a brand).<\u002Ftd><\u002Ftr>\n    <tr><td>UI / body / data<\u002Ftd><td><strong>IBM Plex Sans Arabic<\u002Fstrong><br><span class=\"tok\">300–700<\u002Fspan><\u002Ftd><td>Holds up at 13px in dense tables, has true tabular figures, and its Latin sibling keeps mixed Arabic–English strings visually consistent — critical for units, dates, and nutrient names.<\u002Ftd><\u002Ftr>\n    <tr><td>Numeric / code<\u002Ftd><td><strong>IBM Plex Mono<\u002Fstrong><\u002Ftd><td>Token names, IDs, and export values only. Never in client-facing UI.<\u002Ftd><\u002Ftr>\n  <\u002Ftbody><\u002Ftable>\n\n  <div class=\"spec\">\n    <div class=\"lbl\">DISPLAY — READEX PRO 500 / 32px / 1.35<\u002Fdiv>\n    <div class=\"ar-sample\" style=\"font-size:32px;font-weight:500;line-height:1.35\">تقدّمك هذا الشهر يسير بثبات<\u002Fdiv>\n    <div style=\"font-family:var(--display);font-size:32px;font-weight:500;line-height:1.35;color:var(--n-600)\">Your month, steadily<\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"spec\">\n    <div class=\"lbl\">BODY — IBM PLEX SANS ARABIC 400 / 16px / 1.75<\u002Fdiv>\n    <div class=\"rtl\" style=\"font-size:16px;line-height:1.75;max-width:620px\">سجّلت خمسة أيام من سبعة هذا الأسبوع. لاحظت المختصة أنّ طاقتك أفضل في الأيام التي تتناول فيها الإفطار قبل التاسعة. جرّب ذلك ثلاث مرات الأسبوع القادم.<\u002Fdiv>\n  <\u002Fdiv>\n\n  <h3>Type scale<\u002Fh3>\n  <p class=\"small\">Arabic line-height runs one step looser than Latin at the same size because of ascender/descender depth and diacritic clearance. Both values are given; the token switches on <code>:lang()<\u002Fcode>.<\u002Fp>\n  <table>\n    <tbody><tr><th>Token<\u002Fth><th>Size<\u002Fth><th>LH (ar / en)<\u002Fth><th>Weight<\u002Fth><th>Use<\u002Fth><\u002Ftr>\n    <tr><td class=\"tok\">type.display.lg<\u002Ftd><td>40px<\u002Ftd><td>1.35 / 1.25<\u002Ftd><td>500<\u002Ftd><td>Report covers, onboarding<\u002Ftd><\u002Ftr>\n    <tr><td class=\"tok\">type.display.sm<\u002Ftd><td>32px<\u002Ftd><td>1.4 / 1.3<\u002Ftd><td>500<\u002Ftd><td>Screen titles<\u002Ftd><\u002Ftr>\n    <tr><td class=\"tok\">type.heading.lg<\u002Ftd><td>24px<\u002Ftd><td>1.45 / 1.35<\u002Ftd><td>600<\u002Ftd><td>Section headings<\u002Ftd><\u002Ftr>\n    <tr><td class=\"tok\">type.heading.sm<\u002Ftd><td>20px<\u002Ftd><td>1.5 / 1.4<\u002Ftd><td>600<\u002Ftd><td>Card titles<\u002Ftd><\u002Ftr>\n    <tr><td class=\"tok\">type.body.lg<\u002Ftd><td>18px<\u002Ftd><td>1.75 / 1.6<\u002Ftd><td>400<\u002Ftd><td>Nutritionist notes, long reads<\u002Ftd><\u002Ftr>\n    <tr><td class=\"tok\">type.body.md<\u002Ftd><td>16px<\u002Ftd><td>1.75 / 1.6<\u002Ftd><td>400<\u002Ftd><td>Default body — mobile minimum<\u002Ftd><\u002Ftr>\n    <tr><td class=\"tok\">type.body.sm<\u002Ftd><td>14px<\u002Ftd><td>1.7 / 1.55<\u002Ftd><td>400<\u002Ftd><td>Dense dashboard tables<\u002Ftd><\u002Ftr>\n    <tr><td class=\"tok\">type.label<\u002Ftd><td>13px<\u002Ftd><td>1.5 / 1.4<\u002Ftd><td>600<\u002Ftd><td>Form labels, chips<\u002Ftd><\u002Ftr>\n    <tr><td class=\"tok\">type.caption<\u002Ftd><td>12px<\u002Ftd><td>1.5 / 1.45<\u002Ftd><td>400<\u002Ftd><td>Timestamps, helper text — never for essential info<\u002Ftd><\u002Ftr>\n  <\u002Ftbody><\u002Ftable>\n\n  <div class=\"note warn\"><strong>Arabic typography rules — non-negotiable.<\u002Fstrong>\n  <ul class=\"tight\" style=\"margin-top:8px;margin-bottom:0\">\n    <li><strong>No <code>text-transform: uppercase<\u002Fcode>.<\u002Fstrong> Arabic has no case. An uppercased eyebrow style must be expressed as weight 600 + letter-spacing 0 + olive-600 colour instead, so both locales get the same emphasis.<\u002Fli>\n    <li><strong>No <code>letter-spacing<\u002Fcode> on Arabic.<\u002Fstrong> It breaks cursive joining. Set <code>letter-spacing: 0<\u002Fcode> inside <code>:lang(ar)<\u002Fcode>, always.<\u002Fli>\n    <li><strong>No italics and no faux-bold.<\u002Fstrong> Emphasis = weight 600 or colour change. Load real weights.<\u002Fli>\n    <li><strong>Minimum Arabic body size is 16px<\u002Fstrong> (14px in dashboard tables only), because diacritics and dot clusters collapse below that.<\u002Fli>\n    <li><strong>Western digits 0–9 in both locales<\u002Fstrong>, tabular figures in all tables. Rationale: mixed medical/nutrient data, clinician familiarity, and export to spreadsheets. The Arabic percent sign <code>٪<\u002Fcode> is used in Arabic UI.<\u002Fli>\n  <\u002Ful><\u002Fdiv>\n<\u002Fsection>\n\n<hr>\n\n<!-- 5 -->\n<section id=\"palette\">\n  <div class=\"sec-num\">05<\u002Fdiv>\n  <h2>Colour palette<\u002Fh2>\n  <p class=\"lede\">Built outward from the reference: <code>#4D7428<\u002Fcode> deep olive and <code>#CBEA24<\u002Fcode> yellow-lime. The hues are preserved; the scale is extended and tuned so the pair survives real contrast requirements. Every ratio quoted below is calculated, not estimated.<\u002Fp>\n\n  <h3>Olive — primary<\u002Fh3>\n  <div class=\"scale\">\n    <div class=\"sw\" style=\"background:var(--olive-50);color:var(--olive-900)\"><b>50<\u002Fb><span>#F5F8EF<\u002Fspan><\u002Fdiv>\n    <div class=\"sw\" style=\"background:var(--olive-100);color:var(--olive-900)\"><b>100<\u002Fb><span>#E8F0DA<\u002Fspan><\u002Fdiv>\n    <div class=\"sw\" style=\"background:var(--olive-200);color:var(--olive-900)\"><b>200<\u002Fb><span>#D2E2B9<\u002Fspan><\u002Fdiv>\n    <div class=\"sw\" style=\"background:var(--olive-300);color:var(--olive-950)\"><b>300<\u002Fb><span>#B2CE8D<\u002Fspan><\u002Fdiv>\n    <div class=\"sw\" style=\"background:var(--olive-400);color:var(--olive-950)\"><b>400<\u002Fb><span>#8CB35C<\u002Fspan><\u002Fdiv>\n    <div class=\"sw\" style=\"background:var(--olive-500);color:#fff\"><b>500<\u002Fb><span>#6B9639<\u002Fspan><\u002Fdiv>\n    <div class=\"sw\" style=\"background:var(--olive-600);color:#fff\"><b>600 ★<\u002Fb><span>#4D7428<\u002Fspan><\u002Fdiv>\n    <div class=\"sw\" style=\"background:var(--olive-700);color:#fff\"><b>700<\u002Fb><span>#3D5C21<\u002Fspan><\u002Fdiv>\n    <div class=\"sw\" style=\"background:var(--olive-800);color:#fff\"><b>800<\u002Fb><span>#2E461A<\u002Fspan><\u002Fdiv>\n    <div class=\"sw\" style=\"background:var(--olive-900);color:#fff\"><b>900<\u002Fb><span>#223414<\u002Fspan><\u002Fdiv>\n    <div class=\"sw\" style=\"background:var(--olive-950);color:#fff\"><b>950<\u002Fb><span>#16220D<\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n\n  <h3>Lime — accent<\u002Fh3>\n  <div class=\"scale\">\n    <div class=\"sw\" style=\"background:var(--lime-100);color:var(--olive-900)\"><b>100<\u002Fb><span>#F2FBC9<\u002Fspan><\u002Fdiv>\n    <div class=\"sw\" style=\"background:var(--lime-200);color:var(--olive-900)\"><b>200<\u002Fb><span>#E6F79A<\u002Fspan><\u002Fdiv>\n    <div class=\"sw\" style=\"background:var(--lime-300);color:var(--olive-950)\"><b>300<\u002Fb><span>#D9F25C<\u002Fspan><\u002Fdiv>\n    <div class=\"sw\" style=\"background:var(--lime-400);color:var(--olive-950)\"><b>400 ★<\u002Fb><span>#CBEA24<\u002Fspan><\u002Fdiv>\n    <div class=\"sw\" style=\"background:var(--lime-500);color:var(--olive-950)\"><b>500<\u002Fb><span>#B0CE12<\u002Fspan><\u002Fdiv>\n    <div class=\"sw\" style=\"background:var(--lime-600);color:var(--olive-950)\"><b>600<\u002Fb><span>#8CA60C<\u002Fspan><\u002Fdiv>\n    <div class=\"sw\" style=\"background:var(--lime-700);color:#fff\"><b>700<\u002Fb><span>#6B7F0A<\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n\n  <h3>Warm neutrals<\u002Fh3>\n  <div class=\"scale\">\n    <div class=\"sw\" style=\"background:var(--n-25);color:var(--n-900);border-color:var(--n-300)\"><b>25<\u002Fb><span>#FCFBF7<\u002Fspan><\u002Fdiv>\n    <div class=\"sw\" style=\"background:var(--n-50);color:var(--n-900)\"><b>50<\u002Fb><span>#F7F5EF<\u002Fspan><\u002Fdiv>\n    <div class=\"sw\" style=\"background:var(--n-100);color:var(--n-900)\"><b>100<\u002Fb><span>#EFEDE4<\u002Fspan><\u002Fdiv>\n    <div class=\"sw\" style=\"background:var(--n-200);color:var(--n-900)\"><b>200<\u002Fb><span>#E2DFD3<\u002Fspan><\u002Fdiv>\n    <div class=\"sw\" style=\"background:var(--n-300);color:var(--n-900)\"><b>300<\u002Fb><span>#CDC9B9<\u002Fspan><\u002Fdiv>\n    <div class=\"sw\" style=\"background:var(--n-400);color:var(--n-900)\"><b>400<\u002Fb><span>#A8A493<\u002Fspan><\u002Fdiv>\n    <div class=\"sw\" style=\"background:var(--n-500);color:#fff\"><b>500<\u002Fb><span>#837F6E<\u002Fspan><\u002Fdiv>\n    <div class=\"sw\" style=\"background:var(--n-600);color:#fff\"><b>600<\u002Fb><span>#605D50<\u002Fspan><\u002Fdiv>\n    <div class=\"sw\" style=\"background:var(--n-700);color:#fff\"><b>700<\u002Fb><span>#46443B<\u002Fspan><\u002Fdiv>\n    <div class=\"sw\" style=\"background:var(--n-800);color:#fff\"><b>800<\u002Fb><span>#2F2E28<\u002Fspan><\u002Fdiv>\n    <div class=\"sw\" style=\"background:var(--n-900);color:#fff\"><b>900<\u002Fb><span>#1C1B17<\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n\n  <h3>Support — attention &amp; medical<\u002Fh3>\n  <div class=\"scale\">\n    <div class=\"sw\" style=\"background:var(--amber-100);color:var(--amber-700)\"><b>amber 100<\u002Fb><span>#FBF0D8<\u002Fspan><\u002Fdiv>\n    <div class=\"sw\" style=\"background:var(--amber-300);color:var(--olive-950)\"><b>amber 300<\u002Fb><span>#E8C46A<\u002Fspan><\u002Fdiv>\n    <div class=\"sw\" style=\"background:var(--amber-600);color:#fff\"><b>amber 600<\u002Fb><span>#9B6A0C<\u002Fspan><\u002Fdiv>\n    <div class=\"sw\" style=\"background:var(--amber-700);color:#fff\"><b>amber 700<\u002Fb><span>#7A5209<\u002Fspan><\u002Fdiv>\n    <div class=\"sw\" style=\"background:var(--clay-100);color:var(--clay-700)\"><b>clay 100<\u002Fb><span>#FAE9E4<\u002Fspan><\u002Fdiv>\n    <div class=\"sw\" style=\"background:var(--clay-300);color:var(--olive-950)\"><b>clay 300<\u002Fb><span>#E8A08F<\u002Fspan><\u002Fdiv>\n    <div class=\"sw\" style=\"background:var(--clay-600);color:#fff\"><b>clay 600<\u002Fb><span>#A33422<\u002Fspan><\u002Fdiv>\n    <div class=\"sw\" style=\"background:var(--clay-700);color:#fff\"><b>clay 700<\u002Fb><span>#82291B<\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n  <p class=\"small\">Amber and clay are warm-shifted on purpose so they sit inside the olive world rather than importing a generic alert palette. <strong>There is no blue in this system<\u002Fstrong> — including for links, info states, and focus. Focus uses lime; links use olive-700.<\u002Fp>\n\n  <h3>Verified contrast — the pairs that decide the system<\u002Fh3>\n  <table>\n    <tbody><tr><th>Foreground<\u002Fth><th>Background<\u002Fth><th>Ratio<\u002Fth><th>Verdict<\u002Fth><\u002Ftr>\n    <tr><td>White <code>#FFFFFF<\u002Fcode><\u002Ftd><td>Olive-600 <code>#4D7428<\u002Fcode><\u002Ftd><td><strong>5.46:1<\u002Fstrong><\u002Ftd><td>✅ AA — primary button confirmed<\u002Ftd><\u002Ftr>\n    <tr><td>Olive-950 <code>#16220D<\u002Fcode><\u002Ftd><td>Lime-400 <code>#CBEA24<\u002Fcode><\u002Ftd><td><strong>12.58:1<\u002Fstrong><\u002Ftd><td>✅ AAA — accent button must use dark text<\u002Ftd><\u002Ftr>\n    <tr><td>Lime-400 <code>#CBEA24<\u002Fcode><\u002Ftd><td>Olive-800 <code>#2E461A<\u002Fcode><\u002Ftd><td><strong>7.64:1<\u002Fstrong><\u002Ftd><td>✅ AAA — this is why the dark canvas is 800, not 600<\u002Ftd><\u002Ftr>\n    <tr><td>Lime-400 <code>#CBEA24<\u002Fcode><\u002Ftd><td>Olive-600 <code>#4D7428<\u002Fcode><\u002Ftd><td>3.99:1<\u002Ftd><td>⚠️ Large text / non-text only — never body copy<\u002Ftd><\u002Ftr>\n    <tr><td>Lime-400 <code>#CBEA24<\u002Fcode><\u002Ftd><td>White <code>#FFFFFF<\u002Fcode><\u002Ftd><td>1.37:1<\u002Ftd><td>❌ Banned as text or icon on light. Fill and shape only.<\u002Ftd><\u002Ftr>\n    <tr><td>Olive-600 <code>#4D7428<\u002Fcode><\u002Ftd><td>Canvas <code>#FCFBF7<\u002Fcode><\u002Ftd><td><strong>5.28:1<\u002Fstrong><\u002Ftd><td>✅ AA — links, active states<\u002Ftd><\u002Ftr>\n    <tr><td>Ink-900 <code>#1C1B17<\u002Fcode><\u002Ftd><td>Canvas <code>#FCFBF7<\u002Fcode><\u002Ftd><td><strong>16.64:1<\u002Fstrong><\u002Ftd><td>✅ AAA — default body text<\u002Ftd><\u002Ftr>\n    <tr><td>Ink-600 <code>#605D50<\u002Fcode><\u002Ftd><td>Canvas <code>#FCFBF7<\u002Fcode><\u002Ftd><td><strong>6.38:1<\u002Fstrong><\u002Ftd><td>✅ AA — secondary text floor<\u002Ftd><\u002Ftr>\n    <tr><td>Neutral-500 <code>#837F6E<\u002Fcode><\u002Ftd><td>White <code>#FFFFFF<\u002Fcode><\u002Ftd><td><strong>4.02:1<\u002Fstrong><\u002Ftd><td>✅ 3:1 — the minimum legal input border<\u002Ftd><\u002Ftr>\n    <tr><td>Neutral-300 <code>#CDC9B9<\u002Fcode><\u002Ftd><td>White <code>#FFFFFF<\u002Fcode><\u002Ftd><td>1.66:1<\u002Ftd><td>❌ Decorative dividers only — never an input border<\u002Ftd><\u002Ftr>\n    <tr><td>Amber-700 <code>#7A5209<\u002Fcode><\u002Ftd><td>Amber-100 <code>#FBF0D8<\u002Fcode><\u002Ftd><td><strong>6.11:1<\u002Fstrong><\u002Ftd><td>✅ AA — attention chip<\u002Ftd><\u002Ftr>\n    <tr><td>Clay-700 <code>#82291B<\u002Fcode><\u002Ftd><td>Clay-100 <code>#FAE9E4<\u002Fcode><\u002Ftd><td><strong>7.82:1<\u002Fstrong><\u002Ftd><td>✅ AAA — medical flag<\u002Ftd><\u002Ftr>\n  <\u002Ftbody><\u002Ftable>\n  <div class=\"note\"><strong>The two rules that fall out of this table.<\u002Fstrong> (1) Lime never carries text on a light surface — it is a fill, a range marker, or a focus ring. (2) When lime text is needed, the surface must be olive-800 or darker. Both are encoded in the token names below so a designer cannot pick the wrong pair by accident.<\u002Fdiv>\n<\u002Fsection>\n\n<hr>\n\n<!-- 6 -->\n<section id=\"tokens\">\n  <div class=\"sec-num\">06<\u002Fdiv>\n  <h2>Semantic design tokens<\u002Fh2>\n  <p class=\"lede\">Primitives above are never referenced directly in a component. Components consume semantic tokens only. Every token below resolves to a verified pair.<\u002Fp>\n\n  <h4>Surface &amp; text<\u002Fh4>\n  <table>\n    <tbody><tr><th>Token<\u002Fth><th>Value<\u002Fth><th>Use<\u002Fth><\u002Ftr>\n    <tr><td class=\"tok\">color.bg.canvas<\u002Ftd><td><code>#FCFBF7<\u002Fcode> n-25<\u002Ftd><td>App background, both products<\u002Ftd><\u002Ftr>\n    <tr><td class=\"tok\">color.bg.surface<\u002Ftd><td><code>#FFFFFF<\u002Fcode><\u002Ftd><td>Cards, sheets, table body<\u002Ftd><\u002Ftr>\n    <tr><td class=\"tok\">color.bg.sunken<\u002Ftd><td><code>#F7F5EF<\u002Fcode> n-50<\u002Ftd><td>Table headers, inset panels, band track<\u002Ftd><\u002Ftr>\n    <tr><td class=\"tok\">color.bg.brand.solid<\u002Ftd><td><code>#2E461A<\u002Fcode> olive-800<\u002Ftd><td>Identity canvas: app header, sign-in, report cover<\u002Ftd><\u002Ftr>\n    <tr><td class=\"tok\">color.bg.brand.subtle<\u002Ftd><td><code>#F5F8EF<\u002Fcode> olive-50<\u002Ftd><td>Selected rows, quiet brand emphasis<\u002Ftd><\u002Ftr>\n    <tr><td class=\"tok\">color.text.primary<\u002Ftd><td><code>#1C1B17<\u002Fcode> n-900<\u002Ftd><td>Body — 16.64:1<\u002Ftd><\u002Ftr>\n    <tr><td class=\"tok\">color.text.secondary<\u002Ftd><td><code>#605D50<\u002Fcode> n-600<\u002Ftd><td>Helper, timestamps — 6.38:1 floor<\u002Ftd><\u002Ftr>\n    <tr><td class=\"tok\">color.text.brand<\u002Ftd><td><code>#3D5C21<\u002Fcode> olive-700<\u002Ftd><td>Links, active tab labels — 7.37:1<\u002Ftd><\u002Ftr>\n    <tr><td class=\"tok\">color.text.inverse<\u002Ftd><td><code>#FCFBF7<\u002Fcode> n-25<\u002Ftd><td>Text on olive-600 and darker only<\u002Ftd><\u002Ftr>\n    <tr><td class=\"tok\">color.text.onAccent<\u002Ftd><td><code>#16220D<\u002Fcode> olive-950<\u002Ftd><td><strong>Only<\u002Fstrong> legal text colour on lime<\u002Ftd><\u002Ftr>\n  <\u002Ftbody><\u002Ftable>\n\n  <h4>Border &amp; focus<\u002Fh4>\n  <table>\n    <tbody><tr><th>Token<\u002Fth><th>Value<\u002Fth><th>Use<\u002Fth><\u002Ftr>\n    <tr><td class=\"tok\">color.border.divider<\u002Ftd><td><code>#E2DFD3<\u002Fcode> n-200<\u002Ftd><td>Decorative separators only<\u002Ftd><\u002Ftr>\n    <tr><td class=\"tok\">color.border.interactive<\u002Ftd><td><code>#837F6E<\u002Fcode> n-500<\u002Ftd><td>Input, checkbox, radio, unselected chip — meets 3:1<\u002Ftd><\u002Ftr>\n    <tr><td class=\"tok\">color.border.selected<\u002Ftd><td><code>#4D7428<\u002Fcode> olive-600<\u002Ftd><td>Chosen state, 2px<\u002Ftd><\u002Ftr>\n    <tr><td class=\"tok\">color.focus.ring<\u002Ftd><td><code>#CBEA24<\u002Fcode> lime-400<\u002Ftd><td>Inner ring, 2px<\u002Ftd><\u002Ftr>\n    <tr><td class=\"tok\">color.focus.halo<\u002Ftd><td><code>#16220D<\u002Fcode> olive-950<\u002Ftd><td>Outer ring, 2px — makes focus visible on both light and dark<\u002Ftd><\u002Ftr>\n  <\u002Ftbody><\u002Ftable>\n\n  <h4>Status — deliberately not a traffic light<\u002Fh4>\n  <table>\n    <tbody><tr><th>Token<\u002Fth><th>Arabic label<\u002Fth><th>Colour<\u002Fth><th>Icon + shape<\u002Fth><th>Note<\u002Fth><\u002Ftr>\n    <tr><td class=\"tok\">status.onTrack<\u002Ftd><td class=\"rtl\">ضمن المسار<\u002Ftd><td>olive-700 on olive-100<\u002Ftd><td>✓ filled circle<\u002Ftd><td>Default positive<\u002Ftd><\u002Ftr>\n    <tr><td class=\"tok\">status.attention<\u002Ftd><td class=\"rtl\">يحتاج متابعة<\u002Ftd><td>amber-700 on amber-100<\u002Ftd><td>! triangle<\u002Ftd><td>Nutritionist action needed<\u002Ftd><\u002Ftr>\n    <tr><td class=\"tok\">status.incomplete<\u002Ftd><td class=\"rtl\">لم تكتمل<\u002Ftd><td>n-700 on n-100<\u002Ftd><td>◌ dashed circle<\u002Ftd><td><strong>Neutral grey, never red.<\u002Fstrong> A missed day is information.<\u002Ftd><\u002Ftr>\n    <tr><td class=\"tok\">status.medical<\u002Ftd><td class=\"rtl\">تنبيه طبي<\u002Ftd><td>clay-700 on clay-100<\u002Ftd><td>⬡ octagon<\u002Ftd><td>Allergy, condition, contraindication — the only true alarm<\u002Ftd><\u002Ftr>\n    <tr><td class=\"tok\">status.rest<\u002Ftd><td class=\"rtl\">يوم راحة<\u002Ftd><td>olive-700 on olive-50<\u002Ftd><td>☾ crescent<\u002Ftd><td>Planned rest, counts as adherence<\u002Ftd><\u002Ftr>\n  <\u002Ftbody><\u002Ftable>\n  <div class=\"chips\" style=\"margin-bottom:24px\">\n    <span class=\"chip c-ok\"><span class=\"g\">✓<\u002Fspan> ضمن المسار<\u002Fspan>\n    <span class=\"chip c-att\"><span class=\"g\">!<\u002Fspan> يحتاج متابعة<\u002Fspan>\n    <span class=\"chip c-none\"><span class=\"g\"><\u002Fspan> لم تكتمل<\u002Fspan>\n    <span class=\"chip c-med\"><span class=\"g\">⬡<\u002Fspan> تنبيه طبي<\u002Fspan>\n    <span class=\"chip c-rest\"><span class=\"g\">☾<\u002Fspan> يوم راحة<\u002Fspan>\n  <\u002Fdiv>\n\n  <h4>Spacing, radius, elevation<\u002Fh4>\n  <table>\n    <tbody><tr><th>Scale<\u002Fth><th>Values<\u002Fth><th>Rules<\u002Fth><\u002Ftr>\n    <tr><td class=\"tok\">space.*<\u002Ftd><td>2 · 4 · 8 · 12 · 16 · 20 · 24 · 32 · 40 · 48 · 64<\u002Ftd><td>4px base. Card padding 16 mobile / 20 desktop. Section gap 32.<\u002Ftd><\u002Ftr>\n    <tr><td class=\"tok\">radius.*<\u002Ftd><td>sm 8 · md 12 · lg 16 · xl 24 · pill 999<\u002Ftd><td>Cards <code>lg<\u002Fcode>. Buttons/inputs <code>sm<\u002Fcode>. Chips and band <code>pill<\u002Fcode>. Never 0.<\u002Ftd><\u002Ftr>\n    <tr><td class=\"tok\">shadow.*<\u002Ftd><td>1 · 2 · 3<\u002Ftd><td>Tinted <code>rgba(34,52,20,·)<\u002Fcode> — olive-tinted, never neutral black<\u002Ftd><\u002Ftr>\n    <tr><td class=\"tok\">duration.*<\u002Ftd><td>fast 140 · base 220 · slow 320<\u002Ftd><td>ease-out. All disabled under <code>prefers-reduced-motion<\u002Fcode>.<\u002Ftd><\u002Ftr>\n  <\u002Ftbody><\u002Ftable>\n<\u002Fsection>\n\n<hr>\n\n<!-- 7 -->\n<section id=\"art\">\n  <div class=\"sec-num\">07<\u002Fdiv>\n  <h2>Art direction<\u002Fh2>\n\n  <h3>Photography<\u002Fh3>\n  <table>\n    <tbody><tr><th style=\"width:30%\">Subject<\u002Fth><th>Direction<\u002Fth><\u002Ftr>\n    <tr><td>People<\u002Ftd><td>Real Arabic-speaking adults across a wide range of ages, body sizes, skin tones, and dress — including hijab and non-hijab, without making either the \"before\" or \"after.\" People are shown <strong>doing<\u002Fstrong> things: cooking, walking, sitting with family. Faces visible, eyes to camera or to the activity.<\u002Ftd><\u002Ftr>\n    <tr><td>Bodies<\u002Ftd><td>Whole people, framed at half or full length. <strong>Never<\u002Fstrong> isolated waistlines, thighs, scales, measuring tapes, pinched skin, or before/after pairs. No body is presented as the goal.<\u002Ftd><\u002Ftr>\n    <tr><td>Food<\u002Ftd><td>Real regional meals in the middle of being eaten — a shared plate, a half-full glass, home lighting. Not styled flat-lays, not portion-controlled bento boxes, not smoothie bowls.<\u002Ftd><\u002Ftr>\n    <tr><td>Light<\u002Ftd><td>Warm daylight, soft shadow, slightly desaturated. Colour-graded a few degrees toward olive so photography sits inside the palette.<\u002Ftd><\u002Ftr>\n  <\u002Ftbody><\u002Ftable>\n\n  <h3>Iconography<\u002Fh3>\n  <ul class=\"tight\">\n    <li>1.75px stroke, rounded caps and joins, 24px grid, geometric-humanist to match Readex Pro.<\u002Fli>\n    <li><strong>Icons are mirrored for RTL only when they encode direction<\u002Fstrong> — arrows, back, next, send, progress, indent. Never mirrored: clock, chart, checkmark, logo, media controls, glass/plate.<\u002Fli>\n    <li>Icons never appear alone as the sole carrier of meaning in a status. Icon + label, always.<\u002Fli>\n  <\u002Ful>\n\n  <h3>The leaf rule<\u002Fh3>\n  <div class=\"note warn\"><strong>The leaf from the logo appears in exactly two places: the logo itself, and one ambient watermark at ≤6% opacity on identity surfaces<\u002Fstrong> (as on this document's cover). It never becomes a bullet, a divider, a loading spinner, an empty-state illustration, a checkmark, or a progress indicator. This single rule is what separates the brand from an organic grocery.<\u002Fdiv>\n\n  <h3>Illustration<\u002Fh3>\n  <p>Used only for empty states and onboarding. Flat, two-tone (olive-700 + olive-200) with one lime element. Abstract-spatial rather than literal — a table being set, a path, a horizon — never anthropomorphised vegetables and never a cartoon nutritionist.<\u002Fp>\n\n  <h3>Data visualisation<\u002Fh3>\n  <ul class=\"tight\">\n    <li><strong>Bands over lines.<\u002Fstrong> Trends are drawn as a filled comfortable range with a soft trend line inside it. No single dramatic peak.<\u002Fli>\n    <li>Y-axis never zoomed to exaggerate small changes. Weight charts default to a 4-week window and a fixed ±5kg viewport.<\u002Fli>\n    <li>Maximum four series per chart. Series are distinguished by colour <em>and<\u002Fem> dash pattern <em>and<\u002Fem> a direct end-of-line label — never by a colour legend alone.<\u002Fli>\n    <li>Every chart states its date range and its source (\"سُجّل بواسطتك\" vs \"سُجّل بواسطة المختصة\").<\u002Fli>\n  <\u002Ful>\n<\u002Fsection>\n\n<hr>\n\n<!-- 8 -->\n<section id=\"layout\">\n  <div class=\"sec-num\">08<\u002Fdiv>\n  <h2>Layout &amp; UI foundations<\u002Fh2>\n\n  <table>\n    <tbody><tr><th style=\"width:24%\"><\u002Fth><th>Mobile app (client)<\u002Fth><th>Dashboard (nutritionist)<\u002Fth><\u002Ftr>\n    <tr><td>Grid<\u002Ftd><td>4 columns, 16px margins, 16px gutter<\u002Ftd><td>12 columns, max content 1280px, 24px gutter<\u002Ftd><\u002Ftr>\n    <tr><td>Navigation<\u002Ftd><td>Bottom tab bar, max 5 items, 56px tall + safe area<\u002Ftd><td>Side rail 264px (collapsed 72px)<\u002Ftd><\u002Ftr>\n    <tr><td>RTL position<\u002Ftd><td>Tab order right→left; back arrow points right<\u002Ftd><td><strong>Rail sits on the right in Arabic, left in English<\u002Fstrong> — the whole shell mirrors, not just the text<\u002Ftd><\u002Ftr>\n    <tr><td>Touch target<\u002Ftd><td>48×48px minimum, 8px minimum spacing between targets<\u002Ftd><td>40×40px minimum for pointer, 48 for anything also used on tablet<\u002Ftd><\u002Ftr>\n    <tr><td>Density<\u002Ftd><td>Comfortable only. No compact mode.<\u002Ftd><td>Comfortable (56px rows) default; Compact (44px) opt-in, disabled below 15px text<\u002Ftd><\u002Ftr>\n    <tr><td>Max line length<\u002Ftd><td>60 characters<\u002Ftd><td>75 characters for notes and reports<\u002Ftd><\u002Ftr>\n  <\u002Ftbody><\u002Ftable>\n\n  <h3>RTL implementation rules<\u002Fh3>\n  <ul class=\"tight\">\n    <li><strong>Logical properties only.<\u002Fstrong> <code>margin-inline-start<\u002Fcode>, <code>padding-inline-end<\u002Fcode>, <code>inset-inline-start<\u002Fcode>, <code>border-inline-start<\u002Fcode>. A single <code>margin-left<\u002Fcode> in the codebase is a bug, not a style choice.<\u002Fli>\n    <li><strong>Shadows and gradients mirror too.<\u002Fstrong> Directional shadow offsets flip with the document direction.<\u002Fli>\n    <li><strong>Mixed-direction strings<\u002Fstrong> (Arabic label + Latin nutrient name + number) use <code>dir=\"auto\"<\u002Fcode> or <code>unicode-bidi: plaintext<\u002Fcode> on the leaf node so a name like \"Omega-3 ٣ غرام\" doesn't scramble.<\u002Fli>\n    <li><strong>Numbers, times, and units keep LTR internal order<\u002Fstrong> inside RTL text. Times render as <code>٩:٣٠ ص<\u002Fcode> with the digits LTR-grouped.<\u002Fli>\n    <li>Progress fills, sliders, and the balance band all originate from the <strong>inline-start<\u002Fstrong> edge — the right in Arabic.<\u002Fli>\n    <li>Charts do <strong>not<\u002Fstrong> mirror their time axis: time always runs left→right in both locales, because mirrored time axes test badly with clinicians. The axis labels are the only thing localised.<\u002Fli>\n  <\u002Ful>\n<\u002Fsection>\n\n<hr>\n\n<style>\n/* ══ §09 — Qiwam component language \"القوس / The Arc\". Scoped to this section only. ══ */\n.qsec{--sweep:24px;--sweep-lg:32px}\n.qsec .q-demo{background:var(--n-0);border:1px solid var(--n-200);border-radius:var(--radius-lg);border-end-end-radius:var(--sweep-lg);padding:18px 20px 20px;margin:14px 0 22px;box-shadow:var(--shadow-1)}\n.qsec .q-demo > .lbl{font-family:var(--mono);font-size:11px;letter-spacing:.05em;color:var(--n-500);margin-bottom:14px;direction:ltr;text-align:left}\n.qsec .q-rtl{direction:rtl;text-align:right}\n.qsec .q-row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}\n.qsec .q-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}\n.qsec .q-grid-2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}\n.qsec .q-cap{font-family:var(--mono);font-size:10.5px;color:var(--n-500);margin-top:8px;direction:ltr;text-align:left}\n.qsec .q-leaf{width:11px;height:11px;background:var(--olive-600);border-radius:72% 0 72% 0;transform:rotate(45deg);flex:0 0 auto}\n.qsec .q-ring{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:0 0 auto;\n  background:conic-gradient(from 96deg, var(--olive-600) 0 300deg, transparent 300deg);\n  -webkit-mask:radial-gradient(circle,transparent 60%,#000 61%);mask:radial-gradient(circle,transparent 60%,#000 61%)}\n.qsec .q-head{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:0 0 auto;background:var(--olive-50);position:relative}\n.qsec .q-head::after{content:\"\";position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 96deg, var(--olive-300) 0 300deg, transparent 300deg);-webkit-mask:radial-gradient(circle,transparent 90%,#000 91%);mask:radial-gradient(circle,transparent 90%,#000 91%)}\n\n/* ── Buttons ── */\n.qsec .qb{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-family:var(--sans);font-size:15px;font-weight:600;line-height:1;min-height:48px;padding:0 20px;border:1px solid transparent;\n  border-radius:10px;border-end-end-radius:var(--sweep);cursor:pointer;\n  transition:background 160ms ease-out,color 160ms ease-out,border-color 160ms ease-out,transform 160ms cubic-bezier(.2,.6,.2,1),border-end-end-radius 200ms cubic-bezier(.2,.6,.2,1)}\n.qsec .qb:hover{border-end-end-radius:30px}\n.qsec .qb:active{transform:translateY(1px);border-end-end-radius:18px}\n.qsec .qb:focus-visible{outline:2px solid var(--lime-400);outline-offset:0;box-shadow:0 0 0 4px var(--olive-950)}\n.qsec .qb-primary{background:var(--olive-600);color:#fff}\n.qsec .qb-primary:hover{background:var(--olive-700)}\n.qsec .qb-primary:active{background:var(--olive-800)}\n.qsec .qb-accent{background:var(--lime-400);color:var(--olive-950)}\n.qsec .qb-accent:hover{background:var(--lime-500)}\n.qsec .qb-secondary{background:transparent;color:var(--olive-700);border-color:var(--olive-600)}\n.qsec .qb-secondary:hover{background:var(--olive-50)}\n.qsec .qb-tertiary{background:transparent;color:var(--n-700);padding:0 12px}\n.qsec .qb-tertiary:hover{background:var(--n-100)}\n.qsec .qb-danger{background:transparent;color:var(--clay-700);border-color:var(--clay-600)}\n.qsec .qb-danger:hover{background:var(--clay-100)}\n.qsec .qb[disabled]{background:var(--n-100);color:var(--n-500);border-color:transparent;cursor:not-allowed;border-end-end-radius:10px;transform:none}\n.qsec .qb-icon{width:48px;height:48px;padding:0;border-radius:50%;border-end-end-radius:14px;background:var(--olive-50);color:var(--olive-700);border-color:var(--olive-200);font-size:17px;font-weight:400}\n.qsec .qb-icon:hover{background:var(--olive-100);border-end-end-radius:20px}\n.qsec .qb-hover-demo{background:var(--olive-700);color:#fff;border-end-end-radius:30px}\n.qsec .qb-focus-demo{background:var(--olive-600);color:#fff;outline:2px solid var(--lime-400);box-shadow:0 0 0 4px var(--olive-950)}\n.qsec .qb-press-demo{background:var(--olive-800);color:#fff;border-end-end-radius:18px;transform:translateY(1px)}\n.qsec .qb-success{background:var(--olive-600);color:#fff}\n\n/* ── The traveling-leaf orbit (single motion primitive) ── */\n.qsec .orbit{position:relative;flex:0 0 auto}\n.qsec .orbit .track,.qsec .orbit .draw{position:absolute;inset:0}\n.qsec .orbit .spin{position:absolute;inset:0;animation:q-orbit 2400ms cubic-bezier(.45,.05,.55,.95) infinite}\n.qsec .orbit .spin > i{position:absolute;top:-5px;inset-inline-start:50%;margin-inline-start:-5.5px;display:block;width:11px;height:11px;background:var(--olive-600);border-radius:72% 0 72% 0;transform:rotate(45deg)}\n@keyframes q-orbit{0%{transform:rotate(75deg)}88%{transform:rotate(375deg)}100%{transform:rotate(375deg)}}\n@keyframes q-draw{0%{stroke-dashoffset:220}80%{stroke-dashoffset:0}100%{stroke-dashoffset:0}}\n.qsec .orbit svg circle.val{animation:q-draw 2400ms cubic-bezier(.45,.05,.55,.95) infinite}\n.qsec .orbit-16{width:18px;height:18px}\n.qsec .orbit-16 .spin{animation-duration:1600ms}\n.qsec .orbit-16 .spin > i{width:6px;height:6px;top:-3px;margin-inline-start:-3px}\n.qsec .orbit-48{width:48px;height:48px}\n.qsec .orbit-btn > i{background:#fff}\n\n/* ── Form controls ── */\n.qsec .qf{margin-bottom:16px}\n.qsec .qf > label{display:block;font-family:var(--sans);font-size:13px;font-weight:600;color:var(--n-800);margin-bottom:6px;transition:color 180ms ease-out,transform 180ms cubic-bezier(.2,.6,.2,1)}\n.qsec .q-field{position:relative;display:flex;align-items:center;gap:10px;background:var(--n-0);border:1px solid var(--n-500);border-radius:10px;border-end-end-radius:var(--sweep);padding:0 14px;min-height:48px;transition:border-color 180ms ease-out,box-shadow 180ms ease-out}\n.qsec .q-field input,.qsec .q-field textarea,.qsec .q-field select{flex:1;min-width:0;border:0;outline:0;background:transparent;font-family:var(--sans);font-size:16px;color:var(--n-900);padding:12px 0}\n.qsec .q-field textarea{resize:vertical;min-height:88px;line-height:1.75}\n.qsec .q-field::after{content:\"\";position:absolute;inset-inline-end:-1px;bottom:-1px;height:2px;width:0;background:var(--olive-600);border-end-end-radius:var(--sweep);transition:width 220ms cubic-bezier(.2,.6,.2,1)}\n.qsec .q-field:focus-within,.qsec .q-field.is-focus{border-color:var(--olive-600);box-shadow:0 0 0 3px var(--olive-100)}\n.qsec .q-field:focus-within::after,.qsec .q-field.is-focus::after{width:58%}\n.qsec .qf.is-focus > label{color:var(--olive-700)}\n.qsec .q-field.is-error{border-color:var(--clay-600);border-width:2px;box-shadow:none}\n.qsec .q-field.is-error::after{background:var(--clay-600);width:58%}\n.qsec .q-field.is-ok{border-color:var(--olive-600)}\n.qsec .q-hint{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--n-600);margin-top:6px}\n.qsec .q-hint.err{color:var(--clay-700);font-weight:600}\n.qsec .q-hint.ok{color:var(--olive-700);font-weight:600}\n.qsec .q-icn{width:28px;height:28px;border-radius:50%;background:var(--olive-50);color:var(--olive-700);display:flex;align-items:center;justify-content:center;font-size:13px;flex:0 0 auto;position:relative}\n.qsec .q-icn::after{content:\"\";position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 96deg,var(--olive-300) 0 300deg,transparent 300deg);-webkit-mask:radial-gradient(circle,transparent 86%,#000 87%);mask:radial-gradient(circle,transparent 86%,#000 87%)}\n.qsec .q-check{width:24px;height:24px;border:1.5px solid var(--n-500);border-radius:7px;border-end-end-radius:12px;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-size:13px;flex:0 0 auto}\n.qsec .q-check.on{background:var(--olive-600);border-color:var(--olive-600)}\n.qsec .q-radio{width:24px;height:24px;border-radius:50%;flex:0 0 auto;position:relative;background:conic-gradient(from 96deg,var(--n-500) 0 300deg,transparent 300deg);-webkit-mask:radial-gradient(circle,transparent 66%,#000 67%);mask:radial-gradient(circle,transparent 66%,#000 67%)}\n.qsec .q-radio.on{background:conic-gradient(from 96deg,var(--olive-600) 0 300deg,transparent 300deg);-webkit-mask:none;mask:none;box-shadow:inset 0 0 0 4px var(--n-0),inset 0 0 0 12px var(--olive-600)}\n.qsec .q-ctl{display:flex;align-items:center;gap:10px;min-height:48px;font-size:15px;color:var(--n-800)}\n.qsec .q-switch{width:52px;height:30px;border-radius:999px;background:var(--n-300);position:relative;flex:0 0 auto;transition:background 200ms ease-out}\n.qsec .q-switch > span{position:absolute;top:3px;inset-inline-start:3px;width:24px;height:24px;background:var(--n-0);border-radius:50%;border-end-end-radius:9px;box-shadow:var(--shadow-1);transition:inset-inline-start 220ms cubic-bezier(.2,.6,.2,1),transform 220ms cubic-bezier(.2,.6,.2,1)}\n.qsec .q-switch.on{background:var(--olive-600)}\n.qsec .q-switch.on > span{inset-inline-start:25px;transform:rotate(-45deg)}\n.qsec .q-seg{display:inline-flex;background:var(--n-50);border:1px solid var(--n-200);border-radius:12px;border-end-end-radius:var(--sweep);padding:4px;gap:2px}\n.qsec .q-seg > button{border:0;background:transparent;font-family:var(--sans);font-size:14px;font-weight:600;color:var(--n-600);min-height:40px;padding:0 16px;border-radius:9px;border-end-end-radius:18px;cursor:pointer;transition:all 180ms cubic-bezier(.2,.6,.2,1)}\n.qsec .q-seg > button.on{background:var(--olive-600);color:#fff}\n.qsec .q-step{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--n-500);border-radius:10px;border-end-end-radius:var(--sweep);padding:4px;background:var(--n-0)}\n.qsec .q-step button{width:40px;height:40px;border:0;border-radius:50%;background:var(--olive-50);color:var(--olive-700);font-size:18px;cursor:pointer}\n.qsec .q-step button:last-child{border-end-end-radius:12px}\n.qsec .q-step .v{min-width:56px;text-align:center;font-family:var(--sans);font-weight:600;font-size:16px;font-variant-numeric:tabular-nums}\n\n/* ── Cards ── */\n.qsec .qc{background:var(--n-0);border:1px solid var(--n-200);border-radius:var(--radius-lg);border-end-end-radius:var(--sweep-lg);box-shadow:var(--shadow-1);padding:16px;position:relative}\n.qsec .qc-tint{background:var(--olive-50);border-color:var(--olive-200)}\n.qsec .qc-h{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:8px}\n.qsec .qc-t{font-family:var(--display);font-size:17px;font-weight:500;color:var(--n-900);line-height:1.4}\n.qsec .qc-s{font-size:13px;color:var(--n-600)}\n.qsec .qc-arc{height:3px;background:var(--olive-200);border-radius:999px;border-end-end-radius:0;margin:12px 0;position:relative;overflow:hidden}\n.qsec .qc-arc > i{position:absolute;inset-block:0;inset-inline-start:0;background:var(--olive-600);border-start-end-radius:999px;border-end-end-radius:999px}\n.qsec .qc-notch{position:absolute;bottom:-14px;inset-inline-end:-14px;width:44px;height:44px;border-radius:50%;background:var(--n-25);pointer-events:none}\n.qsec .qc-dot{width:10px;height:10px;border-radius:50%;background:var(--olive-600);flex:0 0 auto}\n.qsec .qc-empty{border-style:dashed;border-color:var(--n-300);background:var(--n-25);box-shadow:none;text-align:center;padding:26px 18px}\n\n/* ── Navigation ── */\n.qsec .q-rail{background:var(--olive-800);border-radius:var(--radius-lg);border-end-end-radius:var(--sweep-lg);padding:14px 10px;width:230px;max-width:100%}\n.qsec .q-rail a{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--olive-200);font-size:14px;font-weight:500;padding:11px 12px;border-radius:10px;border-end-end-radius:18px;margin-bottom:3px;position:relative;transition:background 180ms ease-out,color 180ms ease-out}\n.qsec .q-rail a:hover{background:rgba(203,234,36,.10);color:var(--n-25)}\n.qsec .q-rail a.on{background:var(--olive-600);color:#fff;font-weight:600;border-end-end-radius:24px}\n.qsec .q-rail a.on::before{content:\"\";position:absolute;inset-inline-start:-10px;top:50%;transform:translateY(-50%);width:8px;height:8px;border-radius:50%;background:var(--lime-400)}\n.qsec .q-bar{display:flex;align-items:center;gap:12px;background:var(--olive-800);color:var(--n-25);padding:12px 16px;border-radius:var(--radius-lg);border-end-end-radius:var(--sweep-lg)}\n.qsec .q-bottom{display:flex;background:var(--n-0);border:1px solid var(--n-200);border-radius:var(--radius-lg);border-end-end-radius:var(--sweep-lg);padding:6px 4px 8px;position:relative}\n.qsec .q-bottom > div{flex:1;text-align:center;font-size:10.5px;color:var(--n-600);padding-top:6px;position:relative}\n.qsec .q-bottom > div .g{display:block;width:26px;height:26px;margin:0 auto 4px;border-radius:50%;background:var(--n-100)}\n.qsec .q-bottom > div.on{color:var(--olive-700);font-weight:600}\n.qsec .q-bottom > div.on .g{background:var(--olive-600);border-end-end-radius:9px}\n.qsec .q-bottom > div.on::before{content:\"\";position:absolute;top:0;inset-inline-start:50%;transform:translateX(50%);width:22px;height:3px;border-radius:999px;background:var(--lime-400)}\n.qsec .q-tabs{display:flex;gap:6px;border-bottom:1px solid var(--n-200)}\n.qsec .q-tabs > button{bo

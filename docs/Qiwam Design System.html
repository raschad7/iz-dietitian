rder:0;background:transparent;font-family:var(--sans);font-size:14.5px;font-weight:600;color:var(--n-600);padding:12px 14px;min-height:48px;cursor:pointer;position:relative}\n.qsec .q-tabs > button.on{color:var(--olive-700)}\n.qsec .q-tabs > button.on::after{content:\"\";position:absolute;bottom:-1px;inset-inline:6px;height:3px;background:var(--olive-600);border-start-start-radius:999px;border-start-end-radius:999px;border-end-end-radius:999px}\n.qsec .q-crumb{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--n-600);flex-wrap:wrap}\n.qsec .q-crumb a{color:var(--olive-700);text-decoration:none}\n.qsec .q-crumb .sep{width:8px;height:8px;border:1.5px solid var(--n-400);border-block-end:0;border-inline-start:0;border-start-end-radius:8px;display:inline-block}\n\n/* ── Progress & habit ── */\n.qsec .q-num{font-family:var(--display);font-weight:600;color:var(--olive-800);font-variant-numeric:tabular-nums}\n.qsec .q-week{display:flex;gap:6px;direction:rtl}\n.qsec .q-week > div{flex:1;text-align:center}\n.qsec .q-week .d{height:40px;border-radius:10px;border-end-end-radius:18px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;border:1px solid var(--n-200);background:var(--n-50);color:var(--n-500)}\n.qsec .q-week .lb{font-size:10px;color:var(--n-500);margin-top:5px}\n.qsec .q-week .done .d{background:var(--olive-600);color:#fff;border-color:var(--olive-600)}\n.qsec .q-week .rest .d{background:var(--olive-50);color:var(--olive-700);border-color:var(--olive-300)}\n.qsec .q-week .miss .d{border:1px dashed var(--n-500);color:var(--n-600)}\n.qsec .q-week .now .d{background:var(--n-0);border:2px solid var(--olive-600);color:var(--olive-700)}\n.qsec .q-adh{display:flex;align-items:flex-end;gap:8px;height:110px;direction:rtl}\n.qsec .q-adh > div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:100%}\n.qsec .q-adh .bar{background:var(--olive-300);border-start-start-radius:14px;border-start-end-radius:6px;border-end-end-radius:14px}\n.qsec .q-adh .bar.hi{background:var(--olive-600)}\n.qsec .q-adh .bar.lo{background:var(--n-200)}\n.qsec .q-adh .lb{font-size:10px;color:var(--n-500);text-align:center;margin-top:6px}\n.qsec .q-mile{display:flex;align-items:center;gap:0;direction:rtl;margin:8px 0}\n.qsec .q-mile .seg{flex:1;height:3px;background:var(--n-200)}\n.qsec .q-mile .seg.on{background:var(--olive-600)}\n.qsec .q-mile .nd{width:16px;height:16px;border-radius:50%;border:2px solid var(--n-300);background:var(--n-0);flex:0 0 auto}\n.qsec .q-mile .nd.on{border-color:var(--olive-600);background:var(--olive-600)}\n.qsec .q-mile .nd.now{border-color:var(--olive-600);background:var(--n-0);box-shadow:0 0 0 4px var(--olive-100)}\n\n/* ── Skeleton & motion demos ── */\n.qsec .q-sk{background:var(--n-100);border-radius:8px;border-end-end-radius:16px;overflow:hidden;position:relative}\n.qsec .q-sk::after{content:\"\";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(232,240,218,.9),transparent);transform:translateX(-100%);animation:q-sk 1600ms ease-in-out infinite}\n@keyframes q-sk{to{transform:translateX(100%)}}\n.qsec .q-pull{display:flex;align-items:center;gap:12px;background:var(--olive-50);border:1px solid var(--olive-200);border-radius:12px;border-end-end-radius:var(--sweep);padding:12px 14px}\n\n/* ── Feedback ── */\n.qsec .q-toast{display:flex;align-items:flex-start;gap:12px;background:var(--olive-800);color:var(--n-25);padding:14px 16px;border-radius:12px;border-end-end-radius:var(--sweep);box-shadow:var(--shadow-3);position:relative;overflow:hidden;max-width:420px}\n.qsec .q-toast::before{content:\"\";position:absolute;inset-block:0;inset-inline-start:0;width:4px;background:var(--lime-400);border-start-end-radius:999px;border-end-end-radius:999px}\n.qsec .q-alert{display:flex;gap:12px;padding:14px 16px;border-radius:12px;border-end-end-radius:var(--sweep);border:1px solid var(--amber-300);background:var(--amber-100);color:var(--amber-700);font-size:14px}\n.qsec .q-alert.med{border-color:var(--clay-300);background:var(--clay-100);color:var(--clay-700)}\n.qsec .q-modal{background:var(--n-0);border:1px solid var(--n-200);border-radius:var(--radius-lg);border-end-end-radius:var(--sweep-lg);box-shadow:var(--shadow-3);padding:20px;max-width:420px}\n.qsec .q-sheet{background:var(--n-0);border:1px solid var(--n-200);border-bottom:0;border-start-start-radius:var(--radius-xl);border-start-end-radius:var(--radius-xl);padding:10px 18px 20px;box-shadow:var(--shadow-3);max-width:340px}\n.qsec .q-sheet .grab{width:44px;height:4px;border-radius:999px;background:var(--n-300);margin:0 auto 14px}\n.qsec .q-tip{display:inline-block;position:relative;background:var(--olive-900);color:var(--n-25);font-size:12.5px;padding:8px 12px;border-radius:9px;border-end-end-radius:16px;max-width:240px}\n.qsec .q-tip::after{content:\"\";position:absolute;bottom:-5px;inset-inline-end:18px;width:10px;height:10px;background:var(--olive-900);border-end-start-radius:10px;transform:rotate(45deg)}\n.qsec .q-dirgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;margin:18px 0}\n.qsec .q-dircard{border:1px solid var(--n-200);border-radius:var(--radius-lg);border-end-end-radius:var(--sweep-lg);background:var(--n-0);overflow:hidden}\n.qsec .q-dircard .top{height:118px;display:flex;align-items:center;justify-content:center;gap:10px;background:var(--n-50);border-bottom:1px solid var(--n-200)}\n.qsec .q-dircard .bd{padding:14px 16px 18px}\n.qsec .q-dircard h4{margin:0 0 4px;font-family:var(--display);font-size:16px}\n.qsec .q-dircard .tg{font-family:var(--mono);font-size:11px;color:var(--n-500);margin-bottom:8px}\n.qsec .q-dircard p{font-size:13.5px;color:var(--n-600);margin:0 0 8px}\n.qsec .q-dircard .vd{font-size:12.5px;padding-top:9px;border-top:1px solid var(--n-100);color:var(--n-700)}\n.qsec .q-pickflag{background:var(--olive-600);color:#fff;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding:5px 12px;text-align:center}\n.qsec .q-picked{border:2px solid var(--olive-600);box-shadow:var(--shadow-2)}\n@media (prefers-reduced-motion: reduce){\n  .qsec *{animation-duration:1ms!important;animation-iteration-count:1!important;transition-duration:1ms!important}\n}\n@media(max-width:720px){.qsec .q-rail{width:100%}}\n<\u002Fstyle>\n\n<!-- 9 -->\n<section id=\"components\" class=\"qsec\">\n  <div class=\"sec-num\">09<\u002Fdiv>\n  <h2>Component system<\u002Fh2>\n  <p class=\"lede\">The palette, type, spacing, and art direction of §04–§08 are unchanged. What changes here is <strong>silhouette and motion<\u002Fstrong>: components stop being neutral rectangles and start carrying the geometry of the Qiwam mark — the open circle, the single sweeping tail, the one traveling leaf, and the protected white gap. Nothing below adds a colour, a font, or a spacing value that does not already exist in the system.<\u002Fp>\n\n  <h3>9.1 · Three directions for the component language<\u002Fh3>\n  <p class=\"small\">All three use identical tokens. They differ in <em>which<\u002Fem> property of the logo becomes the component silhouette.<\u002Fp>\n\n  <div class=\"q-dirgrid\">\n    <div class=\"q-dircard\">\n      <div class=\"top\">\n        <div style=\"width:120px;height:44px;background:var(--olive-600);border-radius:0;border-start-start-radius:22px;border-end-start-radius:22px\"><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"bd\">\n        <h4>A · الهلال — Crescent<\u002Fh4>\n        <div class=\"tg\">silhouette-led · one full round edge<\u002Fdiv>\n        <p>Every control gets one fully rounded end, like the outer curve of the Q. Buttons read as half-pills, cards as leaf-tipped slabs.<\u002Fp>\n        <div class=\"vd\"><strong>Rejected:<\u002Fstrong> at three sizes and two directions the half-pill reads as a chat bubble, and 24px+ of curvature eats the inline-start padding of Arabic labels. It also collides with the chip shape already defined in §06.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"q-dircard q-picked\">\n      <div class=\"q-pickflag\">Chosen<\u002Fdiv>\n      <div class=\"top\">\n        <div style=\"width:120px;height:44px;background:var(--olive-600);border-radius:10px;border-end-end-radius:24px\"><\u002Fdiv>\n        <div class=\"q-ring\" aria-hidden=\"true\"><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"bd\">\n        <h4>B · القوس — The Arc<\u002Fh4>\n        <div class=\"tg\">corner + open-ring · one tail, one gap<\u002Fdiv>\n        <p>Three corners hold the system radius; <strong>one corner — block-end / inline-end — opens into a 24px sweep<\u002Fstrong>, the Q tail. Circular elements are drawn as <strong>open<\u002Fstrong> rings with a 60° gap. Motion is a single leaf traveling that arc.<\u002Fp>\n        <div class=\"vd\"><strong>Chosen:<\u002Fstrong> one geometric rule, two lines of CSS, mirrors correctly with logical properties, survives 200% text, and stays recognisable from a 16px switch knob to a 132px progress arc. It never reduces the readable box.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"q-dircard\">\n      <div class=\"top\">\n        <div style=\"width:120px;height:44px;background:var(--olive-600);border-radius:10px;position:relative;display:flex;align-items:center;justify-content:center\">\n          <span style=\"width:14px;height:14px;background:var(--lime-400);border-radius:72% 0 72% 0;transform:rotate(45deg);display:block\"><\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"bd\">\n        <h4>C · البستان — Leaf-marked<\u002Fh4>\n        <div class=\"tg\">ornament-led · leaf as a component mark<\u002Fdiv>\n        <p>Standard geometry, with a small leaf glyph placed on every interactive surface: buttons, checkmarks, bullets, spinners, dividers.<\u002Fp>\n        <div class=\"vd\"><strong>Rejected:<\u002Fstrong> this is precisely the failure the leaf rule in §07 exists to prevent — it turns a clinical product into an organic grocery, and at scale the leaf becomes visual noise rather than a signature.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"note\"><strong>Direction B is the system.<\u002Fstrong> Two shape primitives and one motion primitive, applied everywhere without exception:\n  <ul class=\"tight\" style=\"margin:8px 0 0\">\n    <li><strong>The sweep corner.<\u002Fstrong> Base radius on three corners; <code>border-end-end-radius<\u002Fcode> takes <code>shape.sweep<\u002Fcode>. One per component — never two, never on a nested child of a swept parent.<\u002Fli>\n    <li><strong>The open ring.<\u002Fstrong> Any circular element (icon container, radio, avatar frame, progress arc, donut) carries a 60° gap starting at 96°, so it is a Q, not an O. The gap is white space and is never filled.<\u002Fli>\n    <li><strong>The traveling leaf.<\u002Fstrong> Exactly one leaf, moving once along the arc. It is the only animated brand mark in the product, used for loading, completion, and streaks — nowhere else.<\u002Fli>\n  <\u002Ful><\u002Fdiv>\n\n  <table>\n    <tbody><tr><th style=\"width:26%\">New token<\u002Fth><th style=\"width:20%\">Value<\u002Fth><th>Applies to<\u002Fth><\u002Ftr>\n    <tr><td class=\"tok\">shape.sweep.control<\u002Ftd><td><code>24px<\u002Fcode> = radius.xl<\u002Ftd><td>Buttons, inputs, chips-with-tail, segmented control, stepper, toast, tooltip<\u002Ftd><\u002Ftr>\n    <tr><td class=\"tok\">shape.sweep.surface<\u002Ftd><td><code>32px<\u002Fcode><\u002Ftd><td>Cards, modals, rails, sheets, app bar<\u002Ftd><\u002Ftr>\n    <tr><td class=\"tok\">shape.sweep.corner<\u002Ftd><td><code>border-end-end-radius<\u002Fcode><\u002Ftd><td>The corner itself — logical, so it mirrors in Arabic with no override<\u002Ftd><\u002Ftr>\n    <tr><td class=\"tok\">shape.arc.gap<\u002Ftd><td><code>60°<\u002Fcode> from <code>96°<\u002Fcode><\u002Ftd><td>Every open ring, donut, and progress arc<\u002Ftd><\u002Ftr>\n    <tr><td class=\"tok\">shape.arc.stroke<\u002Ftd><td><code>8<\u002Fcode> of 100 viewBox<\u002Ftd><td>Progress arcs, donut rings<\u002Ftd><\u002Ftr>\n    <tr><td class=\"tok\">motion.arc.duration<\u002Ftd><td><code>2400ms<\u002Fcode><\u002Ftd><td>One full leaf lap (page loader, completion)<\u002Ftd><\u002Ftr>\n    <tr><td class=\"tok\">motion.arc.ease<\u002Ftd><td><code>cubic-bezier(.45,.05,.55,.95)<\u002Fcode><\u002Ftd><td>Arc travel — slow in, slow out, no bounce<\u002Ftd><\u002Ftr>\n    <tr><td class=\"tok\">motion.sweep.ease<\u002Ftd><td><code>cubic-bezier(.2,.6,.2,1)<\u002Fcode><\u002Ftd><td>Corner growth, indicator travel, knob slide<\u002Ftd><\u002Ftr>\n  <\u002Ftbody><\u002Ftable>\n  <div class=\"note warn\"><strong>Reconciliation with §07 and §12.<\u002Fstrong> The leaf rule still holds: no static leaf ornament is added to any surface. The leaf appears only as the single <em>moving<\u002Fem> mark of the motion system, and only during loading, completion, or streak states. The arc is likewise <strong>not<\u002Fstrong> a percentage-complete ring — it never closes into a full circle, never displays <code>٪<\u002Fcode>, and its \"complete\" state means <em>inside the comfortable range<\u002Fem>, not 100%. The balance band of §03 remains the signature for anything measured as a range.<\u002Fdiv>\n\n  <hr style=\"margin:48px 0\">\n\n  <h3>9.2 · Buttons<\u002Fh3>\n  <p class=\"small\">A rectangle with a 24px tail on one corner. That is the whole idea, and it is enough: the shape is unmistakable at a glance, the label box is unaffected, and the hover state animates the tail from 24 → 30px so the button appears to lean into the press.<\u002Fp>\n\n  <div class=\"q-demo q-rtl\">\n    <div class=\"lbl\">VARIANTS — أساسي · ثانوي · ثالثي · إتمام · تدميري · أيقونة<\u002Fdiv>\n    <div class=\"q-row\">\n      <button class=\"qb qb-primary\">حفظ الخطة<\u002Fbutton>\n      <button class=\"qb qb-secondary\">معاينة الخطة<\u002Fbutton>\n      <button class=\"qb qb-tertiary\">إلغاء<\u002Fbutton>\n      <button class=\"qb qb-accent\">إنهاء اليوم<\u002Fbutton>\n      <button class=\"qb qb-danger\">حذف القالب<\u002Fbutton>\n      <button class=\"qb qb-icon\" aria-label=\"إضافة وجبة\">＋<\u002Fbutton>\n      <button class=\"qb qb-icon\" aria-label=\"تصفية\">≡<\u002Fbutton>\n    <\u002Fdiv>\n    <div class=\"q-cap\">min-height 48 · padding 0 20 · radius 10 / sweep 24 · label 15/600<\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"q-demo q-rtl\">\n    <div class=\"lbl\">STATES — عادي · مرور · تركيز · ضغط · تحميل · نجاح · معطّل<\u002Fdiv>\n    <div class=\"q-row\">\n      <button class=\"qb qb-primary\">عادي<\u002Fbutton>\n      <button class=\"qb qb-hover-demo\">مرور<\u002Fbutton>\n      <button class=\"qb qb-focus-demo\">تركيز<\u002Fbutton>\n      <button class=\"qb qb-press-demo\">ضغط<\u002Fbutton>\n      <button class=\"qb qb-primary\" aria-busy=\"true\"><span class=\"orbit orbit-16\" aria-hidden=\"true\"><svg viewBox=\"0 0 100 100\" width=\"18\" height=\"18\"><circle cx=\"50\" cy=\"50\" r=\"42\" fill=\"none\" stroke=\"rgba(255,255,255,.28)\" stroke-width=\"12\" stroke-linecap=\"round\" stroke-dasharray=\"219.9 44\" transform=\"rotate(75 50 50)\"><\u002Fcircle><\u002Fsvg><span class=\"spin orbit-btn\"><i><\u002Fi><\u002Fspan><\u002Fspan> جارٍ الحفظ…<\u002Fbutton>\n      <button class=\"qb qb-success\"><span style=\"display:inline-flex;width:16px;height:16px;align-items:center;justify-content:center\">✓<\u002Fspan> تم الحفظ<\u002Fbutton>\n      <button class=\"qb\" disabled=\"\">حفظ الخطة<\u002Fbutton>\n    <\u002Fdiv>\n    <div class=\"q-cap\">loading: leaf laps the open ring, 1600ms · success: leaf closes the arc then swaps to ✓, holds 1400ms<\u002Fdiv>\n  <\u002Fdiv>\n\n  <table>\n    <tbody><tr><th style=\"width:16%\">Aspect<\u002Fth><th>Specification<\u002Fth><\u002Ftr>\n    <tr><td>Concept<\u002Ftd><td>A calm slab with one sweeping tail. Icon-only buttons invert the idea: a circle (the Q head) with one tail corner at 14px, so round and rectangular buttons are visibly the same family.<\u002Ftd><\u002Ftr>\n    <tr><td>Anatomy<\u002Ftd><td>[optional leading icon 20px] · label · [optional trailing indicator]. Loading replaces the leading icon slot with the 18px arc; success replaces it with a 16px check. Width never changes between the three, so no layout shift.<\u002Ftd><\u002Ftr>\n    <tr><td>Dimensions<\u002Ftd><td>Default 48px tall (mobile minimum, §08). Compact desktop 40px, allowed only in toolbars and table rows. Icon 48×48 (40×40 pointer-only). Max width 320px; labels never wrap.<\u002Ftd><\u002Ftr>\n    <tr><td>Spacing<\u002Ftd><td>Padding <code>0 20<\u002Fcode>; tertiary <code>0 12<\u002Fcode>. Icon-to-label gap 8. Sibling buttons 12 apart, and primary sits at the <strong>inline-start<\u002Fstrong> of the group in both locales.<\u002Ftd><\u002Ftr>\n    <tr><td>Shape<\u002Ftd><td><code>border-radius:10px; border-end-end-radius:24px<\u002Fcode>. Icon: <code>50%<\u002Fcode> with <code>border-end-end-radius:14px<\u002Fcode>. Never a full pill — that shape belongs to chips.<\u002Ftd><\u002Ftr>\n    <tr><td>Typography<\u002Ftd><td><code>type.label<\u002Fcode> stepped to 15px / weight 600 / line-height 1 / <code>letter-spacing:0<\u002Fcode>. No uppercase, ever (§04).<\u002Ftd><\u002Ftr>\n    <tr><td>Colour tokens<\u002Ftd><td>primary <code>action.primary.bg<\u002Fcode> → hover <code>.hover<\u002Fcode> → pressed <code>.pressed<\u002Fcode>; accent <code>bg.accent<\u002Fcode> + <code>text.onAccent<\u002Fcode>; secondary <code>border.selected<\u002Fcode> + <code>text.brand<\u002Fcode>; tertiary <code>text.primary<\u002Fcode>; destructive clay-700/clay-600; disabled <code>action.disabled.bg<\u002Fcode> + n-500 (4.0:1).<\u002Ftd><\u002Ftr>\n    <tr><td>Variants<\u002Ftd><td>primary · secondary · tertiary · accent (completion only, one per screen) · destructive · icon · icon-toggle. No ghost-on-dark variant; on olive surfaces the secondary border becomes lime-400 and the label n-25.<\u002Ftd><\u002Ftr>\n    <tr><td>States<\u002Ftd><td>rest · hover · focus-visible · pressed · active/selected (toggle only: olive-100 fill + olive-600 border) · loading · success · disabled.<\u002Ftd><\u002Ftr>\n    <tr><td>Interaction<\u002Ftd><td>Hover grows the tail 24 → 30. Press sinks 1px and pulls the tail to 18. Loading is announced and the button stays the same width; it cannot be pressed twice. Success holds 1400ms then returns to rest, or the view navigates — whichever comes first.<\u002Ftd><\u002Ftr>\n    <tr><td>Animation<\u002Ftd><td>Tail 200ms <code>motion.sweep.ease<\u002Fcode>; colour 160ms ease-out; press 160ms. Button loader 1600ms linear-eased lap, infinite. Success 520ms: the leaf completes the remaining arc, fades, the check scales 0.8 → 1.<\u002Ftd><\u002Ftr>\n    <tr><td>Accessibility<\u002Ftd><td>48px target with 8px separation. Focus = 2px lime inner + 4px olive-950 outer (§11). Icon buttons carry <code>aria-label<\u002Fcode> in Arabic. Loading sets <code>aria-busy=\"true\"<\u002Fcode> and <code>aria-live=\"polite\"<\u002Fcode> on the label. Disabled buttons are always accompanied by text stating what unlocks them.<\u002Ftd><\u002Ftr>\n    <tr><td>RTL<\u002Ftd><td>Nothing to mirror by hand — the sweep is a logical corner, so it moves to the bottom-left in Arabic automatically. Icon buttons whose glyph encodes direction mirror per §07; the arc and the leaf do not.<\u002Ftd><\u002Ftr>\n    <tr><td>Figma / dev<\u002Ftd><td>Figma: one component with variant props <code>variant<\u002Fcode>, <code>state<\u002Fcode>, <code>size<\u002Fcode>, <code>hasIcon<\u002Fcode>; the sweep corner is an individual corner-radius value, not a mask, so it survives auto-layout resizing. Dev: one <code>.qb<\u002Fcode> base class plus a modifier; the sweep is two declarations and requires no SVG. Do not build it with <code>clip-path<\u002Fcode> — it breaks focus rings.<\u002Ftd><\u002Ftr>\n  <\u002Ftbody><\u002Ftable>\n\n  <hr style=\"margin:48px 0\">\n\n  <h3>9.3 · Text fields &amp; form controls<\u002Fh3>\n  <p class=\"small\">The field is a box with the same tail. On focus, an olive line grows from the tail along the block-end edge to 58% of the width — the Q curve being drawn, once, in 220ms. The label shifts colour rather than floating, because floating labels fail at 200% text size and read poorly in Arabic.<\u002Fp>\n\n  <div class=\"q-demo q-rtl\">\n    <div class=\"lbl\">TEXT · SEARCH · PASSWORD — with the arc focus line<\u002Fdiv>\n    <div class=\"q-grid-2\">\n      <div>\n        <div class=\"qf\">\n          <label for=\"d1\">اسم العميل<\u002Flabel>\n          <div class=\"q-field\"><input id=\"d1\" value=\"ليلى نصار\"><\u002Fdiv>\n          <div class=\"q-hint\">الاسم كما يظهر في التقارير<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"qf is-focus\">\n          <label for=\"d2\">البحث في العملاء<\u002Flabel>\n          <div class=\"q-field is-focus\"><span class=\"q-icn\" aria-hidden=\"true\">⌕<\u002Fspan><input id=\"d2\" value=\"سامر\"><\u002Fdiv>\n          <div class=\"q-hint\">٣ نتائج<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div>\n        <div class=\"qf\">\n          <label for=\"d3\">كلمة المرور<\u002Flabel>\n          <div class=\"q-field\"><input id=\"d3\" type=\"password\" value=\"••••••••\"><button class=\"qb qb-tertiary\" style=\"min-height:32px;padding:0 8px;font-size:12.5px\">إظهار<\u002Fbutton><\u002Fdiv>\n          <div class=\"q-hint\">٨ أحرف على الأقل<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"qf\">\n          <label for=\"d4\">ملاحظة الجلسة<\u002Flabel>\n          <div class=\"q-field\" style=\"align-items:flex-start;padding:4px 14px\"><textarea id=\"d4\">تحسّن ملحوظ في انتظام الإفطار.<\u002Ftextarea><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"q-demo q-rtl\">\n    <div class=\"lbl\">VALIDATION — error and success never rely on colour<\u002Fdiv>\n    <div class=\"q-grid-2\">\n      <div class=\"qf\">\n        <label for=\"d5\">الوزن الحالي (كجم)<\u002Flabel>\n        <div class=\"q-field is-error\"><input id=\"d5\" value=\"٤\" aria-invalid=\"true\" aria-describedby=\"e5\"><\u002Fdiv>\n        <div class=\"q-hint err\" id=\"e5\"><span aria-hidden=\"true\">⬡<\u002Fspan> القيمة أقل من النطاق المتوقع — أدخل رقمًا بين ٣٠ و ٢٥٠<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"qf\">\n        <label for=\"d6\">البريد الإلكتروني<\u002Flabel>\n        <div class=\"q-field is-ok\"><input id=\"d6\" value=\"laila@example.com\" dir=\"ltr\" style=\"text-align:left\"><span class=\"q-leaf\" aria-hidden=\"true\"><\u002Fspan><\u002Fdiv>\n        <div class=\"q-hint ok\"><span aria-hidden=\"true\">✓<\u002Fspan> تم التحقق<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"q-cap\">valid: 11px leaf mark inside the field + text · invalid: 2px clay border + octagon glyph + sentence naming the fix<\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"q-demo q-rtl\">\n    <div class=\"lbl\">SELECT · AUTOCOMPLETE · DATE · TIME<\u002Fdiv>\n    <div class=\"q-grid-2\">\n      <div>\n        <div class=\"qf\"><label for=\"d7\">نوع الخطة<\u002Flabel>\n          <div class=\"q-field\"><select id=\"d7\"><option>خطة متوازنة — ٣ وجبات<\u002Foption><option>خطة متوازنة — ٥ وجبات<\u002Foption><option>خطة نباتية<\u002Foption><\u002Fselect><\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"qf\"><label for=\"d8\">حساسيات غذائية<\u002Flabel>\n          <div class=\"q-field\"><input id=\"d8\" value=\"الجلوتين\"><\u002Fdiv>\n          <div style=\"border:1px solid var(--n-200);border-radius:10px;border-end-end-radius:var(--sweep);margin-top:6px;background:var(--n-0);box-shadow:var(--shadow-2);overflow:hidden\">\n            <div style=\"padding:10px 14px;background:var(--olive-50);color:var(--olive-800);font-weight:600;font-size:14px\">الجلوتين<\u002Fdiv>\n            <div style=\"padding:10px 14px;font-size:14px;color:var(--n-700)\">الجوز واللوز<\u002Fdiv>\n            <div style=\"padding:10px 14px;font-size:14px;color:var(--n-700)\">اللاكتوز<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div>\n        <div class=\"qf\"><label for=\"d9\">تاريخ الجلسة<\u002Flabel>\n          <div class=\"q-field\"><span class=\"q-icn\" aria-hidden=\"true\">▤<\u002Fspan><input id=\"d9\" value=\"الأحد ٢ أغسطس ٢٠٢٦\"><\u002Fdiv>\n          <div class=\"q-hint\">التقويم: ميلادي · <span style=\"color:var(--olive-700);font-weight:600\">التحويل إلى الهجري<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"qf\"><label for=\"d10\">الوقت<\u002Flabel>\n          <div class=\"q-field\"><span class=\"q-icn\" aria-hidden=\"true\">◷<\u002Fspan><input id=\"d10\" value=\"٥:٠٠ م\" dir=\"auto\"><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"q-demo q-rtl\">\n    <div class=\"lbl\">CHECKBOX · RADIO · SWITCH · SEGMENTED · STEPPER<\u002Fdiv>\n    <div class=\"q-grid-2\">\n      <div>\n        <div class=\"q-ctl\"><span class=\"q-check on\" aria-hidden=\"true\">✓<\u002Fspan> شرب الماء<\u002Fdiv>\n        <div class=\"q-ctl\"><span class=\"q-check\" aria-hidden=\"true\"><\u002Fspan> النوم المبكر<\u002Fdiv>\n        <div class=\"q-ctl\"><span class=\"q-radio on\" aria-hidden=\"true\"><\u002Fspan> ٣ وجبات يوميًا<\u002Fdiv>\n        <div class=\"q-ctl\"><span class=\"q-radio\" aria-hidden=\"true\"><\u002Fspan> ٥ وجبات يوميًا<\u002Fdiv>\n      <\u002Fdiv>\n      <div>\n        <div class=\"q-ctl\" style=\"justify-content:space-between;max-width:280px\"><span>إظهار الوزن للعميلة<\u002Fspan><span class=\"q-switch on\" role=\"switch\" aria-checked=\"true\"><span><\u002Fspan><\u002Fspan><\u002Fdiv>\n        <div class=\"q-ctl\" style=\"justify-content:space-between;max-width:280px\"><span>تذكير المساء<\u002Fspan><span class=\"q-switch\" role=\"switch\" aria-checked=\"false\"><span><\u002Fspan><\u002Fspan><\u002Fdiv>\n        <div class=\"q-row\" style=\"margin-top:8px\">\n          <div class=\"q-seg\" role=\"tablist\"><button class=\"on\">أسبوع<\u002Fbutton><button>شهر<\u002Fbutton><button>٣ أشهر<\u002Fbutton><\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"q-row\" style=\"margin-top:12px\">\n          <span style=\"font-size:13px;color:var(--n-700)\">حصص الخضار<\u002Fspan>\n          <div class=\"q-step\"><button aria-label=\"إنقاص\">−<\u002Fbutton><span class=\"v\">٣<\u002Fspan><button aria-label=\"زيادة\">＋<\u002Fbutton><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"q-cap\">checkbox 24 box / 48 hit · radio = open ring, filled when chosen · switch knob rotates −45° into the leaf angle · segmented indicator slides 180ms<\u002Fdiv>\n  <\u002Fdiv>\n\n  <table>\n    <tbody><tr><th style=\"width:16%\">Aspect<\u002Fth><th>Specification<\u002Fth><\u002Ftr>\n    <tr><td>Concept<\u002Ftd><td>Structure, not decoration: a field is the arc's straight side; focus draws the curve. Every round control is an open ring, so radios, leading-icon containers, and avatars all read as the Q head.<\u002Ftd><\u002Ftr>\n    <tr><td>Anatomy<\u002Ftd><td>Label (always visible, above) · field box [leading circular icon 28 · input · trailing action or status mark] · helper or error line. Never placeholder-as-label.<\u002Ftd><\u002Ftr>\n    <tr><td>Dimensions<\u002Ftd><td>Field 48px tall (56 on desktop forms with 16px text), textarea min 88px. Checkbox 24 in a 48 target, radio 24, switch 52×30 with a 24 knob, stepper 48 tall with 40px circular controls, segmented 48 tall.<\u002Ftd><\u002Ftr>\n    <tr><td>Spacing<\u002Ftd><td>Label → field 6. Field → helper 6. Field → next field 16. Inline padding 14. Leading icon → text 10. Control → label 10.<\u002Ftd><\u002Ftr>\n    <tr><td>Shape<\u002Ftd><td>Field <code>radius 10 / sweep 24<\u002Fcode>. Checkbox <code>radius 7 / sweep 12<\u002Fcode>. Switch track pill; knob circle with a <code>9px<\u002Fcode> sweep. Segmented shell <code>12 / 24<\u002Fcode>, thumb <code>9 / 18<\u002Fcode>. Dropdown panels inherit the field's sweep so the pair reads as one shape.<\u002Ftd><\u002Ftr>\n    <tr><td>Typography<\u002Ftd><td>Label <code>type.label<\u002Fcode> 13/600 n-800. Input <code>type.body.md<\u002Fcode> 16/400 — never below 16 on mobile, to stop iOS zoom and to keep diacritics legible. Helper <code>type.caption<\u002Fcode> 12.5 n-600. Values are tabular.<\u002Ftd><\u002Ftr>\n    <tr><td>Colour tokens<\u002Ftd><td>Border <code>border.interactive<\u002Fcode> (n-500, 4.02:1) → focus <code>border.selected<\u002Fcode> + 3px olive-100 halo. Arc line olive-600. Error clay-600 border 2px + clay-700 text. Valid olive-600 border + olive-600 leaf. Disabled n-100 fill, n-500 text, no sweep animation.<\u002Ftd><\u002Ftr>\n    <tr><td>Variants<\u002Ftd><td>text · search · password · textarea · select · autocomplete · date (Hijri/Gregorian toggle) · time · number/stepper · checkbox · radio · switch · segmented · slider (uses the balance band track from §03).<\u002Ftd><\u002Ftr>\n    <tr><td>States<\u002Ftd><td>rest · hover (border n-600) · focus (arc draws) · filled · error · valid · disabled · read-only (sunken fill, no border, no sweep) · loading (autocomplete shows the 18px arc in the trailing slot).<\u002Ftd><\u002Ftr>\n    <tr><td>Interaction<\u002Ftd><td>Label colour shifts to olive-700 and the arc grows on focus; both reverse on blur in 140ms. Validation runs on blur, never per keystroke. Errors persist until fixed and are re-announced only when the value changes. Stepper hold-to-repeat starts after 500ms at 6/second.<\u002Ftd><\u002Ftr>\n    <tr><td>Animation<\u002Ftd><td>Arc line 220ms <code>motion.sweep.ease<\u002Fcode> (width only — no colour flash). Label 180ms ease-out. Switch knob 220ms slide + rotate. Segmented thumb 180ms. Error entrance is an opacity fade, never a shake.<\u002Ftd><\u002Ftr>\n    <tr><td>Accessibility<\u002Ftd><td>Every field has a real <code>&lt;label for&gt;<\u002Fcode>. Errors use <code>aria-invalid<\u002Fcode> + <code>aria-describedby<\u002Fcode> and always carry a glyph and a sentence stating the fix. Valid state carries ✓ text as well as the leaf. 48px targets. Switch uses <code>role=\"switch\"<\u002Fcode> with <code>aria-checked<\u002Fcode>. Autocomplete is a combobox with managed <code>aria-activedescendant<\u002Fcode>.<\u002Ftd><\u002Ftr>\n    <tr><td>RTL<\u002Ftd><td>Field content and icon order mirror; the arc line grows from the inline-end corner, so in Arabic it grows leftward from the bottom-left. Latin values (email, units) get <code>dir=\"auto\"<\u002Fcode> per §08. Time and date keep internal LTR digit order. The stepper keeps − at the inline-start and ＋ at the inline-end in both locales, because it is a spatial control, not a reading one.<\u002Ftd><\u002Ftr>\n    <tr><td>Figma / dev<\u002Ftd><td>Figma: field as one component, arc line as a 2px rectangle with a right-edge sweep, width 0% → 58% between two variants so prototypes show it. Dev: the arc is a <code>::after<\u002Fcode> on the wrapper animating <code>width<\u002Fcode> only, and the wrapper uses <code>:focus-within<\u002Fcode>, so no JS is required.<\u002Ftd><\u002Ftr>\n  <\u002Ftbody><\u002Ftable>\n\n  <hr style=\"margin:48px 0\">\n\n  <h3>9.4 · Cards<\u002Fh3>\n  <p class=\"small\">Same tail at 32px, plus a controlled asymmetry: content is inset-start-aligned, the status marker sits in the inline-end corner, and a card that overlaps another surface uses a canvas-coloured circular cutout at the tail so the white gap of the logo appears in the layout instead of being drawn.<\u002Fp>\n\n  <div class=\"q-demo\">\n    <div class=\"lbl\">CARD FAMILY — بطاقات<\u002Fdiv>\n    <div class=\"q-grid q-rtl\">\n\n      <div class=\"qc\">\n        <div class=\"qc-h\">\n          <div><div class=\"qc-t\">ليلى نصار<\u002Fdiv><div class=\"qc-s\">٣٤ سنة · خطة متوازنة — ٣ وجبات<\u002Fdiv><\u002Fdiv>\n          <span class=\"q-head\" aria-hidden=\"true\" style=\"width:36px;height:36px;font-family:var(--display);font-size:13px;color:var(--olive-800)\">ل ن<\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"q-row\" style=\"gap:8px;margin-top:10px\"><span class=\"chip c-ok\"><span class=\"g\">✓<\u002Fspan> ضمن المسار<\u002Fspan><span class=\"qc-s\">٥ من ٧ هذا الأسبوع<\u002Fspan><\u002Fdiv>\n        <div class=\"q-cap\" style=\"direction:rtl;text-align:right\">بطاقة عميل<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"qc qc-tint\">\n        <div class=\"qc-h\"><div class=\"qc-t\">خطة متوازنة — ٣ وجبات<\u002Fdiv><span class=\"qc-dot\" aria-hidden=\"true\"><\u002Fspan><\u002Fdiv>\n        <div class=\"qc-s\">إفطار ٨:٣٠ · غداء ١:٣٠ · عشاء ٧:٠٠<\u002Fdiv>\n        <div class=\"qc-arc\" role=\"img\" aria-label=\"اكتملت أربع أيام من سبعة\"><i style=\"width:57%\"><\u002Fi><\u002Fdiv>\n        <div class=\"qc-s\">٤ من ٧ أيام مُعدّة<\u002Fdiv>\n        <div class=\"q-cap\" style=\"direction:rtl;text-align:right\">بطاقة خطة غذائية<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"qc\">\n        <div class=\"qc-h\"><div><div class=\"qc-t\">جلسة متابعة<\u002Fdiv><div class=\"qc-s\">الأحد ٢ أغسطس · ٥:٠٠ م · ٤٥ دقيقة<\u002Fdiv><\u002Fdiv><span class=\"q-head\" aria-hidden=\"true\" style=\"width:36px;height:36px;color:var(--olive-700);font-size:14px\">◷<\u002Fspan><\u002Fdiv>\n        <div class=\"q-row\" style=\"margin-top:12px;gap:8px\"><button class=\"qb qb-secondary\" style=\"min-height:40px;font-size:13.5px\">تأكيد<\u002Fbutton><button class=\"qb qb-tertiary\" style=\"min-height:40px;font-size:13.5px\">إعادة جدولة<\u002Fbutton><\u002Fdiv>\n        <div class=\"q-cap\" style=\"direction:rtl;text-align:right\">بطاقة موعد<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"qc\">\n        <div class=\"qc-h\"><div class=\"qc-t\">عادات اليوم<\u002Fdiv><div class=\"qc-s\">٢ من ٤<\u002Fdiv><\u002Fdiv>\n        <div class=\"q-row\" style=\"gap:8px\">\n          <span class=\"chip c-ok\"><span class=\"g\">✓<\u002Fspan> شرب الماء<\u002Fspan>\n          <span class=\"chip c-ok\"><span class=\"g\">✓<\u002Fspan> المشي<\u002Fspan>\n          <span class=\"chip c-none\"><span class=\"g\"><\u002Fspan> الخضار في الوجبة<\u002Fspan>\n          <span class=\"chip c-none\"><span class=\"g\"><\u002Fspan> النوم المبكر<\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"q-cap\" style=\"direction:rtl;text-align:right\">بطاقة عادات<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"qc\" style=\"display:flex;flex-wrap:wrap;gap:14px;align-items:center\">\n        <span aria-hidden=\"true\" style=\"flex:0 0 auto\"><svg viewBox=\"0 0 100 100\" width=\"80\" height=\"80\" role=\"img\" aria-label=\"التزام الأسبوع\"><circle cx=\"50\" cy=\"50\" r=\"42\" fill=\"none\" stroke=\"#EFEDE4\" stroke-width=\"8\" stroke-linecap=\"round\" stroke-dasharray=\"219.9 43.99999999999997\" transform=\"rotate(75 50 50)\"><\u002Fcircle><circle cx=\"50\" cy=\"50\" r=\"42\" fill=\"none\" stroke=\"#4D7428\" stroke-width=\"8\" stroke-linecap=\"round\" stroke-dasharray=\"149.5 263.9\" transform=\"rotate(75 50 50)\"><\u002Fcircle><path d=\"M68 68 L92 92\" stroke=\"#4D7428\" stroke-width=\"8\" stroke-linecap=\"round\" fill=\"none\" opacity=\"1\"><\u002Fpath><circle cx=\"13.6\" cy=\"71.0\" r=\"3.4\" fill=\"#3D5C21\" stroke=\"#3D5C21\" stroke-width=\"1.6\"><\u002Fcircle><circle cx=\"20.3\" cy=\"20.3\" r=\"3.4\" fill=\"#3D5C21\" stroke=\"#3D5C21\" stroke-width=\"1.6\"><\u002Fcircle><circle cx=\"71.0\" cy=\"13.6\" r=\"3.4\" fill=\"#FCFBF7\" stroke=\"#CDC9B9\" stroke-width=\"1.6\"><\u002Fcircle><circle cx=\"56.6\" cy=\"8.5\" r=\"6\" fill=\"#4D7428\"><\u002Fcircle><\u002Fsvg><\u002Fspan>\n        <div style=\"flex:1 1 140px;min-width:0\">\n          <div class=\"qc-t\">التزام الأسبوع<\u002Fdiv>\n          <div class=\"q-num\" style=\"font-size:26px\">٥ <span style=\"font-size:15px;font-weight:400;color:var(--n-600)\">من ٧ أيام<\u002Fspan><\u002Fdiv>\n          <div class=\"qc-s\">يوم راحة واحد محفوظ<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"q-cap\" style=\"direction:rtl;text-align:right;flex:1 0 100%\">بطاقة تقدّم<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"qc\">\n        <div class=\"qc-h\"><div class=\"qc-t\">تقرير أربعة أسابيع<\u002Fdiv><span class=\"chip c-rest\" style=\"font-size:11px\">جاهز<\u002Fspan><\u002Fdiv>\n        <div class=\"qc-s\">الطاقة · النوم · الالتزام · الشعور العام<\u002Fdiv>\n        <div class=\"qc-arc\" style=\"background:var(--n-100)\"><i style=\"width:100%\"><\u002Fi><\u002Fdiv>\n        <div class=\"q-row\" style=\"justify-content:space-between\"><span class=\"qc-s\">٢ يوليو – ٢٩ يوليو ٢٠٢٦<\u002Fspan><span style=\"color:var(--olive-700);font-weight:600;font-size:13px\">عرض التقرير<\u002Fspan><\u002Fdiv>\n        <div class=\"q-cap\" style=\"direction:rtl;text-align:right\">بطاقة تقرير<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"qc qc-empty\">\n        <span class=\"orbit orbit-48\" aria-hidden=\"true\" style=\"display:inline-block;margin-bottom:10px\">\n          <svg viewBox=\"0 0 100 100\" width=\"48\" height=\"48\"><circle cx=\"50\" cy=\"50\" r=\"42\" fill=\"none\" stroke=\"#CDC9B9\" stroke-width=\"9\" stroke-linecap=\"round\" stroke-dasharray=\"219.9 44\" transform=\"rotate(75 50 50)\"><\u002Fcircle><path d=\"M68 68 L92 92\" stroke=\"#CDC9B9\" stroke-width=\"9\" stroke-linecap=\"round\"><\u002Fpath><\u002Fsvg>\n          <span class=\"spin\"><i style=\"background:var(--olive-300)\"><\u002Fi><\u002Fspan>\n        <\u002Fspan>\n        <div class=\"qc-t\" style=\"font-size:15px\">لا توجد وجبات مسجّلة اليوم<\u002Fdiv>\n        <div class=\"qc-s\" style=\"margin:4px 0 12px\">أضيفي أول وجبة لتظهر خطة اليوم<\u002Fdiv>\n        <button class=\"qb qb-primary\" style=\"min-height:40px;font-size:13.5px\">إضافة وجبة<\u002Fbutton>\n        <div class=\"q-cap\" style=\"direction:rtl;text-align:right\">بطاقة حالة فارغة<\u002Fdiv>\n      <\u002Fdiv>\n\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <table>\n    <tbody><tr><th style=\"width:16%\">Aspect<\u002Fth><th>Specification<\u002Fth><\u002Ftr>\n    <tr><td>Concept<\u002Ftd><td>One swept corner, one asymmetric anchor. The tail always points at the card's action or its status, so the shape carries information instead of decorating.<\u002Ftd><\u002Ftr>\n    <tr><td>Anatomy<\u002Ftd><td>Header row (title + optional inline-end marker: open-ring avatar, circular icon, status chip, or 10px dot) · body · optional arc divider or progress accent · footer row (metadata inline-start, action inline-end).<\u002Ftd><\u002Ftr>\n    <tr><td>Dimensions<\u002Ftd><td>Padding 16 mobile / 20 desktop (§06). Min height 96. Dashboard grid cards 1/2/3 columns at 4/8/12; mobile full-width with 16 margins. Cutout circle 44px, offset −14.<\u002Ftd><\u002Ftr>\n    <tr><td>Spacing<\u002Ftd><td>Title → sub 4. Header → body 8. Body → arc 12. Arc → footer 12. Card → card 12 mobile / 16 desktop.<\u002Ftd><\u002Ftr>\n    <tr><td>Shape<\u002Ftd><td><code>radius 16 / sweep 32<\u002Fcode>. Nested elements inside a card never repeat the sweep at the same corner — one tail per surface. Tinted cards use olive-50 on olive-200 border and no shadow.<\u002Ftd><\u002Ftr>\n    <tr><td>Typography<\u002Ftd><td>Title <code>type.heading.sm<\u002Fcode> (Readex 17/500) · sub and body <code>type.body.sm<\u002Fcode> 13–14 · numbers Readex 600 tabular · metadata <code>type.caption<\u002Fcode>.<\u002Ftd><\u002Ftr>\n    <tr><td>Colour tokens<\u002Ftd><td><code>bg.surface<\u002Fcode> + <code>border.divider<\u002Fcode> + <code>elevation.card<\u002Fcode>. Tinted: <code>bg.brand.subtle<\u002Fcode>. Arc accent olive-600 on olive-200. Selected row/card: olive-50 fill + 2px <code>border.selected<\u002Fcode>. Cutout uses <code>bg.canvas<\u002Fcode>, never white.<\u002Ftd><\u002Ftr>\n    <tr><td>Variants<\u002Ftd><td>patient · nutrition-plan (tinted) · appointment · habit · progress (with the arc) · report · empty-state (dashed, olive-300 outline arc) · list-row (no shadow, sweep only on the last row of a group).<\u002Ftd><\u002Ftr>\n    <tr><td>States<\u002Ftd><td>rest · hover (shadow-1 → shadow-2, tail 32 → 36) · pressed (scale .995, shadow-1) · selected · loading (skeleton) · disabled/archived (n-25 fill, n-500 text, no shadow) · flagged (clay marker in the corner, never a red card).<\u002Ftd><\u002Ftr>\n    <tr><td>Interaction<\u002Ftd><td>Whole card is one tap target on mobile with a visible pressed state; on desktop only the title and explicit actions are clickable, so text stays selectable. Never more than one primary action per card.<\u002Ftd><\u002Ftr>\n    <tr><td>Animation<\u002Ftd><td>Hover 180ms ease-out on shadow and tail. Entrance: 12px rise + fade, 220ms, staggered 40ms, capped at 6 cards then no stagger. Reordering uses FLIP at 220ms.<\u002Ftd><\u002Ftr>\n    <tr><td>Accessibility<\u002Ftd><td>Card title is the accessible name of the link/button, not \"عرض\". Progress arcs get <code>role=\"img\"<\u002Fcode> and a sentence label. Status is chip + text, never the corner marker alone. Dense grids keep 4.5:1 for all text on tinted surfaces (olive-800 on olive-50 = 11.9:1).<\u002Ftd><\u002Ftr>\n    <tr><td>RTL<\u002Ftd><td>The tail mirrors to bottom-left. Header marker moves to the inline-end (left in Arabic). Arc progress grows from the inline-start edge — right in Arabic — matching §08.<\u002Ftd><\u002Ftr>\n    <tr><td>Figma / dev<\u002Ftd><td>Figma: base card with slot layers and a boolean <code>hasCutout<\u002Fcode>; the cutout is an ellipse in canvas colour, not a boolean subtract, so it re-renders on any background. Dev: single <code>.qc<\u002Fcode> class; the arc accent is a 3px div with a start-end radius, no SVG.<\u002Ftd><\u002Ftr>\n  <\u002Ftbody><\u002Ftable>\n\n  <hr style=\"margin:48px 0\">\n\n  <h3>9.5 · Navigation<\u002Fh3>\n  <p class=\"small\">The active item is marked twice: an olive surface that grows around it, and a lime node — the dot above the Q in the mark. The node travels along a short curve between items in 220ms, so movement reads as a single object relocating rather than two states flickering.<\u002Fp>\n\n  <div class=\"q-demo\">\n    <div class=\"q-grid-2\">\n      <div class=\"q-rtl\">\n        <div class=\"lbl\">DESKTOP SIDEBAR — الشريط الجانبي<\u002Fdiv>\n        <nav class=\"q-rail\">\n          <a href=\"#components\" class=\"on\">العملاء<\u002Fa>\n          <a href=\"#components\">المواعيد<\u002Fa>\n          <a href=\"#components\">قوالب الخطط<\u002Fa>\n          <a href=\"#components\">الرسائل<\u002Fa>\n          <a href=\"#components\">التقارير<\u002Fa>\n        <\u002Fnav>\n      <\u002Fdiv>\n      <div class=\"q-rtl\">\n        <div class=\"lbl\">TOP APP BAR · TABS · BREADCRUMBS<\u002Fdiv>\n        <div class=\"q-bar\">\n          <span class=\"q-ring\" aria-hidden=\"true\" style=\"width:28px;height:28px\"><\u002Fspan>\n          <strong style=\"font-family:var(--display);font-weight:500;font-size:16px\">ملف ليلى نصار<\u002Fstrong>\n          <span style=\"flex:1\"><\u002Fspan>\n          <span class=\"chip c-rest\" style=\"font-size:11px\">ضمن المسار<\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"q-tabs\" style=\"margin-top:16px\">\n          <button class=\"on\">نظرة عامة<\u002Fbutton><button>الخطة<\u002Fbutton><button>التقدّم<\u002Fbutton><button>الملاحظات<\u002Fbutton>\n        <\u002Fdiv>\n        <div class=\"q-crumb\" style=\"margin-top:16px\">\n          <a href=\"#components\">العملاء<\u002Fa><span class=\"sep\" aria-hidden=\"true\"><\u002Fspan>\n          <a href=\"#components\">ليلى نصار<\u002Fa><span class=\"sep\" aria-hidden=\"true\"><\u002Fspan>\n          <span aria-current=\"page\" style=\"color:var(--n-800);font-weight:600\">تقرير يوليو<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"margin-top:20px\">\n          <div class=\"q-bottom\">\n            <div class=\"on\"><span class=\"g\"><\u002Fspan>اليوم<\u002Fdiv>\n            <div><span class=\"g\"><\u002Fspan>خطتي<\u002Fdiv>\n            <div><span class=\"g\"><\u002Fspan>تقدّمي<\u002Fdiv>\n            <div><span class=\"g\"><\u002Fspan>المحادثة<\u002Fdiv>\n            <div><span class=\"g\"><\u002Fspan>حسابي<\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"q-cap\">bottom nav — 5 items, labels always visible, lime node above the active icon<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <table>\n    <tbody><tr><th style=\"width:16%\">Aspect<\u002Fth><th>Specification<\u002Fth><\u002Ftr>\n    <tr><td>Concept<\u002Ftd><td>Two brand cues, no more: the swept active pill, and the lime node. Outline icons fill on activation using the open-ring language — the icon's interior gap closes to olive while the 60° opening stays white.<\u002Ftd><\u002Ftr>\n    <tr><td>Anatomy<\u002Ftd><td>Sidebar: rail (264 / collapsed 72, §08) · item [icon 20 · label · optional count] · active pill + node. Bottom nav: 5 items, icon 26 + label. App bar: open-ring mark · title · context chip · actions. Tabs: label row + 3px curved indicator. Breadcrumbs: links + 8px quarter-arc separators.<\u002Ftd><\u002Ftr>\n    <tr><td>Dimensions<\u002Ftd><td>Sidebar item 44 tall, 3 apart. Bottom nav 56 + safe area, each item ≥64 wide. App bar 56 mobile / 64 desktop. Tab 48 tall. Indicator 3×22 with pill ends. Node 8px.<\u002Ftd><\u002Ftr>\n    <tr><td>Spacing<\u002Ftd><td>Rail padding 14/10. Icon → label 10. Item inline padding 12. Tab inline padding 14, gap 6. Breadcrumb gap 8.<\u002Ftd><\u002Ftr>\n    <tr><td>Shape<\u002Ftd><td>Item pill <code>radius 10 / sweep 18<\u002Fcode>; when active the sweep grows to 24 as the surface expands. Tab indicator pill-capped with the inline-end cap slightly larger (999/999/999/0 logical) so it points along the reading direction. Separator is a bordered quarter-circle, not a chevron glyph.<\u002Ftd><\u002Ftr>\n    <tr><td>Typography<\u002Ftd><td>Sidebar 14/500, active 600 · bottom nav 10.5/600 · app bar title Readex 16/500 · tabs 14.5/600 · breadcrumbs 13/400 with the current page at 600.<\u002Ftd><\u002Ftr>\n    <tr><td>Colour tokens<\u002Ftd><td>Rail <code>bg.brand.solid<\u002Fcode> (olive-800), idle label olive-200, hover <code>rgba(lime-400,.10)<\u002Fcode>, active <code>action.primary.bg<\u002Fcode> + white, node <code>bg.accent<\u002Fcode>. Light nav: idle n-600, active <code>text.brand<\u002Fcode>, surface <code>bg.brand.subtle<\u002Fcode>. Lime is used <em>only<\u002Fem> as the node — never as a label colour (1.37:1).<\u002Ftd><\u002Ftr>\n    <tr><td>Variants<\u002Ftd><td>sidebar (expanded / collapsed / with sections) · bottom nav · app bar (default / scrolled / with back) · tabs (scrollable / fixed) · breadcrumbs (full / truncated middle).<\u002Ftd><\u002Ftr>\n    <tr><td>States<\u002Ftd><td>idle · hover · focus-visible · active/current · with-count badge · disabled (n-500, tooltip explains why) · collapsed (icon only + tooltip, label in <code>aria-label<\u002Fcode>).<\u002Ftd><\u002Ftr>\n    <tr><td>Interaction<\u002Ftd><td>One tap changes view; no nested drawers on mobile. The node and the surface animate together. Bottom-nav taps on the current item scroll that view to top instead of reloading. Collapsed rail expands on hover after 240ms, never on click-through.<\u002Ftd><\u002Ftr>\n    <tr><td>Animation<\u002Ftd><td>Surface + node 220ms <code>motion.sweep.ease<\u002Fcode>; the node's path is a shallow arc (12px control-point offset), not a straight line. Icon outline → fill 180ms cross-fade. Tab indicator 220ms translate + width. Reduced motion: the node and indicator jump with a 120ms opacity fade and no translate.<\u002Ftd><\u002Ftr>\n    <tr><td>Accessibility<\u002Ftd><td><code>&lt;nav&gt;<\u002Fcode> with an Arabic <code>aria-label<\u002Fcode> per region; <code>aria-current=\"page\"<\u002Fcode> on the active item; tabs use the tab/tablist pattern with arrow-key support. Active state never conveyed by colour alone — weight, surface, and node together. Targets 48px with 8px separation. Collapsed items keep visible labels via tooltip on focus, not hover only.<\u002Ftd><\u002Ftr>\n    <tr><td>RTL<\u002Ftd><td>The whole shell mirrors: rail on the right, tab order right → left, breadcrumb arcs flip, back arrow points right. The node travels the mirrored arc. Time-based tabs keep chronological order per §08.<\u002Ftd><\u002Ftr>\n    <tr><td>Figma / dev<\u002Ftd><td>Figma: item component with <code>state<\u002Fcode> and <code>collapsed<\u002Fcode> props; the node is a separate top-level layer so a Smart Animate prototype interpolates its arc. Dev: one absolutely-positioned node element per nav group, moved by transform — do not animate <code>inset<\u002Fcode>.<\u002Ftd><\u002Ftr>\n  <\u002Ftbody><\u002Ftable>\n\n  <hr style=\"margin:48px 0\">\n\n  <h3>9.6 · Progress &amp; habit components<\u002Fh3>\n  <p class=\"small\">This is where the Q is used literally: an arc that is open at the tail, with milestone nodes on it and one leaf marking the current position. It is a <strong>position<\u002Fstrong> indicator, not a score — the label always reads as a fraction of a week or a named state, never as a percentage.<\u002Fp>\n\n  <div class=\"q-demo\">\n    <div class=\"lbl\">Q-ARC — قوس القوام · 132px / 96px / completion state<\u002Fdiv>\n    <div class=\"q-row q-rtl\" style=\"gap:28px;align-items:flex-start\">\n      <div style=\"text-align:center\">\n        <span aria-hidden=\"true\"><svg viewBox=\"0 0 100 100\" width=\"132\" height=\"132\" role=\"img\" aria-label=\"٥ من ٧\"><circle cx=\"50\" cy=\"50\" r=\"42\" fill=\"none\" stroke=\"#EFEDE4\" stroke-width=\"8\" stroke-linecap=\"round\" stroke-dasharray=\"219.9 43.99999999999997\" transform=\"rotate(75 50 50)\"><\u002Fcircle><circle cx=\"50\" cy=\"50\" r=\"42\" fill=\"none\" stroke=\"#4D7428\" stroke-width=\"8\" stroke-linecap=\"round\" stroke-dasharray=\"149.5 263.9\" transform=\"rotate(75 50 50)\"><\u002Fcircle><path d=\"M68 68 L92 92\" stroke=\"#4D7428\" stroke-width=\"8\" stroke-linecap=\"round\" fill=\"none\" opacity=\"1\"><\u002Fpath><circle cx=\"13.6\" cy=\"71.0\" r=\"3.4\" fill=\"#3D5C21\" stroke=\"#3D5C21\" stroke-width=\"1.6\"><\u002Fcircle><circle cx=\"20.3\" cy=\"20.3\" r=\"3.4\" fill=\"#3D5C21\" stroke=\"#3D5C21\" stroke-width=\"1.6\"><\u002Fcircle><circle cx=\"71.0\" cy=\"13.6\" r=\"3.4\" fill=\"#FCFBF7\" stroke=\"#CDC9B9\" stroke-width=\"1.6\"><\u002Fcircle><circle cx=\"56.6\" cy=\"8.5\" r=\"6\" fill=\"#4D7428\"><\u002Fcircle><\u002Fsvg><\u002Fspan>\n        <div class=\"q-num\" style=\"font-size:20px;margin-top:2px\">٥ من ٧<\u002Fdiv>\n        <div class=\"qc-s\">أيام الالتزام<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"text-align:center\">\n        <span aria-hidden=\"true\"><svg viewBox=\"0 0 100 100\" width=\"96\" height=\"96\" role=\"img\" aria-label=\"اثنان من سبعة\"><circle cx=\"50\" cy=\"50\" r=\"42\" fill=\"none\" stroke=\"#EFEDE4\" stroke-width=\"8\" stroke-linecap=\"round\" stroke-dasharray=\"219.9 43.99999999999997\" transform=\"rotate(75 50 50)\"><\u002Fcircle><circle cx=\"50\" cy=\"50\" r=\"42\" fill=\"none\" stroke=\"#4D7428\" stroke-width=\"8\" stroke-linecap=\"round\" stroke-dasharray=\"72.6 263.9\" transform=\"rotate(75 50 50)\"><\u002Fcircle><path d=\"M68 68 L92 92\" stroke=\"#4D7428\" stroke-width=\"8\" stroke-linecap=\"round\" fill=\"none\" opacity=\"1\"><\u002Fpath><circle cx=\"13.6\" cy=\"71.0\" r=\"3.4\" fill=\"#3D5C21\" stroke=\"#3D5C21\" stroke-width=\"1.6\"><\u002Fcircle><circle cx=\"20.3\" cy=\"20.3\" r=\"3.4\" fill=\"#FCFBF7\" stroke=\"#CDC9B9\" stroke-width=\"1.6\"><\u002Fcircle><circle cx=\"71.0\" cy=\"13.6\" r=\"3.4\" fill=\"#FCFBF7\" stroke=\"#CDC9B9\" stroke-width=\"1.6\"><\u002Fcircle><circle cx=\"8.2\" cy=\"54.4\" r=\"6\" fill=\"#4D7428\"><\u002Fcircle><\u002Fsvg><\u002Fspan>\n        <div class=\"q-num\" style=\"font-size:17px\">٢ من ٧<\u002Fdiv>\n        <div class=\"qc-s\">بداية الأسبوع<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"text-align:center\">\n        <span aria-hidden=\"true\"><svg viewBox=\"0 0 100 100\" width=\"96\" height=\"96\" role=\"img\" aria-label=\"اكتمل الأسبوع\"><circle cx=\"50\" cy=\"50\" r=\"42\" fill=\"none\" stroke=\"#EFEDE4\" stroke-width=\"8\" stroke-linecap=\"round\" stroke-dasharray=\"219.9 43.99999999999997\" transform=\"rotate(75 50 50)\"><\u002Fcircle><circle cx=\"50\" cy=\"50\" r=\"42\" fill=\"none\" stroke=\"#4D7428\" stroke-width=\"8\" stroke-linecap=\"round\" stroke-dasharray=\"219.9 263.9\" transform=\"rotate(75 50 50)\"><\u002Fcircle><path d=\"M68 68 L92 92\" stroke=\"#4D7428\" stroke-width=\"8\" stroke-linecap=\"round\" fill=\"none\" opacity=\"1\"><\u002Fpath><circle cx=\"13.6\" cy=\"71.0\" r=\"3.4\" fill=\"#3D5C21\" stroke=\"#3D5C21\" stroke-width=\"1.6\"><\u002Fcircle><circle cx=\"20.3\" cy=\"20.3\" r=\"3.4\" fill=\"#3D5C21\" stroke=\"#3D5C21\" stroke-width=\"1.6\"><\u002Fcircle><circle cx=\"71.0\" cy=\"13.6\" r=\"3.4\" fill=\"#3D5C21\" stroke=\"#3D5C21\" stroke-width=\"1.6\"><\u002Fcircle><circle cx=\"90.6\" cy=\"60.9\" r=\"6\" fill=\"#4D7428\"><\u002Fcircle><\u002Fsvg><\u002Fspan>\n        <div class=\"q-row\" style=\"justify-content:center;margin-top:4px\"><span class=\"chip c-ok\"><span class=\"g\">✓<\u002Fspan> أسبوع مكتمل<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"max-width:280px\" class=\"q-rtl\">\n        <div class=\"qc-t\" style=\"font-size:15px\">لماذا قوس وليس دائرة؟<\u002Fdiv>\n        <div class=\"qc-s\" style=\"margin-top:4px\">القوس يبقى مفتوحًا دائمًا بمقدار ٦٠ درجة. لا يوجد ١٠٠٪ ولا هدف يُفقد — القيمة تُقرأ دائمًا ككسر من الأسبوع، والاكتمال يعني «داخل النطاق المريح».<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"q-cap\">stroke 8/100 · 60° gap at 96° · milestone nodes at 25 / 50 / 75% of the arc · leaf marks the current position · tail stroke completes the Q<\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"q-demo q-rtl\">\n    <div class=\"lbl\">STREAK — التزامك هذا الأسبوع (leaf marks today)<\u002Fdiv>\n    <div style=\"max-width:460px\">\n      <div class=\"q-row\" style=\"justify-content:space-between;margin-bottom:10px\"><span class=\"qc-t\" style=\"font-size:15px\">التزامك هذا الأسبوع<\u002Fspan><span class=\"qc-s\">٥ من ٧ · يوم راحة محفوظ<\u002Fspan><\u002Fdiv>\n      <div class=\"q-week\">\n        <div class=\"done\"><div class=\"d\">✓<\u002Fdiv><div class=\"lb\">السبت<\u002Fdiv><\u002Fdiv>\n        <div class=\"done\"><div class=\"d\">✓<\u002Fdiv><div class=\"lb\">الأحد<\u002Fdiv><\u002Fdiv>\n        <div class=\"rest\"><div class=\"d\">☾<\u002Fdiv><div class=\"lb\">الاثنين<\u002Fdiv><\u002Fdiv>\n        <div class=\"done\"><div class=\"d\">✓<\u002Fdiv><div class=\"lb\">الثلاثاء<\u002Fdiv><\u002Fdiv>\n        <div class=\"miss\"><div class=\"d\">◌<\u002Fdiv><div class=\"lb\">الأربعاء<\u002Fdiv><\u002Fdiv>\n        <div class=\"done\"><div class=\"d\">✓<\u002Fdiv><div class=\"lb\">الخميس<\u002Fdiv><\u002Fdiv>\n        <div class=\"now\"><div class=\"d\"><span class=\"q-leaf\" aria-hidden=\"true\"><\u002Fspan><\u002Fdiv><div class=\"lb\">الجمعة<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"qc-s\" style=\"margin-top:10px\">لا تنكسر السلسلة بيوم واحد — نحسب أسبوعك كاملًا.<\u002Fdiv>\n      <div class=\"q-mile\" style=\"margin-top:18px\">\n        <span class=\"nd on\"><\u002Fspan><span class=\"seg on\"><\u002Fspan><span class=\"nd on\"><\u002Fspan><span class=\"seg on\"><\u002Fspan><span class=\"nd now\"><\u002Fspan><span class=\"seg\"><\u002Fspan><span class=\"nd\"><\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"q-row\" style=\"justify-content:space-between\"><span class=\"qc-s\">الأسبوع ١<\u002Fspan><span class=\"qc-s\">الأسبوع ٢<\u002Fspan><span class=\"qc-s\">الأسبوع ٣<\u002Fspan><span class=\"qc-s\">الأسبوع ٤<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"q-cap\">today = open box with the leaf · milestones = circular nodes, current node with a 4px olive-100 halo<\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"q-demo q-rtl\">\n    <div class=\"lbl\">WEEKLY ADHERENCE — أربعة أسابيع (curved segments)<\u002Fdiv>\n    <div style=\"max-width:480px\">\n      <div class=\"q-adh\">\n        <div><div class=\"bar hi\" style=\"height:82%\"><\u002Fdiv><div class=\"lb\">٦ من ٧<\u002Fdiv><\u002Fdiv>\n        <div><div class=\"bar\" style=\"height:68%\"><\u002Fdiv><div class=\"lb\">٥ من ٧<\u002Fdiv><\u002Fdiv>\n        <div><div class=\"bar lo\" style=\"height:40%\"><\u002Fdiv><div class=\"lb\">٣ من ٧<\u002Fdiv><\u002Fdiv>\n        <div><div class=\"bar hi\" style=\"height:68%\"><\u002Fdiv><div class=\"lb\">٥ من ٧<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"q-row\" style=\"justify-content:space-between;margin-top:2px\"><span class=\"qc-s\">٢ يوليو<\u002Fspan><span class=\"qc-s\">٢٩ يوليو<\u002Fspan><\u002Fdiv>\n      <div class=\"qc-s\" style=\"margin-top:8px\">التغيّرات الأسبوعية طبيعية — ننظر إلى أربعة أسابيع.<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"q-cap\">bars: start-start 14 / start-end 6 / end-end 14 — the sweep read vertically · value labels always shown, so height is never the only signal<\u002Fdiv>\n  <\u002Fdiv>\n\n  <table>\n    <tbody><tr><th style=\"width:16%\">Aspect<\u002Fth><th>Specification<\u002Fth><\u002Ftr>\n    <tr><td>Concept<\u002Ftd><td>The Q arc as a position on a week. Permanently open, so there is no \"closed loop\" to fail to close; the leaf marks where you are; nodes mark the week's shape.<\u002Ftd><\u002Ftr>\n    <tr><td>Anatomy<\u002Ftd><td>Track arc (n-100) · value arc (olive-600) · tail stroke · 3 milestone nodes · leaf marker · centred or adjacent label block [fraction · unit · state chip].<\u002Ftd><\u002Ftr>\n    <tr><td>Dimensions<\u002Ftd><td>132 (feature), 96 (card), 64 (list row), 40 (table cell — nodes and leaf dropped, tail kept). Stroke 8/100 of the viewBox, so it scales proportionally. Nodes r 3.4. Leaf 11px at 132, 8px at 96 and below.<\u002Ftd><\u002Ftr>\n    <tr><td>Spacing<\u002Ftd><td>Arc → label 8. Label block internal 2. Arc → adjacent text 14. Week cells 6 apart, 40 tall. Milestone rail 18 below the week row.<\u002Ftd><\u002Ftr>\n    <tr><td>Shape<\u002Ftd><td>Arc gap 60° from 96°; round caps. Tail is a separate 24-unit stroke from (68,68) to (92,92), always drawn, even at 0 progress — the identity is present before any data is.<\u002Ftd><\u002Ftr>\n    <tr><td>Typography<\u002Ftd><td>Value Readex 600 tabular (26 at 132, 20 at 96, 17 at 64) · unit and caption <code>type.caption<\u002Fcode> n-600 · day letters 10 · week labels 13.<\u002Ftd><\u002Ftr>\n    <tr><td>Colour tokens<\u002Ftd><td>Track <code>bg.sunken<\u002Fcode>/n-100 · value <code>action.primary.bg<\u002Fcode> · complete <code>status.onTrack.fg<\u002Fcode> + chip · rest day olive-50/olive-300 · missed n-50 with a dashed n-500 border · nodes olive-700 when passed, n-300 outline when not. No red anywhere in this family (§12).<\u002Ftd><\u002Ftr>\n    <tr><td>Variants<\u002Ftd><td>Q-arc (feature / card / row / cell) · streak week · banked rest day · milestone rail · 4-week adherence · completion state · plan-preparation arc (linear, in cards).<\u002Ftd><\u002Ftr>\n    <tr><td>States<\u002Ftd><td>empty (tail only + \"لم يبدأ الأسبوع\") · in progress · today · rest · missed · complete · paused (n-400 arc, <span class=\"rtl\">متوقفة مؤقتًا<\u002Fspan>) · unavailable (dashed track).<\u002Ftd><\u002Ftr>\n    <tr><td>Interaction<\u002Ftd><td>Tap the arc to reveal the numeric detail sheet (numbers are opt-in per §03). Tap a day to log or unlog it, with undo for 5s. Milestone nodes are focusable and each announces its week.<\u002Ftd><\u002Ftr>\n    <tr><td>Animation<\u002Ftd><td>Value arc draws 720ms <code>motion.arc.ease<\u002Fcode> on first render only, not on re-render. The leaf travels with the arc head, never independently. Completion: the leaf runs the remaining arc, meets the tail, and a ✓ chip fades in — total 900ms, once, no loop, no confetti, no bounce. Reduced motion: arc renders at its final value; the chip fades in over 140ms.<\u002Ftd><\u002Ftr>\n    <tr><td>Accessibility<\u002Ftd><td><code>role=\"img\"<\u002Fcode> with a full Arabic sentence label (<span class=\"rtl\">خمسة أيام من سبعة، ويوم راحة محفوظ<\u002Fspan>). The fraction is always rendered as text next to the arc, so the graphic is never the only source. Greyscale-safe: value arc vs track is 3.4:1 in luminance alone. Completion adds an icon and a label, never colour alone.<\u002Ftd><\u002Ftr>\n    <tr><td>RTL<\u002Ftd><td>The arc's geometry does <strong>not<\u002Fstrong> mirror — it is the logo, and mirroring it would produce a backwards mark. Direction of travel stays clockwise in both locales. Everything around it mirrors: label block, week order (right → left), and the milestone rail.<\u002Ftd><\u002Ftr>\n    <tr><td>Figma / dev<\u002Ftd><td>Figma: arc as an ellipse with arc-sweep 300° and a variable <code>progress<\u002Fcode> 0–1 bound to the value layer's sweep; leaf as a component pinned to a rotation frame. Dev: two <code>&lt;circle&gt;<\u002Fcode> elements with <code>stroke-dasharray<\u002Fcode> plus a <code>&lt;path&gt;<\u002Fcode> tail; the leaf is positioned by one <code>rotate()<\u002Fcode> on a wrapper. No canvas, no chart library.<\u002Ftd><\u002Ftr>\n  <\u002Ftbody><\u002Ftable>\n\n  <hr style=\"margin:48px 0\">\n\n  <h3>9.7 · Loading &amp; motion system<\u002Fh3>\n  <p class=\"small\">One motion primitive for the whole product: the leaf travels the open arc once, and the arc draws behind it, revealing the Q. Nothing else spins. No second leaf is ever introduced, at any size, in any state.<\u002Fp>\n\n  <div class=\"q-demo\">\n    <div class=\"q-grid q-rtl\">\n      <div style=\"text-align:center\">\n        <span class=\"orbit orbit-48\" aria-hidden=\"true\" style=\"display:inline-block;width:56px;height:56px\">\n          <svg viewBox=\"0 0 100 100\" width=\"56\" height=\"56\"><circle cx=\"50\" cy=\"50\" r=\"42\" fill=\"none\" stroke=\"#EFEDE4\" stroke-width=\"8\" stroke-linecap=\"round\" stroke-dasharray=\"219.9 44\" transform=\"rotate(75 50 50)\"><\u002Fcircle><circle class=\"val\" cx=\"50\" cy=\"50\" r=\"42\" fill=\"none\" stroke=\"#4D7428\" stroke-width=\"8\" stroke-linecap=\"round\" stroke-dasharray=\"219.9 263.9\" transform=\"rotate(75 50 50)\"><\u002Fcircle><path d=\"M68 68 L92 92\" stroke=\"#4D7428\" stroke-width=\"8\" stroke-linecap=\"round\"><\u002Fpath><\u002Fsvg>\n          <span class=\"spin\" style=\"animation-duration:2400ms\"><i><\u002Fi><\u002Fspan>\n        <\u002Fspan>\n        <div class=\"qc-s\" style=\"margin-top:8px\">جارٍ التحميل…<\u002Fdiv>\n        <div class=\"q-cap\" style=\"direction:rtl;text-align:center\">page loader · 2400ms<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"text-align:center\">\n        <button class=\"qb qb-primary\" aria-busy=\"true\"><span class=\"orbit orbit-16\" aria-hidden=\"true\"><svg viewBox=\"0 0 100 100\" width=\"18\" height=\"18\"><circle cx=\"50\" cy=\"50\" r=\"42\" fill=\"none\" stroke=\"rgba(255,255,255,.28)\" stroke-width=\"12\" stroke-linecap=\"round\" stroke-dasharray=\"219.9 44\" transform=\"rotate(75 50 50)\"><\u002Fcircle><\u002Fsvg><span class=\"spin orbit-btn\"><i><\u002Fi><\u002Fspan><\u002Fspan> جارٍ الإرسال…<\u002Fbutton>\n        <div class=\"q-cap\" style=\"direction:rtl;text-align:center\">button loader · 1600ms<\u002Fdiv>\n      <\u002Fdiv>\n      <div>\n        <div class=\"qc\" style=\"box-shadow:none\">\n          <div class=\"q-row\" style=\"gap:10px;align-items:center\"><span class=\"q-sk\" style=\"width:36px;height:36px;border-radius:50%\"><\u002Fspan><span class=\"q-sk\" style=\"height:14px;flex:1\"><\u002Fspan><\u002Fdiv>\n          <div class=\"q-sk\" style=\"height:12px;margin-top:12px;width:90%\"><\u002Fdiv>\n          <div class=\"q-sk\" style=\"height:12px;margin-top:8px;width:64%\"><\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"q-cap\">skeleton · 1600ms olive-tinted sweep<\u002Fdiv>\n      <\u002Fdiv>\n      <div>\n        <div class=\"q-pull\">\n          <span class=\"orbit\" aria-hidden=\"true\" style=\"width:28px;height:28px\"><svg viewBox=\"0 0 100 100\" width=\"28\" height=\"28\"><circle cx=\"50\" cy=\"50\" r=\"42\" fill=\"none\" stroke=\"#D2E2B9\" stroke-width=\"11\" stroke-linecap=\"round\" stroke-dasharray=\"219.9 44\" transform=\"rotate(75 50 50)\"><\u002Fcircle><\u002Fsvg><span class=\"spin\" style=\"animation-duration:2000ms\"><i style=\"width:8px;height:8px;top:-4px;margin-inline-start:-4px\"><\u002Fi><\u002Fspan><\u002Fspan>\n          <span style=\"font-size:13.5px;color:var(--olive-800)\">جارٍ التحديث…<\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"q-cap\">pull-to-refresh · leaf follows the pull, then laps once<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"text-align:center\">\n        <span aria-hidden=\"true\"><svg viewBox=\"0 0 100 100\" width=\"64\" height=\"64\" role=\"img\" aria-label=\"تم\"><circle cx=\"50\" cy=\"50\" r=\"42\" fill=\"none\" stroke=\"#EFEDE4\" stroke-width=\"8\" stroke-linecap=\"round\" stroke-dasharray=\"219.9 43.99999999999997\" transform=\"rotate(75 50 50)\"><\u002Fcircle><circle cx=\"50\" cy=\"50\" r=\"42\" fill=\"none\" stroke=\"#4D7428\" stroke-width=\"8\" stroke-linecap=\"round\" stroke-dasharray=\"219.9 263.9\" transform=\"rotate(75 50 50)\"><\u002Fcircle><path d=\"M68 68 L92 92\" stroke=\"#4D7428\" stroke-width=\"8\" stroke-linecap=\"round\" fill=\"none\" opacity=\"1\"><\u002Fpath><circle cx=\"13.6\" cy=\"71.0\" r=\"3.4\" fill=\"#3D5C21\" stroke=\"#3D5C21\" stroke-width=\"1.6\"><\u002Fcircle><circle cx=\"20.3\" cy=\"20.3\" r=\"3.4\" fill=\"#3D5C21\" stroke=\"#3D5C21\" stroke-width=\"1.6\"><\u002Fcircle><circle cx=\"71.0\" cy=\"13.6\" r=\"3.4\" fill=\"#3D5C21\" stroke=\"#3D5C21\" stroke-width=\"1.6\"><\u002Fcircle><circle cx=\"90.6\" cy=\"60.9\" r=\"6\" fill=\"#4D7428\"><\u002Fcircle><\u002Fsvg><\u002Fspan>\n        <div class=\"q-row\" style=\"justify-content:center;margin-top:6px\"><span class=\"chip c-ok\"><span class=\"g\">✓<\u002Fspan> تم تسجيل الوجبة<\u002Fspan><\u002Fdiv>\n        <div class=\"q-cap\" style=\"direction:rtl;text-align:center\">success · 900ms, once<\u002Fdiv>\n      <\u002Fdiv>\n      <div>\n        <div class=\"q-toast\">\n          <span class=\"q-leaf\" aria-hidden=\"true\" style=\"background:var(--lime-400);margin-top:4px\"><\u002Fspan>\n          <div><div style=\"font-weight:600;font-size:14px\">تم إرسال الخطة إلى ليلى<\u002Fdiv><div style=\"font-size:12.5px;color:var(--olive-200)\">يمكنك التعديل حتى موعد الجلسة<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"q-cap\">confirmation toast · slide-in 220ms from the block-end<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <table>\n    <tbody><tr><th style=\"width:20%\">Moment<\u002Fth><th style=\"width:12%\">Duration<\u002Fth><th style=\"width:24%\">Easing<\u002Fth><th style=\"width:14%\">Delay / loop<\u002Fth><th>Reduced-motion alternative<\u002Fth><\u002Ftr>\n    <tr><td>Page loader<\u002Ftd><td>2400ms per lap<\u002Ftd><td><code>cubic-bezier(.45,.05,.55,.95)<\u002Fcode><\u002Ftd><td>Appears after 400ms; loops until resolved, holding 12% at the tail<\u002Ftd><td>Static open arc at 40% + text <span class=\"rtl\">جارٍ التحميل…<\u002Fspan>, opacity pulse 1 → .6 over 1200ms<\u002Ftd><\u002Ftr>\n    <tr><td>Button loader<\u002Ftd><td>1600ms per lap<\u002Ftd><td>same<\u002Ftd><td>Immediate; loops<\u002Ftd><td>Static arc + label change only<\u002Ftd><\u002Ftr>\n    <tr><td>Skeleton<\u002Ftd><td>1600ms sweep<\u002Ftd><td><code>ease-in-out<\u002Fcode><\u002Ftd><td>Appears after 200ms; loops; max 8 seconds then an error state<\u002Ftd><td>Flat n-100 blocks, no sweep<\u002Ftd><\u002Ftr>\n    <tr><td>Pull-to-refresh<\u002Ftd><td>Follows the drag, then one 2000ms lap<\u002Ftd><td>Drag 1:1, release <code>motion.arc.ease<\u002Fcode><\u002Ftd><td>No loop beyond the request<\u002Ftd><td>Text row only: <span class=\"rtl\">جارٍ التحديث…<\u002Fspan><\u002Ftd><\u002Ftr>\n    <tr><td>Success confirmation<\u002Ftd><td>900ms<\u002Ftd><td><code>motion.arc.ease<\u002Fcode> then 220ms ease-out fade<\u002Ftd><td>Once. Never repeats.<\u002Ftd><td>Chip fades in over 140ms; no arc travel<\u002Ftd><\u002Ftr>\n    <tr><td>Progress completion<\u002Ftd><td>720ms draw + 180ms chip<\u002Ftd><td><code>motion.arc.ease<\u002Fcode><\u002Ftd><td>Once per completion, first render only<\u002Ftd><td>Final value rendered immediately<\u002Ftd><\u002Ftr>\n    <tr><td>Onboarding transition<\u002Ftd><td>320ms<\u002Ftd><td><code>motion.sweep.ease<\u002Fcode><\u002Ftd><td>Sequential, 60ms stagger, max 3 elements<\u002Ftd><td>Cross-fade 160ms, no translate<\u002Ftd><\u002Ftr>\n    <tr><td>Empty-state micro-animation<\u002Ftd><td>3600ms<\u002Ftd><td><code>motion.arc.ease<\u002Fcode><\u002Ftd><td>Loops with a 1200ms rest between laps; stops after 3 laps<\u002Ftd><td>Static outline arc<\u002Ftd><\u002Ftr>\n    <tr><td>Toast / sheet entrance<\u002Ftd><td>220ms in · 160ms out<\u002Ftd><td>ease-out / ease-in<\u002Ftd><td>Once<\u002Ftd><td>Opacity only<\u002Ftd><\u002Ftr>\n    <tr><td>Corner, indicator, knob<\u002Ftd><td>180–220ms<\u002Ftd><td><code>motion.sweep.ease<\u002Fcode><\u002Ftd><td>Once per interaction<\u002Ftd><td>Instant with a 120ms fade<\u002Ftd><\u002Ftr>\n  <\u002Ftbody><\u002Ftable>\n  <div class=\"note\"><strong>Motion character — enforceable rules.<\u002Fstrong> No overshoot and no spring: every curve ends flat. Nothing loops faster than 1600ms. Nothing scales more than 1.02 or moves more than 16px. Two animations never run in the same region at once — the loader replaces the skeleton, it does not sit on top of it. If a request resolves in under 400ms, no loader appears at all.<\u002Fdiv>\n\n  <hr style=\"margin:48px 0\">\n\n  <h3>9.8 · Data visualisation<\u002Fh3>\n  <p class=\"small\">Chart styling inherits §07: bands over lines, four series maximum, direct labels. What is added here is the arc language — round caps, gentle curvature, circular milestone markers, and a single leaf reserved for the one point that carries meaning.<\u002Fp>\n\n  <div class=\"q-demo\">\n    <div class=\"q-grid-2 q-rtl\">\n      <div>\n        <div class=\"qc-t\" style=\"font-size:15px\">الطاقة — أربعة أسابيع<\u002Fdiv>\n        <div class=\"qc-s\" style=\"margin-bottom:8px\">النطاق المريح مظلّل · سُجّل بواسطتك<\u002Fdiv>\n        <svg viewBox=\"0 0 320 150\" width=\"100%\" height=\"150\" role=\"img\" aria-label=\"مخطط الطاقة لأربعة أسابيع مع النطاق المريح، بديل جدولي متاح\">\n          <rect x=\"0\" y=\"52\" width=\"320\" height=\"46\" fill=\"#E6F79A\" opacity=\".55\"><\u002Frect>\n          <line x1=\"0\" y1=\"52\" x2=\"320\" y2=\"52\" stroke=\"#8CA60C\" stroke-width=\"2\" stroke-dasharray=\"6 5\"><\u002Fline>\n          <line x1=\"0\" y1=\"98\" x2=\"320\" y2=\"98\" stroke=\"#8CA60C\" stroke-width=\"2\" stroke-dasharray=\"6 5\"><\u002Fline>\n          <path d=\"M12 104 C60 96 74 66 112 70 S180 84 210 62 S268 44 308 56\" fill=\"none\" stroke=\"#4D7428\" stroke-width=\"3.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath>\n          <circle cx=\"112\" cy=\"70\" r=\"4.5\" fill=\"#FCFBF7\" stroke=\"#4D7428\" stroke-width=\"2.5\"><\u002Fcircle>\n          <circle cx=\"210\" cy=\"62\" r=\"4.5\" fill=\"#FCFBF7\" stroke=\"#4D7428\" stroke-width=\"2.5\"><\u002Fcircle>\n          <g transform=\"translate(308 56) rotate(45)\"><rect x=\"-5.5\" y=\"-5.5\" width=\"11\" height=\"11\" rx=\"7.9\" ry=\"0\" fill=\"#4D7428\"><\u002Frect><\u002Fg>\n          <text x=\"300\" y=\"132\" font-size=\"10\" fill=\"#837F6E\" text-anchor=\"end\" font-family=\"IBM Plex Mono\">٢ يوليو<\u002Ftext>\n          <text x=\"20\" y=\"132\" font-size=\"10\" fill=\"#837F6E\" font-family=\"IBM Plex Mono\">٢٩ يوليو<\u002Ftext>\n        <\u002Fsvg>\n        <div class=\"q-cap\">line: 3.5px, round caps, C-curves only · band = comfortable range · leaf marks the latest point only<\u002Fdiv>\n      <\u002Fdiv>\n      <div>\n        <div class=\"qc-t\" style=\"font-size:15px\">توزيع الوجبات هذا الأسبوع<\u002Fdiv>\n        <div class=\"qc-s\" style=\"margin-bottom:8px\">٢١ وجبة مسجّلة<\u002Fdiv>\n        <div class=\"q-row\" style=\"gap:20px;align-items:center\">\n          <svg viewBox=\"0 0 100 100\" width=\"112\" height=\"112\" role=\"img\" aria-label=\"ثلاث عشرة وجبة منزلية، خمس خارج المنزل، ثلاث مرنة\">\n            <circle cx=\"50\" cy=\"50\" r=\"38\" fill=\"none\" stroke=\"#EFEDE4\" stroke-width=\"13\" stroke-linecap=\"round\" stroke-dasharray=\"198.9 39.8\" transform=\"rotate(75 50 50)\"><\u002Fcircle>\n            <circle cx=\"50\" cy=\"50\" r=\"38\" fill=\"none\" stroke=\"#4D7428\" stroke-width=\"13\" stroke-linecap=\"round\" stroke-dasharray=\"123.1 238.7\" transform=\"rotate(75 50 50)\"><\u002Fcircle>\n            <circle cx=\"50\" cy=\"50\" r=\"38\" fill=\"none\" stroke=\"#B2CE8D\" stroke-width=\"13\" stroke-linecap=\"round\" stroke-dasharray=\"47.4 238.7\" transform=\"rotate(273 50 50)\"><\u002Fcircle>\n            <path d=\"M70 70 L91 91\" stroke=\"#4D7428\" stroke-width=\"13\" stroke-linecap=\"round\"><\u002Fpath>\n          <\u002Fsvg>\n          <div style=\"font-size:13px;color:var(--n-700);line-height:2\">\n            <div class=\"q-row\" style=\"gap:8px\"><span class=\"qc-dot\"><\u002Fspan> منزلية — ١٣<\u002Fdiv>\n            <div class=\"q-row\" style=\"gap:8px\"><span class=\"qc-dot\" style=\"background:var(--olive-300)\"><\u002Fspan> خارج المنزل — ٥<\u002Fdiv>\n            <div class=\"q-row\" style=\"gap:8px\"><span class=\"qc-dot\" style=\"background:var(--n-300)\"><\u002Fspan> مرنة — ٣<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"q-cap\">donut keeps the 60° gap and the tail — a Q, not a pie · values labelled directly, no legend-only encoding<\u002Fdiv>\n      <\u002Fdiv>\n      <div>\n        <div class=\"qc-t\" style=\"font-size:15px\">حالات المواعيد — يوليو<\u002Fdiv>\n        <div class=\"qc-s\" style=\"margin-bottom:10px\">١٨ موعدًا<\u002Fdiv>\n        <div style=\"display:flex;height:34px;border-radius:999px;border-end-end-radius:8px;overflow:hidden;direction:rtl\">\n          <div style=\"width:61%;background:var(--olive-600)\"><\u002Fdiv>\n          <div style=\"width:22%;background:var(--olive-300)\"><\u002Fdiv>\n          <div style=\"width:17%;background:var(--n-200);border-inline-start:1px dashed var(--n-500)\"><\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"q-row\" style=\"gap:14px;margin-top:10px;font-size:12.5px;color:var(--n-700)\">\n          <span class=\"q-row\" style=\"gap:6px\"><span class=\"qc-dot\"><\u002Fspan> عُقدت — ١١<\u002Fspan>\n          <span class=\"q-row\" style=\"gap:6px\"><span class=\"qc-dot\" style=\"background:var(--olive-300)\"><\u002Fspan> أُعيدت جدولتها — ٤<\u002Fspan>\n          <span class=\"q-row\" style=\"gap:6px\"><span class=\"qc-dot\" style=\"background:var(--n-300)\"><\u002Fspan> لم تُعقد — ٣<\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"q-cap\">missed = neutral + dashed edge, never clay (§12)<\u002Fdiv>\n      <\u002Fdiv>\n      <div>\n        <div class=\"qc-t\" style=\"font-size:15px\">اتجاه العادات<\u002Fdiv>\n        <div class=\"qc-s\" style=\"margin-bottom:10px\">المشي · الخضار في الوجبة<\u002Fdiv>\n        <div class=\"q-adh\" style=\"height:92px\">\n          <div><div class=\"bar hi\" style=\"height:70%\"><\u002Fdiv><div class=\"lb\">٦<\u002Fdiv><\u002Fdiv>\n          <div><div class=\"bar\" style=\"height:56%\"><\u002Fdiv><div class=\"lb\">٥<\u002Fdiv><\u002Fdiv>\n          <div><div class=\"bar hi\" style=\"height:84%\"><\u002Fdiv><div class=\"lb\">٧<\u002Fdiv><\u002Fdiv>\n          <div><div class=\"bar lo\" style=\"height:34%\"><\u002Fdiv><div class=\"lb\">٣<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"q-cap\">bars carry the sweep vertically · every bar labelled with its value<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <table>\n    <tbody><tr><th style=\"width:16%\">Aspect<\u002Fth><th>Specification<\u002Fth><\u002Ftr>\n    <tr><td>Concept<\u002Ftd><td>Charts are drawn with the same pen as the mark: round caps, C-curves, open rings. Brand appears in the stroke quality, not in ornament.<\u002Ftd><\u002Ftr>\n    <tr><td>Anatomy<\u002Ftd><td>Title · source and date line · plot (band, then series, then markers) · direct end-of-line labels · optional table alternative link.<\u002Ftd><\u002Ftr>\n    <tr><td>Dimensions<\u002Ftd><td>Card chart 150px tall, feature 240px, sparkline 40px. Line 3.5px (2.5 in sparklines). Donut stroke 13/100. Marker r 4.5 outline, leaf 11px. Plot inset 12.<\u002Ftd><\u002Ftr>\n    <tr><td>Spacing<\u002Ftd><td>Title → source 2. Source → plot 8. Plot → axis labels 10. Plot → legend 10. Legend items 14 apart.<\u002Ftd><\u002Ftr>\n    <tr><td>Shape<\u002Ftd><td><code>stroke-linecap:round<\u002Fcode> and <code>stroke-linejoin:round<\u002Fcode> everywhere. Curvature limited to a 0.35 smoothing factor — enough to look drawn, not enough to misstate values. Bars take the vertical sweep. Donuts and rings keep the 60° gap and the tail.<\u002Ftd><\u002Ftr>\n    <tr><td>Typography<\u002Ftd><td>Axis and legend <code>type.caption<\u002Fcode> 10–12.5 tabular · value labels 13/600 · title <code>type.heading.sm<\u002Fcode>. Mono only for date ranges and axis ticks.<\u002Ftd><\u002Ftr>\n    <tr><td>Colour tokens<\u002Ftd><td>Series 1 olive-600 · 2 olive-300 · 3 n-500 · 4 amber-600. Band <code>viz.band.range<\u002Fcode> at 55% with <code>viz.band.edge<\u002Fcode> dashed boundaries. Neutral n-200 for \"not held / not logged\". Lime never carries a line or a label — fill only.<\u002Ftd><\u002Ftr>\n    <tr><td>Variants<\u002Ftd><td>line + band · sparkline · bar · stacked status bar · donut (Q-donut) · progress arc · adherence · nutrition trend · habit trend.<\u002Ftd><\u002Ftr>\n    <tr><td>States<\u002Ftd><td>loaded · loading (skeleton plot, axes visible) · empty (axes + <span class=\"rtl\">لا توجد بيانات لهذه الفترة<\u002Fspan> + action) · partial (dashed segment for missing days) · hidden-metric (per §11 sensitive data, the card is absent, not blanked).<\u002Ftd><\u002Ftr>\n    <tr><td>Interaction<\u002Ftd><td>Hover or focus reveals a tooltip with value, date, and source. Keyboard arrows step through points and announce each. Tapping a series toggles it only when there are 3+ series, and the toggle is a labelled chip, not a colour swatch.<\u002Ftd><\u002Ftr>\n    <tr><td>Animation<\u002Ftd><td>Series draws once over 720ms with a 40ms stagger between series; bands fade in 220ms; markers scale 0.9 → 1 over 180ms. No animation on data refresh — only on first paint. Reduced motion: everything renders final.<\u002Ftd><\u002Ftr>\n    <tr><td>Accessibility<\u002Ftd><td>Every chart has <code>role=\"img\"<\u002Fcode> plus a sentence summary, and a reachable table alternative (§11). Series distinguished by colour <em>and<\u002Fem> dash pattern <em>and<\u002Fem> a direct label. Y-axis never zoomed to exaggerate (§07). Greyscale-tested. Minimum 10px type, and axis labels never carry essential values alone.<\u002Ftd><\u002Ftr>\n    <tr><td>RTL<\u002Ftd><td>The time axis stays left → right in both locales (§08); only labels localise. Legends, titles, and tooltips mirror. Donut and arc geometry do not mirror. Stacked status bars fill from the inline-start edge.<\u002Ftd><\u002Ftr>\n    <tr><td>Figma / dev<\u002Ftd><td>Figma: charts as vector plates with a documented \"do not restyle\" note, plus the band and marker as components. Dev: hand-authored SVG for arcs, donuts, and bands; if a library is used, its defaults must be overridden — round caps, no grid lines, no drop shadows, no gradient fills, no animation on update.<\u002Ftd><\u002Ftr>\n  <\u002Ftbody><\u002Ftable>\n\n  <hr style=\"margin:48px 0\">\n\n  <h3>9.9 · Feedback components<\u002Fh3>\n  <p class=\"small\">Brand appears as a curved accent stroke and a circular status marker — never as a logo dropped into a message. Success is the only place the leaf is allowed to move.<\u002Fp>\n\n  <div class=\"q-demo\">\n    <div class=\"q-grid-2 q-rtl\">\n      <div>\n        <div class=\"q-toast\">\n          <span class=\"q-leaf\" aria-hidden=\"true\" style=\"background:var(--lime-400);margin-top:4px\"><\u002Fspan>\n          <div><div style=\"font-weight:600;font-size:14px\">تم حفظ خطة ليلى<\u002Fdiv><div style=\"font-size:12.5px;color:var(--olive-200)\">آخر تعديل الآن<\u002Fdiv><\u002Fdiv>\n          <span style=\"margin

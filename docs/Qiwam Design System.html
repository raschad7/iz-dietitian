-inline-start:auto;color:var(--olive-200);font-size:13px\">إغلاق<\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"q-cap\">toast · olive-800, 4px lime accent stroke, aria-live polite, 6s minimum<\u002Fdiv>\n\n        <div class=\"q-alert\" style=\"margin-top:16px\">\n          <span class=\"q-head\" aria-hidden=\"true\" style=\"width:28px;height:28px;background:transparent;color:var(--amber-700);font-size:13px\">!<\u002Fspan>\n          <div><strong style=\"display:block;font-size:14px\">الخطة غير مكتملة<\u002Fstrong><span>بقيت أيام ٥–٧. لن تظهر للعميلة حتى تكتمل.<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"q-alert med\" style=\"margin-top:12px\">\n          <span class=\"q-head\" aria-hidden=\"true\" style=\"width:28px;height:28px;background:transparent;color:var(--clay-700);font-size:13px\">⬡<\u002Fspan>\n          <div><strong style=\"display:block;font-size:14px\">تنبيه طبي<\u002Fstrong><span>حساسية الجلوتين — راجع قائمة الحبوب في اليوم الثالث.<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"q-cap\">alert · glyph + title + sentence; the marker is an open ring, the surface is tinted, no icon-only alerts<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div>\n        <div class=\"q-modal\">\n          <div class=\"qc-t\">حذف قالب «خطة متوازنة — ٣ وجبات»؟<\u002Fdiv>\n          <div class=\"qc-s\" style=\"margin-top:6px\">القالب مستخدم مع ١٢ عميلًا. الخطط المرتبطة لن تُحذف، لكنها ستفقد الرابط بالقالب.<\u002Fdiv>\n          <div class=\"q-row\" style=\"margin-top:16px;gap:10px\"><button class=\"qb qb-danger\" style=\"min-height:44px\">حذف القالب<\u002Fbutton><button class=\"qb qb-tertiary\" style=\"min-height:44px\">إلغاء<\u002Fbutton><\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"q-cap\">modal · 420–560px, sweep 32, focus trapped, Esc closes, names the object<\u002Fdiv>\n\n        <div class=\"q-row\" style=\"gap:16px;align-items:flex-end;margin-top:16px\">\n          <div class=\"q-sheet\">\n            <div class=\"grab\" aria-hidden=\"true\"><\u002Fdiv>\n            <div class=\"qc-t\" style=\"font-size:16px\">تسجيل وجبة<\u002Fdiv>\n            <div class=\"q-row\" style=\"gap:8px;margin:12px 0\"><span class=\"chip c-rest\">إفطار<\u002Fspan><span class=\"chip c-rest\">غداء<\u002Fspan><span class=\"chip c-rest\">عشاء<\u002Fspan><span class=\"chip c-rest\">وجبة خفيفة<\u002Fspan><\u002Fdiv>\n            <button class=\"qb qb-primary\" style=\"width:100%\">متابعة<\u002Fbutton>\n          <\u002Fdiv>\n          <div>\n            <div class=\"q-tip\">النطاق المريح يتغيّر حسب نشاطك ونومك<\u002Fdiv>\n            <div class=\"q-cap\">tooltip · 45° tail with one rounded corner, echoing the sweep<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <table>\n    <tbody><tr><th style=\"width:16%\">Aspect<\u002Fth><th>Specification<\u002Fth><\u002Ftr>\n    <tr><td>Concept<\u002Ftd><td>A curved accent stroke on the inline-start edge and an open-ring status marker. The stroke is the only place a rounded-end bar appears, so feedback is instantly recognisable as system voice rather than content.<\u002Ftd><\u002Ftr>\n    <tr><td>Anatomy<\u002Ftd><td>Marker (open ring or 11px leaf for success) · title · one sentence · optional action · optional dismiss. Modals add a header, body, and a right-aligned action row with the safe action at the inline-end.<\u002Ftd><\u002Ftr>\n    <tr><td>Dimensions<\u002Ftd><td>Toast max 420 wide, min 56 tall, accent stroke 4. Alert padding 14/16. Modal 420 (confirm) – 560 (form). Bottom sheet full-width, top corners 24, grab handle 44×4. Tooltip max 240, padding 8/12.<\u002Ftd><\u002Ftr>\n    <tr><td>Spacing<\u002Ftd><td>Marker → text 12. Title → body 4. Body → actions 16. Actions 10 apart. Toast stack gap 10, maximum two visible.<\u002Ftd><\u002Ftr>\n    <tr><td>Shape<\u002Ftd><td>Toast, alert, tooltip <code>radius 10–12 / sweep 24<\u002Fcode>. Modal and sheet <code>radius 16 / sweep 32<\u002Fcode> (sheet: top corners 24, sweep on the block-end only when floating). Tooltip tail is a rotated square with one 10px corner.<\u002Ftd><\u002Ftr>\n    <tr><td>Typography<\u002Ftd><td>Title 14/600 · body 12.5–14/400 · action 14/600. Toast body olive-200 on olive-800 (7.6:1). Never below 12.5 in feedback.<\u002Ftd><\u002Ftr>\n    <tr><td>Colour tokens<\u002Ftd><td>Toast <code>bg.brand.solid<\u002Fcode> + <code>text.inverse<\u002Fcode> + <code>bg.accent<\u002Fcode> stroke. Attention amber-100/amber-300/amber-700. Medical clay-100/clay-300/clay-700. Neutral info n-50/n-200/n-700 — there is no blue info state (§05). Success uses olive-600 + leaf, never a green flood fill.<\u002Ftd><\u002Ftr>\n    <tr><td>Variants<\u002Ftd><td>toast (info / success / undo) · alert (attention / medical / neutral) · inline validation · modal (confirm / destructive / form) · bottom sheet (picker / form / info) · tooltip · empty state · confirmation state.<\u002Ftd><\u002Ftr>\n    <tr><td>States<\u002Ftd><td>entering · resting · with-action · dismissing · persistent (medical alerts cannot be auto-dismissed) · stacked · offline banner.<\u002Ftd><\u002Ftr>\n    <tr><td>Interaction<\u002Ftd><td>Toasts last 6s minimum, pause on hover or focus, and never carry information available nowhere else. Destructive confirms name the object and put the safe action last in the inline direction. Sheets are dismissible by drag, backdrop tap, and Esc. Tooltips open on hover after 300ms and on focus immediately.<\u002Ftd><\u002Ftr>\n    <tr><td>Animation<\u002Ftd><td>Toast slides 12px from the block-end + fades, 220ms ease-out; exits 160ms ease-in. Modal 220ms fade + 1.01 → 1 scale; backdrop 160ms. Sheet 260ms <code>motion.sweep.ease<\u002Fcode> translate. Success: the leaf runs its final arc segment once (520ms) then settles as a static ✓. No shake, no pulse, no bounce.<\u002Ftd><\u002Ftr>\n    <tr><td>Accessibility<\u002Ftd><td>Toast <code>aria-live=\"polite\"<\u002Fcode>; medical alert <code>role=\"alert\"<\u002Fcode>. Modal <code>role=\"dialog\" aria-modal<\u002Fcode>, focus trapped, focus returns to the trigger. Every state carries glyph + label + colour. Dismiss controls are 48px and labelled in Arabic. Tooltips are supplementary only — never the sole carrier of a value or instruction.<\u002Ftd><\u002Ftr>\n    <tr><td>RTL<\u002Ftd><td>Accent stroke moves to the inline-start edge automatically (logical inset). Toasts anchor to the inline-start bottom corner. Tooltip tail flips. Action order mirrors: primary at the inline-start, dismiss at the inline-end.<\u002Ftd><\u002Ftr>\n    <tr><td>Figma / dev<\u002Ftd><td>Figma: one feedback base with <code>tone<\u002Fcode> and <code>hasAction<\u002Fcode> props; the accent stroke is a 4px rectangle pinned to the inline-start edge. Dev: a single live region per app for toasts; the accent stroke is a <code>::before<\u002Fcode>, so it costs no markup.<\u002Ftd><\u002Ftr>\n  <\u002Ftbody><\u002Ftable>\n\n  <hr style=\"margin:48px 0\">\n\n  <h3>9.10 · Component personality rules<\u002Fh3>\n  <div class=\"dd\">\n    <div class=\"do\">\n      <h4>Do<\u002Fh4>\n      <ul>\n        <li>Give every component <strong>one<\u002Fstrong> swept corner at the block-end / inline-end, using logical radius properties<\u002Fli>\n        <li>Draw every circular element as an open ring with the 60° gap — that gap is the brand<\u002Fli>\n        <li>Let exactly one leaf move, once, and only for loading, completion, or \"today\"<\u002Fli>\n        <li>Animate the corner, the indicator, and the arc — never the whole component<\u002Fli>\n        <li>Keep every label, value, and glyph present; shape and colour are always the second signal<\u002Fli>\n        <li>Use olive-tinted surfaces (olive-50) for grouping, and keep white for content<\u002Fli>\n        <li>End every easing curve flat: calm, purposeful, finished<\u002Fli>\n      <\u002Ful>\n    <\u002Fdiv>\n    <div class=\"dont\">\n      <h4>Don't<\u002Fh4>\n      <ul>\n        <li>Put the sweep on two corners, or repeat it on a child of a swept parent<\u002Fli>\n        <li>Close the arc into a full circle, or show a percentage inside it<\u002Fli>\n        <li>Add a second leaf, a static leaf ornament, or a leaf bullet (§07)<\u002Fli>\n        <li>Make everything a pill — that shape is reserved for chips and the balance band<\u002Fli>\n        <li>Exceed 24px of curvature on a control or 32px on a surface<\u002Fli>\n        <li>Spin anything continuously or faster than 1600ms per lap<\u002Fli>\n        <li>Use lime for text, icons, strokes, or labels on a light surface (1.37:1)<\u002Fli>\n        <li>Introduce a gradient, a glass blur, or a coloured shadow to \"brand\" a component<\u002Fli>\n        <li>Ship a mirrored Q — the mark's geometry never flips in RTL<\u002Fli>\n      <\u002Ful>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <h4>Implementation summary<\u002Fh4>\n  <table>\n    <tbody><tr><th style=\"width:22%\">Layer<\u002Fth><th>What it takes to build this whole language<\u002Fth><\u002Ftr>\n    <tr><td>CSS<\u002Ftd><td>Two declarations for the sweep (<code>border-radius<\u002Fcode> + <code>border-end-end-radius<\u002Fcode>), one <code>conic-gradient<\u002Fcode> + <code>mask<\u002Fcode> pair for the open ring, one <code>::after<\u002Fcode> for the field arc, one keyframe for the traveling leaf. No SVG for controls; SVG only for arcs, donuts, and charts.<\u002Ftd><\u002Ftr>\n    <tr><td>Figma<\u002Ftd><td>Two shape styles (<code>sweep/control<\u002Fcode> 24, <code>sweep/surface<\u002Fcode> 32) applied as an individual corner radius, one <code>Q-Arc<\u002Fcode> component with a <code>progress<\u002Fcode> variable, one <code>Leaf<\u002Fcode> component, one <code>OpenRing<\u002Fcode> component. Everything else is existing tokens.<\u002Ftd><\u002Ftr>\n    <tr><td>Review test<\u002Ftd><td>Screenshot any screen in greyscale, at 200% text, and mirrored. If a component is still recognisably Qiwam in all three, the language is intact. If the tail or the gap has disappeared, it was built with a mask or a hard-coded <code>border-bottom-right-radius<\u002Fcode>.<\u002Ftd><\u002Ftr>\n  <\u002Ftbody><\u002Ftable>\n<\u002Fsection>\n\n<hr>\n\n<!-- 10 -->\n<section id=\"nutrition\">\n  <div class=\"sec-num\">10<\u002Fdiv>\n  <h2>Nutrition-specific UX patterns<\u002Fh2>\n  <p class=\"lede\">These are the patterns where a nutrition product usually turns into a scoreboard. Each one below is specified to resist that.<\u002Fp>\n\n  <h3>1 · Streaks &amp; habit tracking — forgiving by design<\u002Fh3>\n  <div class=\"spec\">\n    <div class=\"rtl\" style=\"max-width:460px\">\n      <div class=\"card-title\">التزامك هذا الأسبوع<\u002Fdiv>\n      <div class=\"card-sub\" style=\"margin-bottom:12px\">٥ من ٧ أيام · يوم راحة واحد محفوظ<\u002Fdiv>\n      <div class=\"week\">\n        <div class=\"day done\"><div class=\"dot\">✓<\u002Fdiv><div class=\"lb\">السبت<\u002Fdiv><\u002Fdiv>\n        <div class=\"day done\"><div class=\"dot\">✓<\u002Fdiv><div class=\"lb\">الأحد<\u002Fdiv><\u002Fdiv>\n        <div class=\"day rest\"><div class=\"dot\">☾<\u002Fdiv><div class=\"lb\">الاثنين<\u002Fdiv><\u002Fdiv>\n        <div class=\"day done\"><div class=\"dot\">✓<\u002Fdiv><div class=\"lb\">الثلاثاء<\u002Fdiv><\u002Fdiv>\n        <div class=\"day miss\"><div class=\"dot\">◌<\u002Fdiv><div class=\"lb\">الأربعاء<\u002Fdiv><\u002Fdiv>\n        <div class=\"day done\"><div class=\"dot\">✓<\u002Fdiv><div class=\"lb\">الخميس<\u002Fdiv><\u002Fdiv>\n        <div class=\"day done\"><div class=\"dot\">✓<\u002Fdiv><div class=\"lb\">الجمعة<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"small\" style=\"margin-top:12px\">لا تنكسر السلسلة بيوم واحد. نحسب أسبوعك كاملًا.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <ul class=\"tight\">\n    <li><strong>The unit of measurement is the week, not the day.<\u002Fstrong> The counter reads \"٥ من ٧ أيام\" — there is no consecutive-day number to lose.<\u002Fli>\n    <li>Each client gets <strong>one banked rest day per week<\u002Fstrong> (<span class=\"rtl\">يوم راحة محفوظ<\u002Fspan>) that counts as adherence.<\u002Fli>\n    <li>A missed day renders as a dashed neutral circle — same visual weight as an empty slot, not an error.<\u002Fli>\n    <li>Habits are behavioural, not numeric: <span class=\"rtl\">شرب الماء · المشي · الخضار في الوجبة · النوم المبكر · الأكل بانتباه<\u002Fspan>. Calorie logging is one optional habit among these, not the spine of the app.<\u002Fli>\n    <li>Breaking a long streak triggers no notification. Restarting one does.<\u002Fli>\n  <\u002Ful>\n\n  <h3>2 · Progress reports<\u002Fh3>\n  <table>\n    <tbody><tr><th style=\"width:26%\">Rule<\u002Fth><th>Detail<\u002Fth><\u002Ftr>\n    <tr><td>Multi-signal by default<\u002Ftd><td>The report opens on <span class=\"rtl\">الطاقة · النوم · الالتزام · الشعور العام<\u002Fspan>. Weight and measurements are one card among several, and can be hidden per client by the nutritionist — permanently, with the client's agreement.<\u002Ftd><\u002Ftr>\n    <tr><td>Window<\u002Ftd><td>4 weeks default. Anything shorter over-reads noise; the UI says so: <span class=\"rtl\">التغيّرات الأسبوعية طبيعية — ننظر إلى أربعة أسابيع<\u002Fspan>.<\u002Ftd><\u002Ftr>\n    <tr><td>Shape<\u002Ftd><td>Comfortable band + trend line. No target line, because a target line makes every point above or below it a verdict.<\u002Ftd><\u002Ftr>\n    <tr><td>Narrative<\u002Ftd><td>Every report ends with one plain sentence written by the nutritionist, attributed and dated. The system never auto-generates a judgement.<\u002Ftd><\u002Ftr>\n    <tr><td>Export<\u002Ftd><td>PDF, RTL-correct, with the same band charts and no scores or grades.<\u002Ftd><\u002Ftr>\n  <\u002Ftbody><\u002Ftable>\n\n  <h3>3 · Nutritionist notes<\u002Fh3>\n  <div class=\"spec rtl\" style=\"max-width:520px\">\n    <div class=\"card\" style=\"margin:0\">\n      <div style=\"display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px\">\n        <span class=\"card-title\" style=\"margin:0\">ملاحظة الجلسة<\u002Fspan>\n        <span class=\"chip c-rest\" style=\"font-size:11px\"><span class=\"g\">🔒<\u002Fspan> خاصة بالمختص<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"font-size:14px;line-height:1.7;color:var(--n-700)\">تحسّن ملحوظ في انتظام الإفطار. نؤجّل الحديث عن الوزن هذا الشهر بناءً على طلبها.<\u002Fdiv>\n      <div class=\"small\" style=\"margin-top:10px;padding-top:8px;border-top:1px solid var(--n-100)\">د. ريم الحاج · ١٢ يوليو ٢٠٢٦ · ٩:٤٠ ص<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <ul class=\"tight\">\n    <li>Two note types with permanently distinct visual treatment: <strong>private<\u002Fstrong> (<span class=\"rtl\">خاصة بالمختص<\u002Fspan>, lock icon, olive-50 surface) and <strong>shared<\u002Fstrong> (<span class=\"rtl\">مرئية للعميل<\u002Fspan>, eye icon, white surface + olive-600 inline-start bar). The type is chosen before typing, never toggled after saving.<\u002Fli>\n    <li>Notes are always attributed and timestamped; edits show <span class=\"rtl\">عُدّلت<\u002Fspan> with the original preserved in history.<\u002Fli>\n    <li>Note templates per session type (first consult, follow-up, plan review) to cut typing on mobile.<\u002Fli>\n    <li>Quick-insert tags from the client's own record, so notes stay factual rather than evaluative.<\u002Fli>\n  <\u002Ful>\n\n  <h3>4 · Client messaging status<\u002Fh3>\n  <table>\n    <tbody><tr><th style=\"width:24%\">State<\u002Fth><th>Arabic<\u002Fth><th>Treatment<\u002Fth><\u002Ftr>\n    <tr><td>Sending<\u002Ftd><td class=\"rtl\">جارٍ الإرسال<\u002Ftd><td>Clock outline, n-500<\u002Ftd><\u002Ftr>\n    <tr><td>Sent<\u002Ftd><td class=\"rtl\">أُرسلت<\u002Ftd><td>Single check, n-500<\u002Ftd><\u002Ftr>\n    <tr><td>Delivered<\u002Ftd><td class=\"rtl\">وصلت<\u002Ftd><td>Double check, n-600<\u002Ftd><\u002Ftr>\n    <tr><td>Read<\u002Ftd><td class=\"rtl\">تمت القراءة ٩:٤٠ ص<\u002Ftd><td>Double check, olive-600 — plus the timestamp in text<\u002Ftd><\u002Ftr>\n    <tr><td>Awaiting reply<\u002Ftd><td class=\"rtl\">بانتظار رد المختصة — عادةً خلال ٢٤ ساعة<\u002Ftd><td>Inline banner under the last message. Sets expectations so silence doesn't read as rejection.<\u002Ftd><\u002Ftr>\n    <tr><td>Outside hours<\u002Ftd><td class=\"rtl\">خارج ساعات العمل · يصلك الرد صباح الأحد<\u002Ftd><td>Shown <em>before<\u002Fem> sending, not after<\u002Ftd><\u002Ftr>\n    <tr><td>Failed<\u002Ftd><td class=\"rtl\">لم تُرسل — أعد المحاولة<\u002Ftd><td>Clay-700 icon + text + retry button<\u002Ftd><\u002Ftr>\n    <tr><td>Urgent / medical<\u002Ftd><td class=\"rtl\">هذه ليست قناة طوارئ<\u002Ftd><td>Persistent footer in every thread with local emergency guidance<\u002Ftd><\u002Ftr>\n  <\u002Ftbody><\u002Ftable>\n\n  <h3>5 · Plan templates &amp; duplication<\u002Fh3>\n  <ul class=\"tight\">\n    <li>Template card shows: name, meals-per-day, dietary tags, <span class=\"rtl\">مستخدمة مع ١٢ عميلًا<\u002Fspan>, and <span class=\"rtl\">آخر تعديل قبل ٣ أيام<\u002Fspan>. Usage count is the primary sorting signal.<\u002Fli>\n    <li><strong>Duplicate<\u002Fstrong> (<span class=\"rtl\">نسخ<\u002Fspan>) produces <span class=\"rtl\">نسخة من: خطة متوازنة — ٣ وجبات<\u002Fspan> and opens the rename field focused. Duplication never silently overwrites.<\u002Fli>\n    <li>Assigning a template to a client <strong>forks it<\u002Fstrong>. Editing the client's plan never edits the template, and the client's plan shows <span class=\"rtl\">مبنية على: خطة متوازنة<\u002Fspan> with a link back.<\u002Fli>\n    <li>If the source template changes later, assigned plans show a non-blocking chip: <span class=\"rtl\">تحديث متاح من القالب<\u002Fspan> — with a diff view before applying.<\u002Fli>\n    <li>Bulk actions are capped and confirmed by name: assigning to more than 10 clients requires typing the template name.<\u002Fli>\n  <\u002Ful>\n\n  <h3>6 · Missed appointments &amp; incomplete plans<\u002Fh3>\n  <table>\n    <tbody><tr><th style=\"width:26%\">Event<\u002Fth><th>Arabic<\u002Fth><th>Behaviour<\u002Fth><\u002Ftr>\n    <tr><td>Missed session<\u002Ftd><td class=\"rtl\">لم تُعقد الجلسة<\u002Ftd><td>Neutral grey chip, dashed border. Not \"غاب\" and not red. Primary action is <span class=\"rtl\">إعادة الجدولة<\u002Fspan>; the reason field is optional and free-text.<\u002Ftd><\u002Ftr>\n    <tr><td>Late cancellation<\u002Ftd><td class=\"rtl\">أُلغيت قبل ٢ ساعة<\u002Ftd><td>Factual, no penalty language in the client UI. Policy consequences live in the booking terms, shown once at booking.<\u002Ftd><\u002Ftr>\n    <tr><td>Incomplete plan<\u002Ftd><td class=\"rtl\">الخطة غير مكتملة — بقيت أيام ٥–٧<\u002Ftd><td>Amber attention chip on the <em>nutritionist's<\u002Fem> side. The client sees only what is ready, never a half-built plan.<\u002Ftd><\u002Ftr>\n    <tr><td>No check-in, 3+ days<\u002Ftd><td class=\"rtl\">لم نسمع منك منذ ٣ أيام — كيف الأمور؟<\u002Ftd><td>One gentle message, once. No escalating nudges. After 14 days the client moves to a <span class=\"rtl\">متوقفة مؤقتًا<\u002Fspan> list on the dashboard rather than accumulating red flags.<\u002Ftd><\u002Ftr>\n    <tr><td>Return after a gap<\u002Ftd><td class=\"rtl\">أهلًا بعودتك — نبدأ من الأسبوع الحالي<\u002Ftd><td>History is preserved but the week resets clean. No catch-up backlog is ever presented.<\u002Ftd><\u002Ftr>\n  <\u002Ftbody><\u002Ftable>\n<\u002Fsection>\n\n<hr>\n\n<!-- 11 -->\n<section id=\"a11y\">\n  <div class=\"sec-num\">11<\u002Fdiv>\n  <h2>Accessibility rules<\u002Fh2>\n  <table>\n    <tbody><tr><th style=\"width:26%\">Requirement<\u002Fth><th>Implementation<\u002Fth><\u002Ftr>\n    <tr><td>Contrast<\u002Ftd><td>4.5:1 body, 3:1 large text and UI boundaries. Every token pair in §5 is pre-verified; the palette contains no legal way to place lime text on a light surface.<\u002Ftd><\u002Ftr>\n    <tr><td>Not colour alone<\u002Ftd><td>Every status carries colour + icon + text label, and in charts also a dash pattern. The system is legible in greyscale — test it that way before shipping.<\u002Ftd><\u002Ftr>\n    <tr><td>Text resizing<\u002Ftd><td>Layouts hold to 200% zoom and to iOS/Android largest text size. All type in <code>rem<\u002Fcode>; no fixed-height text containers; no truncation of essential values.<\u002Ftd><\u002Ftr>\n    <tr><td>Touch targets<\u002Ftd><td>48×48px minimum on mobile with 8px separation. Applies to checkboxes, chips, day cells, and message status controls.<\u002Ftd><\u002Ftr>\n    <tr><td>Focus<\u002Ftd><td>Two-tone ring — 2px lime-400 inner + 2px olive-950 outer — so focus is visible on both light and dark canvases. Never <code>outline: none<\u002Fcode>.<\u002Ftd><\u002Ftr>\n    <tr><td>Bilingual structure<\u002Ftd><td><code>lang<\u002Fcode> and <code>dir<\u002Fcode> set at the document root and switched together. Language switch preserves the current screen and scroll position.<\u002Ftd><\u002Ftr>\n    <tr><td>Screen reader<\u002Ftd><td>Arabic labels for every control, including icon-only buttons. The band exposes <code>role=\"img\"<\u002Fcode> with a sentence label: <span class=\"rtl\">ضمن النطاق المريح<\u002Fspan>. Charts have a table alternative, reachable, not hidden.<\u002Ftd><\u002Ftr>\n    <tr><td>Low digital literacy<\u002Ftd><td>One primary action per screen. Icons never appear without labels. Destructive actions confirm with the object's name. Plain-language errors that state the fix. An <span class=\"rtl\">اشرح لي<\u002Fspan> affordance on any screen with a chart.<\u002Ftd><\u002Ftr>\n    <tr><td>Motion<\u002Ftd><td><code>prefers-reduced-motion<\u002Fcode> removes all transforms and parallax; opacity fades remain.<\u002Ftd><\u002Ftr>\n    <tr><td>Non-judgemental language<\u002Ftd><td>Enforced in the shared copy lint: <span class=\"rtl\">فشل · ممنوع · سيء · غش · مثالي · يجب عليك<\u002Fspan> are blocked strings in client-facing copy, with suggested replacements.<\u002Ftd><\u002Ftr>\n    <tr><td>Sensitive data<\u002Ftd><td>Weight and measurements can be hidden per client at the account level. Hidden means hidden everywhere — reports, charts, notifications, and PDF export.<\u002Ftd><\u002Ftr>\n  <\u002Ftbody><\u002Ftable>\n<\u002Fsection>\n\n<hr>\n\n<!-- 12 -->\n<section id=\"dodont\">\n  <div class=\"sec-num\">12<\u002Fdiv>\n  <h2>Do &amp; don't<\u002Fh2>\n  <div class=\"dd\">\n    <div class=\"do\">\n      <h4>Do<\u002Fh4>\n      <ul>\n        <li>Use warm off-white <code>#FCFBF7<\u002Fcode> as the canvas and white for cards<\u002Fli>\n        <li>Reserve deep olive for identity surfaces and lime for exactly one element per screen<\u002Fli>\n        <li>Pair every status colour with an icon and a written label<\u002Fli>\n        <li>Show ranges and weeks; describe what happened<\u002Fli>\n        <li>Mirror the entire shell in Arabic, using logical CSS properties<\u002Fli>\n        <li>Attribute and date everything a human wrote<\u002Fli>\n        <li>Keep Arabic body text at 16px or larger with 1.75 line-height<\u002Fli>\n        <li>Let a missed day look like an empty slot<\u002Fli>\n      <\u002Ful>\n    <\u002Fdiv>\n    <div class=\"dont\">\n      <h4>Don't<\u002Fh4>\n      <ul>\n        <li>Put lime text or lime icons on white — 1.37:1, it is unreadable<\u002Fli>\n        <li>Introduce blue, teal, turquoise, neon lime, or military olive anywhere<\u002Fli>\n        <li>Uppercase, letter-space, italicise, or faux-bold Arabic<\u002Fli>\n        <li>Use red for a missed day, a skipped meal, or a late check-in<\u002Fli>\n        <li>Draw percentage-complete rings, target lines, or grades<\u002Fli>\n        <li>Scatter leaves through icons, bullets, spinners, or dividers<\u002Fli>\n        <li>Crop bodies, show before/after, or lead with a scale<\u002Fli>\n        <li>Label food as good, bad, forbidden, clean, or a cheat<\u002Fli>\n        <li>Send escalating reminders or streak-loss notifications<\u002Fli>\n        <li>Ship a hard-coded <code>margin-left<\u002Fcode><\u002Fli>\n      <\u002Ful>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <h3>The three look-alikes to test against<\u002Fh3>\n  <table>\n    <tbody><tr><th style=\"width:24%\">Must not resemble<\u002Fth><th>Tell<\u002Fth><th>Counter-move in this system<\u002Fth><\u002Ftr>\n    <tr><td>A pharmacy or hospital<\u002Ftd><td>Pure white, cold grey, blue accents, cross and capsule icons, sans-serif medical neutrality<\u002Ftd><td>Warm canvas, zero blue, no medical iconography outside the single clay medical flag, humanist Readex display<\u002Ftd><\u002Ftr>\n    <tr><td>A gym or slimming centre<\u002Ftd><td>Black + neon, condensed uppercase, before/after, BMI hero, countdown urgency, streak fire<\u002Ftd><td>No uppercase, no neon, no body-part imagery, weight demoted to one hideable card, forgiving weekly streaks<\u002Ftd><\u002Ftr>\n    <tr><td>An organic food shop<\u002Ftd><td>Kraft texture, hand-drawn produce, leaf bullets, artisanal serif wordmark, \"bio/eco\" badges<\u002Ftd><td>The leaf rule, no textures, no illustrated food, geometric-humanist type, no badge shapes<\u002Ftd><\u002Ftr>\n  <\u002Ftbody><\u002Ftable>\n<\u002Fsection>\n\n<hr>\n\n<!-- 13 -->\n<section id=\"mobile\">\n  <div class=\"sec-num\">13<\u002Fdiv>\n  <h2>Mobile app example — الشاشة الرئيسية<\u002Fh2>\n  <p class=\"lede\">Client home. One primary action, one lime element, no numbers in the default state.<\u002Fp>\n\n  <div class=\"mock-row\">\n    <div>\n      <div class=\"phone\">\n        <div class=\"ph-status\"><span>٩:٤١<\u002Fspan><span>▮▮▮<\u002Fspan><\u002Fdiv>\n        <div class=\"ph-head\">\n          <div class=\"greet\">صباح الخير<\u002Fdiv>\n          <div class=\"name\">ليلى<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"ph-body\">\n\n          <div class=\"card\">\n            <div class=\"card-title\">طاقتك اليوم<\u002Fdiv>\n            <div class=\"band\" role=\"img\" aria-label=\"ضمن النطاق المريح\">\n              <div class=\"comfort\" style=\"inset-inline-start:32%;width:38%\"><\u002Fdiv>\n              <div class=\"marker\" style=\"inset-inline-start:48%\"><\u002Fdiv>\n            <\u002Fdiv>\n            <div class=\"band-legend\"><span>أقل<\u002Fspan><span style=\"color:var(--olive-700);font-weight:600\">النطاق المريح<\u002Fspan><span>أكثر<\u002Fspan><\u002Fdiv>\n            <div class=\"chips\" style=\"margin-top:8px\"><span class=\"chip c-ok\"><span class=\"g\">✓<\u002Fspan> ضمن النطاق<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n\n          <div class=\"card\">\n            <div class=\"card-title\">عادات اليوم<\u002Fdiv>\n            <div class=\"chips\">\n              <span class=\"chip c-ok\"><span class=\"g\">✓<\u002Fspan> شرب الماء<\u002Fspan>\n              <span class=\"chip c-ok\"><span class=\"g\">✓<\u002Fspan> المشي<\u002Fspan>\n              <span class=\"chip c-none\"><span class=\"g\"><\u002Fspan> الخضار في الوجبة<\u002Fspan>\n              <span class=\"chip c-none\"><span class=\"g\"><\u002Fspan> النوم المبكر<\u002Fspan>\n            <\u002Fdiv>\n            <div class=\"small\" style=\"margin-top:6px\">اضغط على أي عادة لتسجيلها<\u002Fdiv>\n          <\u002Fdiv>\n\n          <div class=\"card\" style=\"border-inline-start:3px solid var(--olive-600)\">\n            <div style=\"display:flex;justify-content:space-between;align-items:center\">\n              <span class=\"card-title\" style=\"margin:0\">ملاحظة من د. ريم<\u002Fspan>\n              <span class=\"chip c-rest\" style=\"font-size:10px;padding:3px 8px\"><span class=\"g\">👁<\u002Fspan> مرئية لك<\u002Fspan>\n            <\u002Fdiv>\n            <div class=\"card-sub\" style=\"margin-top:6px;line-height:1.7\">طاقتك أفضل في أيام الإفطار المبكر. جرّبيه ثلاث مرات هذا الأسبوع.<\u002Fdiv>\n            <div class=\"small\" style=\"margin-top:8px\">تمت القراءة ٩:٤٠ ص<\u002Fdiv>\n          <\u002Fdiv>\n\n          <div class=\"card\" style=\"display:flex;justify-content:space-between;align-items:center\">\n            <div>\n              <div class=\"card-title\" style=\"margin:0\">جلسة المتابعة<\u002Fdiv>\n              <div class=\"card-sub\">الأحد ٢ أغسطس · ٥:٠٠ م<\u002Fdiv>\n            <\u002Fdiv>\n            <span class=\"chip c-rest\" style=\"font-size:11px\">تأكيد<\u002Fspan>\n          <\u002Fdiv>\n\n          <button class=\"btn btn-accent\" style=\"width:100%;justify-content:center;margin-bottom:14px\">إنهاء اليوم<\u002Fbutton>\n        <\u002Fdiv>\n        <div class=\"tabbar\">\n          <div class=\"on\"><span class=\"ic\"><\u002Fspan>اليوم<\u002Fdiv>\n          <div><span class=\"ic\"><\u002Fspan>خطتي<\u002Fdiv>\n          <div><span class=\"ic\"><\u002Fspan>تقدّمي<\u002Fdiv>\n          <div><span class=\"ic\"><\u002Fspan>المحادثة<\u002Fdiv>\n          <div><span class=\"ic\"><\u002Fspan>حسابي<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div>\n      <h4 style=\"margin-top:0\">Decisions visible in this screen<\u002Fh4>\n      <ul class=\"tight\">\n        <li>The olive-800 header block is the only identity surface; everything below it sits on warm canvas.<\u002Fli>\n        <li><strong>One lime element:<\u002Fstrong> <span class=\"rtl\">إنهاء اليوم<\u002Fspan>, the completion action. The band's comfort range uses lime-300 as a fill, which is a shape, not an accent moment.<\u002Fli>\n        <li>Two habits are done, two are not. The undone ones use the dashed neutral chip — visually the same weight as an empty slot.<\u002Fli>\n        <li>The nutritionist's note is marked as human: attributed, visibility-tagged, and given an olive edge bar that no system message uses.<\u002Fli>\n        <li>No calorie number, no weight, no percentage anywhere on the default home screen.<\u002Fli>\n        <li>Every tap target here clears 48px; the tab bar is 5 items with labels always visible.<\u002Fli>\n      <\u002Ful>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<hr>\n\n<!-- 14 -->\n<section id=\"dashboard\">\n  <div class=\"sec-num\">14<\u002Fdiv>\n  <h2>Nutritionist dashboard example — قائمة العملاء<\u002Fh2>\n  <p class=\"lede\">Dense, scannable, and mirrored: in Arabic the side rail sits on the right and the table reads right to left.<\u002Fp>\n\n  <div class=\"dash\">\n    <div class=\"dash-top\">\n      <strong style=\"font-family:var(--display);color:var(--olive-800);font-size:15px\">قوام<\u002Fstrong>\n      <div style=\"flex:1;background:var(--n-50);border:1px solid var(--n-500);border-radius:var(--radius-sm);padding:7px 12px;color:var(--n-500);font-size:12px\">بحث عن عميل…<\u002Fdiv>\n      <span class=\"chip c-rest\" style=\"font-size:11px\">د. ريم الحاج<\u002Fspan>\n    <\u002Fdiv>\n    <div class=\"dash-grid\">\n      <div class=\"dash-side\">\n        <div class=\"nav on\">العملاء<\u002Fdiv>\n        <div class=\"nav\">المواعيد<\u002Fdiv>\n        <div class=\"nav\">قوالب الخطط<\u002Fdiv>\n        <div class=\"nav\">الرسائل<\u002Fdiv>\n        <div class=\"nav\">التقارير<\u002Fdiv>\n        <div class=\"nav\">الإعدادات<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"dash-main\">\n        <div class=\"stat-row\">\n          <div class=\"stat\"><div class=\"k\">عملاء نشطون<\u002Fdiv><div class=\"v\">٣٤<\u002Fdiv><\u002Fdiv>\n          <div class=\"stat\"><div class=\"k\">يحتاجون متابعة<\u002Fdiv><div class=\"v\" style=\"color:var(--amber-700)\">٥<\u002Fdiv><\u002Fdiv>\n          <div class=\"stat\"><div class=\"k\">خطط غير مكتملة<\u002Fdiv><div class=\"v\">٢<\u002Fdiv><\u002Fdiv>\n          <div class=\"stat\"><div class=\"k\">رسائل بانتظار الرد<\u002Fdiv><div class=\"v\">٧<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n\n        <table class=\"dtable\">\n          <tbody><tr><th>العميل<\u002Fth><th>الحالة<\u002Fth><th>الالتزام هذا الأسبوع<\u002Fth><th>آخر تواصل<\u002Fth><th>الجلسة القادمة<\u002Fth><\u002Ftr>\n          <tr>\n            <td>ليلى نصار<\u002Ftd>\n            <td><span class=\"chip c-ok\" style=\"font-size:11px;padding:3px 9px\"><span class=\"g\">✓<\u002Fspan> ضمن المسار<\u002Fspan><\u002Ftd>\n            <td>٥ من ٧<\u002Ftd><td>اليوم ٩:٤٠ ص<\u002Ftd><td>الأحد ٢ أغسطس<\u002Ftd>\n          <\u002Ftr>\n          <tr>\n            <td>سامر خوري<\u002Ftd>\n            <td><span class=\"chip c-att\" style=\"font-size:11px;padding:3px 9px\"><span class=\"g\">!<\u002Fspan> يحتاج متابعة<\u002Fspan><\u002Ftd>\n            <td>٢ من ٧<\u002Ftd><td>قبل ٤ أيام<\u002Ftd><td>—<\u002Ftd>\n          <\u002Ftr>\n          <tr>\n            <td>هدى العلي<\u002Ftd>\n            <td><span class=\"chip c-none\" style=\"font-size:11px;padding:3px 9px\"><span class=\"g\"><\u002Fspan> لم تُعقد الجلسة<\u002Fspan><\u002Ftd>\n            <td>٤ من ٧<\u002Ftd><td>قبل يومين<\u002Ftd><td style=\"color:var(--olive-700);font-weight:600\">إعادة جدولة<\u002Ftd>\n          <\u002Ftr>\n          <tr>\n            <td>مازن درويش<\u002Ftd>\n            <td><span class=\"chip c-med\" style=\"font-size:11px;padding:3px 9px\"><span class=\"g\">⬡<\u002Fspan> تنبيه طبي<\u002Fspan><\u002Ftd>\n            <td>٦ من ٧<\u002Ftd><td>أمس<\u002Ftd><td>الثلاثاء ٤ أغسطس<\u002Ftd>\n          <\u002Ftr>\n          <tr style=\"background:var(--olive-50)\">\n            <td>رنا الشامي<\u002Ftd>\n            <td><span class=\"chip c-rest\" style=\"font-size:11px;padding:3px 9px\"><span class=\"g\">☾<\u002Fspan> متوقفة مؤقتًا<\u002Fspan><\u002Ftd>\n            <td>—<\u002Ftd><td>قبل ١٦ يومًا<\u002Ftd><td>—<\u002Ftd>\n          <\u002Ftr>\n        <\u002Ftbody><\u002Ftable>\n        <div class=\"small\" style=\"margin-top:10px;text-align:right\">تُحدَّث الحالات يوميًا في منتصف الليل · <span style=\"color:var(--olive-700);font-weight:600\">تصدير التقرير<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <h4>Decisions visible in this screen<\u002Fh4>\n  <ul class=\"tight\">\n    <li>The rail is on the <strong>right<\u002Fstrong> and every column reads right to left — the shell mirrors, not just the text.<\u002Fli>\n    <li>The four summary stats are workload signals for the nutritionist, not client scores. Only <span class=\"rtl\">يحتاجون متابعة<\u002Fspan> is coloured, and it is amber, not red.<\u002Fli>\n    <li>Adherence reads <span class=\"rtl\">٥ من ٧<\u002Fspan> — a fraction of a week, never a percentage and never a grade.<\u002Fli>\n    <li>A missed session is neutral and its action column offers <span class=\"rtl\">إعادة الجدولة<\u002Fspan> rather than recording a strike.<\u002Fli>\n    <li>The paused client is greyed into a rest state instead of accumulating alerts — the fourteen-day rule from §10 made visible.<\u002Fli>\n    <li>Clay is used exactly once, for a genuine medical flag. Lime appears nowhere on this screen; a data table is not an identity surface.<\u002Fli>\n  <\u002Ful>\n<\u002Fsection>\n\n<hr>\n\n<!-- 15 -->\n<section id=\"figma\">\n  <div class=\"sec-num\">15<\u002Fdiv>\n  <h2>Figma-ready token table<\u002Fh2>\n  <p class=\"lede\">Ready to paste into Figma Variables or Tokens Studio. Collection 1 = <code>primitive<\u002Fcode> (raw values, hidden from designers). Collection 2 = <code>semantic<\u002Fcode> (aliases, the only thing bound to components). Modes: <code>light<\u002Fcode> · <code>dark<\u002Fcode>, and <code>ar<\u002Fcode> · <code>en<\u002Fcode> for typography.<\u002Fp>\n\n  <table>\n    <tbody><tr><th style=\"width:30%\">Semantic token<\u002Fth><th style=\"width:24%\">Alias → primitive<\u002Fth><th style=\"width:14%\">Light value<\u002Fth><th>Bound to<\u002Fth><\u002Ftr>\n    <tr><td class=\"tok\">color.bg.canvas<\u002Ftd><td class=\"tok\">{neutral.25}<\u002Ftd><td><code>#FCFBF7<\u002Fcode><\u002Ftd><td>App frame background<\u002Ftd><\u002Ftr>\n    <tr><td class=\"tok\">color.bg.surface<\u002Ftd><td class=\"tok\">{neutral.0}<\u002Ftd><td><code>#FFFFFF<\u002Fcode><\u002Ftd><td>Card, sheet, table body<\u002Ftd><\u002Ftr>\n    <tr><td class=\"tok\">color.bg.sunken<\u002Ftd><td class=\"tok\">{neutral.50}<\u002Ftd><td><code>#F7F5EF<\u002Fcode><\u002Ftd><td>Table header, band track<\u002Ftd><\u002Ftr>\n    <tr><td class=\"tok\">color.bg.brand.solid<\u002Ftd><td class=\"tok\">{olive.800}<\u002Ftd><td><code>#2E461A<\u002Fcode><\u002Ftd><td>App header, sign-in, report cover<\u002Ftd><\u002Ftr>\n    <tr><td class=\"tok\">color.bg.brand.subtle<\u002Ftd><td class=\"tok\">{olive.50}<\u002Ftd><td><code>#F5F8EF<\u002Fcode><\u002Ftd><td>Selected row, quiet emphasis<\u002Ftd><\u002Ftr>\n    <tr><td class=\"tok\">color.bg.accent<\u002Ftd><td class=\"tok\">{lime.400}<\u002Ftd><td><code>#CBEA24<\u002Fcode><\u002Ftd><td>Accent button, comfort range<\u002Ftd><\u002Ftr>\n    <tr><td class=\"tok\">color.text.primary<\u002Ftd><td class=\"tok\">{neutral.900}<\u002Ftd><td><code>#1C1B17<\u002Fcode><\u002Ftd><td>Body text<\u002Ftd><\u002Ftr>\n    <tr><td class=\"tok\">color.text.secondary<\u002Ftd><td class=\"tok\">{neutral.600}<\u002Ftd><td><code>#605D50<\u002Fcode><\u002Ftd><td>Helper, timestamp<\u002Ftd><\u002Ftr>\n    <tr><td class=\"tok\">color.text.brand<\u002Ftd><td class=\"tok\">{olive.700}<\u002Ftd><td><code>#3D5C21<\u002Fcode><\u002Ftd><td>Link, active tab<\u002Ftd><\u002Ftr>\n    <tr><td class=\"tok\">color.text.inverse<\u002Ftd><td class=\"tok\">{neutral.25}<\u002Ftd><td><code>#FCFBF7<\u002Fcode><\u002Ftd><td>Text on olive-600+<\u002Ftd><\u002Ftr>\n    <tr><td class=\"tok\">color.text.onAccent<\u002Ftd><td class=\"tok\">{olive.950}<\u002Ftd><td><code>#16220D<\u002Fcode><\u002Ftd><td>Text on lime — only legal pair<\u002Ftd><\u002Ftr>\n    <tr><td class=\"tok\">color.border.divider<\u002Ftd><td class=\"tok\">{neutral.200}<\u002Ftd><td><code>#E2DFD3<\u002Fcode><\u002Ftd><td>Decorative rules<\u002Ftd><\u002Ftr>\n    <tr><td class=\"tok\">color.border.interactive<\u002Ftd><td class=\"tok\">{neutral.500}<\u002Ftd><td><code>#837F6E<\u002Fcode><\u002Ftd><td>Input, checkbox, chip<\u002Ftd><\u002Ftr>\n    <tr><td class=\"tok\">color.border.selected<\u002Ftd><td class=\"tok\">{olive.600}<\u002Ftd><td><code>#4D7428<\u002Fcode><\u002Ftd><td>Selected control, 2px<\u002Ftd><\u002Ftr>\n    <tr><td class=\"tok\">color.focus.ring<\u002Ftd><td class=\"tok\">{lime.400}<\u002Ftd><td><code>#CBEA24<\u002Fcode><\u002Ftd><td>Focus inner ring<\u002Ftd><\u002Ftr>\n    <tr><td class=\"tok\">color.focus.halo<\u002Ftd><td class=\"tok\">{olive.950}<\u002Ftd><td><code>#16220D<\u002Fcode><\u002Ftd><td>Focus outer ring<\u002Ftd><\u002Ftr>\n    <tr><td class=\"tok\">color.action.primary.bg<\u002Ftd><td class=\"tok\">{olive.600}<\u002Ftd><td><code>#4D7428<\u002Fcode><\u002Ftd><td>Primary button<\u002Ftd><\u002Ftr>\n    <tr><td class=\"tok\">color.action.primary.hover<\u002Ftd><td class=\"tok\">{olive.700}<\u002Ftd><td><code>#3D5C21<\u002Fcode><\u002Ftd><td>Primary hover<\u002Ftd><\u002Ftr>\n    <tr><td class=\"tok\">color.action.primary.pressed<\u002Ftd><td class=\"tok\">{olive.800}<\u002Ftd><td><code>#2E461A<\u002Fcode><\u002Ftd><td>Primary pressed<\u002Ftd><\u002Ftr>\n    <tr><td class=\"tok\">color.action.disabled.bg<\u002Ftd><td class=\"tok\">{neutral.100}<\u002Ftd><td><code>#EFEDE4<\u002Fcode><\u002Ftd><td>Disabled fill<\u002Ftd><\u002Ftr>\n    <tr><td class=\"tok\">color.status.onTrack.fg<\u002Ftd><td class=\"tok\">{olive.700}<\u002Ftd><td><code>#3D5C21<\u002Fcode><\u002Ftd><td>On-track chip text<\u002Ftd><\u002Ftr>\n    <tr><td class=\"tok\">color.status.onTrack.bg<\u002Ftd><td class=\"tok\">{olive.100}<\u002Ftd><td><code>#E8F0DA<\u002Fcode><\u002Ftd><td>On-track chip fill<\u002Ftd><\u002Ftr>\n    <tr><td class=\"tok\">color.status.attention.fg<\u002Ftd><td class=\"tok\">{amber.700}<\u002Ftd><td><code>#7A5209<\u002Fcode><\u002Ftd><td>Needs-follow-up text<\u002Ftd><\u002Ftr>\n    <tr><td class=\"tok\">color.status.attention.bg<\u002Ftd><td class=\"tok\">{amber.100}<\u002Ftd><td><code>#FBF0D8<\u002Fcode><\u002Ftd><td>Needs-follow-up fill<\u002Ftd><\u002Ftr>\n    <tr><td class=\"tok\">color.status.incomplete.fg<\u002Ftd><td class=\"tok\">{neutral.700}<\u002Ftd><td><code>#46443B<\u002Fcode><\u002Ftd><td>Missed/incomplete text<\u002Ftd><\u002Ftr>\n    <tr><td class=\"tok\">color.status.incomplete.bg<\u002Ftd><td class=\"tok\">{neutral.100}<\u002Ftd><td><code>#EFEDE4<\u002Fcode><\u002Ftd><td>Missed/incomplete fill — dashed border<\u002Ftd><\u002Ftr>\n    <tr><td class=\"tok\">color.status.medical.fg<\u002Ftd><td class=\"tok\">{clay.700}<\u002Ftd><td><code>#82291B<\u002Fcode><\u002Ftd><td>Medical flag text<\u002Ftd><\u002Ftr>\n    <tr><td class=\"tok\">color.status.medical.bg<\u002Ftd><td class=\"tok\">{clay.100}<\u002Ftd><td><code>#FAE9E4<\u002Fcode><\u002Ftd><td>Medical flag fill<\u002Ftd><\u002Ftr>\n    <tr><td class=\"tok\">color.viz.band.range<\u002Ftd><td class=\"tok\">{lime.300}<\u002Ftd><td><code>#D9F25C<\u002Fcode><\u002Ftd><td>Comfort range fill<\u002Ftd><\u002Ftr>\n    <tr><td class=\"tok\">color.viz.band.edge<\u002Ftd><td class=\"tok\">{lime.600}<\u002Ftd><td><code>#8CA60C<\u002Fcode><\u002Ftd><td>Range boundary, 2px<\u002Ftd><\u002Ftr>\n    <tr><td class=\"tok\">color.viz.band.marker<\u002Ftd><td class=\"tok\">{olive.900}<\u002Ftd><td><code>#223414<\u002Fcode><\u002Ftd><td>Current position marker<\u002Ftd><\u002Ftr>\n    <tr><td class=\"tok\">radius.card<\u002Ftd><td class=\"tok\">{radius.lg}<\u002Ftd><td><code>16px<\u002Fcode><\u002Ftd><td>Card, sheet<\u002Ftd><\u002Ftr>\n    <tr><td class=\"tok\">radius.control<\u002Ftd><td class=\"tok\">{radius.sm}<\u002Ftd><td><code>8px<\u002Fcode><\u002Ftd><td>Button, input<\u002Ftd><\u002Ftr>\n    <tr><td class=\"tok\">radius.pill<\u002Ftd><td class=\"tok\">{radius.pill}<\u002Ftd><td><code>999px<\u002Fcode><\u002Ftd><td>Chip, band<\u002Ftd><\u002Ftr>\n    <tr><td class=\"tok\">space.card.padding<\u002Ftd><td class=\"tok\">{space.16 / 20}<\u002Ftd><td><code>16 / 20px<\u002Fcode><\u002Ftd><td>Mobile / desktop card<\u002Ftd><\u002Ftr>\n    <tr><td class=\"tok\">space.touch.min<\u002Ftd><td class=\"tok\">{space.48}<\u002Ftd><td><code>48px<\u002Fcode><\u002Ftd><td>Minimum target<\u002Ftd><\u002Ftr>\n    <tr><td class=\"tok\">elevation.card<\u002Ftd><td class=\"tok\">{shadow.1}<\u002Ftd><td><code>rgba(34,52,20,.06)<\u002Fcode><\u002Ftd><td>Resting card<\u002Ftd><\u002Ftr>\n    <tr><td class=\"tok\">elevation.overlay<\u002Ftd><td class=\"tok\">{shadow.3}<\u002Ftd><td><code>rgba(34,52,20,.12)<\u002Fcode><\u002Ftd><td>Sheet, modal<\u002Ftd><\u002Ftr>\n    <tr><td class=\"tok\">font.display<\u002Ftd><td class=\"tok\">Readex Pro<\u002Ftd><td><code>500 / 600<\u002Fcode><\u002Ftd><td>Headings, both scripts<\u002Ftd><\u002Ftr>\n    <tr><td class=\"tok\">font.body<\u002Ftd><td class=\"tok\">IBM Plex Sans Arabic<\u002Ftd><td><code>400 / 600<\u002Fcode><\u002Ftd><td>UI, body, data<\u002Ftd><\u002Ftr>\n    <tr><td class=\"tok\">type.lineHeight.body<\u002Ftd><td class=\"tok\">mode: ar / en<\u002Ftd><td><code>1.75 / 1.6<\u002Fcode><\u002Ftd><td>Switches on locale mode<\u002Ftd><\u002Ftr>\n    <tr><td class=\"tok\">type.letterSpacing.ar<\u002Ftd><td class=\"tok\">fixed<\u002Ftd><td><code>0<\u002Fcode><\u002Ftd><td>Locked — protects cursive joining<\u002Ftd><\u002Ftr>\n  <\u002Ftbody><\u002Ftable>\n\n  <div class=\"note\"><strong>Dark mode.<\u002Fstrong> Only <code>bg<\u002Fcode>, <code>text<\u002Fcode>, and <code>border<\u002Fcode> tokens remap: canvas → olive-950, surface → olive-900, text.primary → neutral-25, border.interactive → neutral-400. Brand and status hues stay identical, which keeps the verified pairs intact — lime-400 on olive-950 is 12.09:1, and lime remains banned as text on any light surface in either mode.<\u002Fdiv>\n\n  <p class=\"small\" style=\"margin-top:32px;padding-top:20px;border-top:1px solid var(--n-200)\">Qiwam / قوام — Brand &amp; Design System v1.0 · All contrast ratios in this document were calculated against WCAG 2.2 relative luminance, not estimated. Fonts: Readex Pro and IBM Plex Sans Arabic, both SIL Open Font License.<\u002Fp>\n<\u002Fsection>\n\n<\u002Fdiv>\n\n\n<\u002Fbody><\u002Fhtml>"

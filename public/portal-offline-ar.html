<!doctype html>
<!--
  The client portal's offline fallback, in Arabic.

  A static file rather than a Next.js route on purpose: this page has to render
  when the network is gone, which rules out anything that needs the server. It
  is precached by `portal-sw.js` at install time and served only when a
  navigation inside the portal fails. Its English twin is `portal-offline-en.html`;
  the worker picks between them by reading the locale out of its own
  registration scope, so neither file has to know how it was chosen.

  Everything is inline — no stylesheet, no font file, no image request. A page
  shown precisely when the network is unavailable cannot depend on a second
  fetch succeeding. The colours are the portal's own brand tokens written as
  literals for the same reason `src/features/portal/pwa/brand.ts` exists.
-->
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#72AE34" />
    <title>لا يوجد اتصال — بوابة المشتركين</title>
    <style>
      :root {
        --brand: #72AE34;
        --bg: #ffffff;
        --fg: #1a1c19;
        --muted: #5c6157;
        --border: #e3e6e0;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
      }

      body {
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: calc(1.5rem + env(safe-area-inset-top, 0px)) calc(1.5rem + env(safe-area-inset-right, 0px))
          calc(1.5rem + env(safe-area-inset-bottom, 0px)) calc(1.5rem + env(safe-area-inset-left, 0px));
        background: var(--bg);
        color: var(--fg);
        font-family: 'IBM Plex Sans Arabic', 'Almarai', ui-sans-serif, system-ui, sans-serif;
        line-height: 1.6;
        -webkit-text-size-adjust: 100%;
      }

      .card {
        width: 100%;
        max-width: 26rem;
        text-align: center;
      }

      .mark {
        width: 4rem;
        height: 4rem;
        margin: 0 auto 1.25rem;
        display: grid;
        place-items: center;
        border-radius: 1.25rem;
        background: var(--brand);
      }

      h1 {
        margin: 0 0 0.5rem;
        font-size: 1.25rem;
        font-weight: 600;
      }

      p {
        margin: 0 0 1.75rem;
        font-size: 0.9375rem;
        color: var(--muted);
      }

      button {
        font: inherit;
        font-weight: 600;
        color: #ffffff;
        background: var(--brand);
        border: 0;
        border-radius: 0.75rem;
        padding: 0.75rem 1.75rem;
        min-height: 2.75rem;
        cursor: pointer;
      }

      button:focus-visible {
        outline: 2px solid var(--brand);
        outline-offset: 3px;
      }

      @media (prefers-reduced-motion: no-preference) {
        button {
          transition: opacity 150ms ease;
        }
      }

      button:hover {
        opacity: 0.9;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="mark" aria-hidden="true">
        <svg
          width="34"
          height="34"
          viewBox="0 0 24 24"
          fill="none"
          stroke="#ffffff"
          stroke-width="1.5"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M7 21h10" />
          <path d="M12 21a9 9 0 0 0 9-9H3a9 9 0 0 0 9 9Z" />
          <path
            d="M11.38 12a2.4 2.4 0 0 1-.4-4.77 2.4 2.4 0 0 1 3.2-2.77 2.4 2.4 0 0 1 3.47-.63 2.4 2.4 0 0 1 3.37 3.37 2.4 2.4 0 0 1-1.1 3.7 2.51 2.51 0 0 1 .03 1.1"
          />
          <path d="m13 12 4-4" />
          <path d="M10.9 7.25A3.99 3.99 0 0 0 4 10c0 .73.2 1.41.54 2" />
        </svg>
      </div>

      <h1>لا يوجد اتصال بالإنترنت</h1>
      <p>تعذّر الوصول إلى بوابة المشتركين الآن. تحقّق من اتصالك ثم أعد المحاولة.</p>

      <button type="button" onclick="location.reload()">إعادة المحاولة</button>
    </main>
  </body>
</html>
